/* ================================================================
   TOKENS
   Washi, sumi and one red. Everything else on the page is ink at a
   different strength — colour is kept for the drinks themselves and
   for the seal.
   ================================================================ */

:root {
  color-scheme: light;

  /* paper */
  --paper:      #ECE6DA;   /* the menu itself */
  --paper-hi:   #F6F2EA;   /* a fresh card laid on top of it */
  --paper-lo:   #E2DACB;   /* pressed into it */
  --paper-edge: #D3C8B5;

  /* ink */
  --ink:   #26221E;
  --ink-2: #4C453E;
  --ink-3: #7D7468;
  --ink-4: #A79E90;
  --rule:   rgba(38, 34, 30, .13);
  --rule-2: rgba(38, 34, 30, .24);

  /* the few colours allowed onto the page */
  --shu:    #B0392A;   /* vermilion — the seal, and nothing else that matters less */
  --shu-2:  #93301F;
  --matcha: #66753F;   /* zero sugar */
  --kincha: #9C7134;   /* egg white, low ABV */
  --smoke:  #687579;
  --hinoki: #CDAA7E;

  /* corners: worn soft, like a lacquer tray or a stoneware cup */
  --radius:    10px;
  --radius-lg: 18px;

  /* how the room is lit; the hours below move these */
  --sun:     rgba(255, 252, 244, .55);  /* daylight from the window, top left */
  --lamp:    rgba(214, 146, 72, .16);   /* the paper lantern over the bar */
  --lantern: 1;                         /* how lit the lantern is, 0–1 */

  /* type — Garamond for reading, Cormorant for names, Jost for small print.
     Thai falls through to Trirong and Anuphan glyph by glyph. */
  --display: 'Cormorant Garamond', 'Trirong', 'Iowan Old Style', Georgia, serif;
  --serif:   'EB Garamond', 'Trirong', 'Iowan Old Style', Georgia, serif;
  --sans:    'Jost', 'Anuphan', 'Avenir Next', 'Helvetica Neue', system-ui, sans-serif;

  --gutter: clamp(20px, 5vw, 48px);
  --measure: 62ch;
  --ease: cubic-bezier(.2, .7, .2, 1);
}

/* Afternoon is bright and the lantern is off. Evening is the room as it
   should be. After eleven the paper warms; in the small hours it dims. */
:root[data-phase='day'] {
  --paper: #EEEAE2;
  --sun: rgba(255, 255, 250, .7);
  --lamp: rgba(214, 146, 72, .05);
  --lantern: .15;
}
:root[data-phase='late'] {
  --paper: #E9E1D2;
  --sun: rgba(255, 248, 232, .3);
  --lamp: rgba(214, 140, 64, .22);
}
:root[data-phase='lastcall'] {
  --paper: #E3D9C8;
  --sun: rgba(255, 244, 226, .18);
  --lamp: rgba(196, 122, 56, .18);
  --lantern: .7;
}

/* ================================================================
   BASE
   The page is a sheet of washi. The fibres are drawn once at boot
   (scenes.js) and laid in as --washi; the light sits on top of it.
   ================================================================ */

*, *::before, *::after { box-sizing: border-box; }

html { background: var(--paper); }

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background-color: var(--paper);
  background-image: var(--washi, none);
  background-size: 420px 420px;
  color: var(--ink);
  font-family: var(--serif);
  font-size: 1.0625rem;
  line-height: 1.55;
  font-kerning: normal;
  font-variant-ligatures: common-ligatures;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  transition: background-color 2s ease;
}

/* daylight from the upper left, the lantern from above — both on the paper,
   neither on the type */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(90% 60% at 8% -6%, var(--sun), transparent 70%),
    radial-gradient(60% 42% at 50% 4%, var(--lamp), transparent 72%),
    radial-gradient(120% 90% at 50% 120%, rgba(120, 96, 64, .10), transparent 60%);
  transition: background 2s ease;
}

.page {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  min-height: 100dvh;
  /* clip, not hidden: hidden makes this a scroll container and the sticky
     header inside it stops sticking */
  overflow-x: clip;
}

button, input, textarea, select { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
img, svg { max-width: 100%; }

/* the ring follows whatever corners the thing it's on has */
:focus-visible {
  outline: 1.5px solid var(--shu);
  outline-offset: 3px;
}

::selection { background: rgba(176, 57, 42, .18); }

/* one Thai word, kept whole on its line (txt in core.js) */
.tw { white-space: nowrap; }

/* Small capitals for every label on the page. Thai has no capitals, and
   letter-spacing breaks its vowel marks apart, so it gets neither. */
.caps {
  font-family: var(--sans);
  font-size: .6875rem;
  font-weight: 500;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--ink-3);
}
:lang(th) .caps {
  font-size: .8125rem;
  letter-spacing: .01em;
  text-transform: none;
}

[hidden] { display: none !important; }

/* ================================================================
   CHROME — the name, the language, the way to the orders
   ================================================================ */

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 14px var(--gutter) 12px;
  padding-top: max(14px, env(safe-area-inset-top));
  box-shadow: 0 1px 0 transparent;
  transition: box-shadow .3s ease;
}
/* at the top of the page the bar is just the page; once the menu slides
   under it, it becomes a sheet of the same paper with a hairline edge */
.topbar.scrolled {
  background: var(--washi, none) 0 0 / 420px 420px, color-mix(in srgb, var(--paper) 93%, transparent);
  -webkit-backdrop-filter: blur(14px) saturate(1.1);
  backdrop-filter: blur(14px) saturate(1.1);
  box-shadow: 0 1px 0 var(--rule);
}

.wordmark {
  margin: 0;
  white-space: nowrap;
  font-family: var(--display);
  font-size: clamp(1.75rem, 4vw, 2.125rem);
  font-weight: 600;
  line-height: 1;
  letter-spacing: -.005em;
}
.home {
  padding: 0;
  border: 0;
  background: none;
  font: inherit;
  letter-spacing: inherit;
  cursor: pointer;
  touch-action: manipulation;
  transition: color .3s ease;
}
.home:hover { color: var(--ink-2); }
.wordmark .amp { color: var(--shu); }

/* the golf tee is the exclamation mark in Paul's Bar! — on the baseline,
   hard against the r, and the same height as the capitals */
.tee {
  display: inline-block;
  padding: 10px 6px;
  margin: -10px -6px -10px -7px;
  border: 0;
  background: none;
  font: inherit;
  line-height: 1;
  vertical-align: baseline;
  cursor: pointer;
  touch-action: manipulation;
}
.tee svg {
  display: inline-block;
  vertical-align: -.04em;
  width: auto;
  height: .7em;
  overflow: visible;
  transform-box: fill-box;
  transform-origin: 50% 96%;
  animation: tee-shiver 3.6s ease-in-out infinite;
}
.tee:hover svg { animation-duration: 1.2s; }
/* still most of the time, then a small shiver that catches the eye */
@keyframes tee-shiver {
  0%, 74%, 100% { transform: rotate(0); }
  77% { transform: rotate(-9deg); }
  81% { transform: rotate(8deg); }
  85% { transform: rotate(-6deg); }
  89% { transform: rotate(4deg); }
  93% { transform: rotate(-2deg); }
}

.topbar-right {
  position: relative;
  display: flex;
  align-items: center;
  gap: 6px;
  margin-left: auto;
}

/* EN · ไทย — two words, the live one underlined */
.langs { display: flex; align-items: center; }
.lang {
  padding: 8px 7px;
  border: 0;
  background: none;
  color: var(--ink-3);
  font-family: var(--sans);
  font-size: .8125rem;
  font-weight: 500;
  letter-spacing: .08em;
  cursor: pointer;
  transition: color .2s;
}
.lang > span { padding-bottom: 2px; border-bottom: 1px solid transparent; transition: border-color .2s; }
.lang:hover { color: var(--ink); }
.lang[aria-pressed='true'] { color: var(--ink); }
.lang[aria-pressed='true'] > span { border-color: var(--ink); }
.langs .sep { width: 1px; height: 12px; background: var(--rule-2); }

/* two strokes, not three — it is a menu card, not an app */
.burger {
  position: relative;
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  margin-right: -8px;
  padding: 0;
  border: 0;
  background: none;
  color: var(--ink);
  cursor: pointer;
}
.burger svg { width: 24px; height: 24px; }
.burger svg path { transition: transform .3s var(--ease); transform-box: fill-box; transform-origin: center; }
.burger[aria-expanded='true'] .l1 { transform: translateY(3px) rotate(45deg); }
.burger[aria-expanded='true'] .l2 { transform: translateY(-3px) rotate(-45deg); }
.burger .count { position: absolute; top: 3px; right: 2px; }

.nav-menu {
  position: absolute;
  top: calc(100% + 10px);
  right: -8px;
  z-index: 40;
  display: grid;
  min-width: 200px;
  padding: 8px;
  border-radius: 14px;
  background: var(--paper-hi);
  box-shadow: 0 1px 0 rgba(255, 255, 255, .7) inset, 0 0 0 1px var(--rule), 0 24px 40px -24px rgba(60, 44, 28, .45);
  animation: menu-in .22s var(--ease);
}
@keyframes menu-in { from { opacity: 0; transform: translateY(-6px); } }
.nav-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 14px;
  border: 0;
  background: none;
  font-family: var(--display);
  font-size: 1.375rem;
  font-weight: 600;
  line-height: 1.1;
  text-align: left;
  color: var(--ink-3);
  cursor: pointer;
  transition: color .2s, background-color .2s;
}
.nav-item + .nav-item { border-top: 1px solid var(--rule); }
.nav-item:hover { color: var(--ink); }
.nav-item[aria-selected='true'] { color: var(--ink); }

/* the one number on the page that should get your attention */
.count {
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 9px;
  background: var(--shu);
  color: #FBF5EC;
  font-family: var(--sans);
  font-size: .6875rem;
  font-weight: 500;
  line-height: 18px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.count.pulse { animation: pulse .9s ease-out 2; }
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(176, 57, 42, 0); }
  35%      { box-shadow: 0 0 0 6px rgba(176, 57, 42, .2); }
}

main {
  max-width: 1120px;
  margin: 0 auto;
  padding: 8px var(--gutter) 120px;
}

/* ================================================================
   THE BAR — a lit back bar, a paper lantern, and the tools on the
   counter, each with a party piece when tapped; painted in on arrival
   ================================================================ */

/* The bar runs the full width of the window, out past the page's
   margins. The drawing keeps the stage at its size in the middle
   (bar.js) and only the bar gets longer. */
.hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-inline: calc(50% - 50vw);
}

.scene { position: relative; width: 100%; }
.scene svg { display: block; width: 100%; height: auto; overflow: visible; }

/* Everything that moves turns about its own local origin, which the
   drawing puts where it pivots: the cord, the rim, the base. The
   position lives on a parent group, because a CSS transform replaces an
   SVG transform attribute on the same element. */
.scene .moves { transform-box: view-box; transform-origin: 0 0; }

/* the paper lantern sways a little on its cord and is lit by the hour */
.lantern { animation: lantern 7s ease-in-out infinite alternate; }
@keyframes lantern {
  from { transform: rotate(-1.4deg); }
  to   { transform: rotate(1.4deg); }
}
.lantern-glow { opacity: var(--lantern); transition: opacity 2s ease; }
/* the strip of light behind each shelf, never quite off */
.shelf-glow { opacity: calc(.45 + var(--lantern) * .55); transition: opacity 2s ease; }
.lantern-light { opacity: calc(.35 + var(--lantern) * .65); transition: opacity 2s ease; }

/* a phone will not reliably fire a tap on an SVG shape, so each piece is
   covered by a real button, which a keyboard can reach too. bar.js sets
   where each one sits along the bar. */
.piece-taps { position: absolute; inset: 22% 0 14%; z-index: 1; }
.piece-tap {
  position: absolute;
  top: 0;
  bottom: 0;
  padding: 0;
  border: 0;
  border-radius: var(--radius);
  background: none;
  cursor: pointer;
  touch-action: manipulation;
}
.piece-tap:focus-visible { outline-offset: -6px; }

/* ---------- the party pieces, ten seconds each ---------- */

.act { display: none; }
.acting .act { display: inline; }

/* the wine bottles leave the bar and go round in the air */
.piece-juggle.acting .still { visibility: hidden; }
.bottle { animation: juggle 1.3s linear infinite; }
@keyframes juggle {
  0%   { transform: translate(-13px, 18px) rotate(0deg); }
  25%  { transform: translate(-10px, -16px) rotate(180deg); }
  50%  { transform: translate(11px, -23px) rotate(360deg); }
  75%  { transform: translate(14px, 14px) rotate(540deg); }
  100% { transform: translate(-13px, 18px) rotate(720deg); }
}

/* the spoon goes round the mixing glass */
.piece-stir.acting .spoon { animation: stir .8s ease-in-out infinite alternate; }
@keyframes stir {
  from { transform: rotate(-7deg); }
  to   { transform: rotate(7deg); }
}

/* the shaker gives a hard shake with nobody holding it */
.piece-shake.acting .shake-body { animation: hard-shake .17s ease-in-out infinite alternate; }
@keyframes hard-shake {
  from { transform: translate(-1.6px, .6px) rotate(-8deg); }
  to   { transform: translate(1.6px, -2.4px) rotate(8deg); }
}

/* the ball is chipped off its tee and drops into the coupe */
.piece-chip.acting .chip-ball { animation: chip 2.4s ease-in-out infinite; }
@keyframes chip {
  0%, 26%  { transform: translate(0, 0); opacity: 1; }
  48%      { transform: translate(18px, -40px); opacity: 1; }
  68%      { transform: translate(36px, -12px); opacity: 1; }
  72%, 94% { transform: translate(38px, -2px); opacity: 0; }
  100%     { transform: translate(0, 0); opacity: 1; }
}

/* sits on the front edge of the counter */
.choice {
  position: relative;
  z-index: 2;
  margin-top: 18px;
  border-radius: var(--radius);
  display: inline-flex;
  align-items: center;
  gap: 11px;
  padding: 13px 24px 13px 20px;
  border: 0;
  background: var(--ink);
  color: var(--paper-hi);
  font-family: var(--sans);
  font-size: .72rem;
  font-weight: 500;
  letter-spacing: .22em;
  text-transform: uppercase;
  cursor: pointer;
  box-shadow: 0 14px 24px -18px rgba(38, 34, 30, .7);
  transition: background-color .3s ease, transform .3s var(--ease);
}
:lang(th) .choice { font-size: .9375rem; letter-spacing: .02em; }
.choice:hover { background: #3A332D; transform: translateY(-1px); }
.choice:active { transform: translateY(0); }
.choice svg { width: 15px; height: 15px; flex: none; transition: transform .6s var(--ease); }
.choice:hover svg, .choice.rolling svg { transform: rotate(180deg); }

/* ---------- painted in on arrival (bar.js) ---------- */

/* Every mark waits for the hand (--d) and takes as long as the hand does
   (--len). A line is traced along its length, starting just short of its
   first point: starting on it leaves a dot of ink where a round end sits
   before anything is drawn. A shape outlined in ink fills as it's drawn. */
.painting .paint-line {
  stroke-dasharray: 1 2;
  animation: paint-line var(--len, .5s) cubic-bezier(.4, 0, .3, 1) var(--d, 0s) both;
}
.painting .paint-line.paint-filled {
  animation: paint-line var(--len, .5s) cubic-bezier(.4, 0, .3, 1) var(--d, 0s) both,
    paint-filled var(--len, .5s) ease-in var(--d, 0s) both;
}
@keyframes paint-line {
  from { stroke-dashoffset: 1.01; }
  to   { stroke-dashoffset: 0; }
}
@keyframes paint-filled { from { fill-opacity: 0; } }

/* a stroke of the brush, uncovered the way it was pulled */
.painting .paint-wipe-r { animation: paint-wipe-r var(--len, .5s) cubic-bezier(.4, 0, .3, 1) var(--d, 0s) both; }
.painting .paint-wipe-l { animation: paint-wipe-l var(--len, .5s) cubic-bezier(.4, 0, .3, 1) var(--d, 0s) both; }
.painting .paint-wipe-d { animation: paint-wipe-d var(--len, .5s) cubic-bezier(.4, 0, .3, 1) var(--d, 0s) both; }
.painting .paint-wipe-u { animation: paint-wipe-u var(--len, .5s) cubic-bezier(.4, 0, .3, 1) var(--d, 0s) both; }
@keyframes paint-wipe-r { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes paint-wipe-l { from { clip-path: inset(0 0 0 100%); } to { clip-path: inset(0 0 0 0); } }
@keyframes paint-wipe-d { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes paint-wipe-u { from { clip-path: inset(100% 0 0 0); } to { clip-path: inset(0 0 0 0); } }

/* a wash spreads from where the brush touched, and darkens as it settles */
.painting .paint-bleed { animation: paint-bleed var(--len, .8s) cubic-bezier(.2, .6, .35, 1) var(--d, 0s) both; }
.painting .paint-bleed.paint-bleed-b { animation-name: paint-bleed-b; }
@keyframes paint-bleed {
  from { clip-path: circle(0% at 40% 60%); opacity: .35; }
  to   { clip-path: circle(120% at 40% 60%); opacity: 1; }
}
@keyframes paint-bleed-b {
  from { clip-path: circle(0% at 60% 35%); opacity: .35; }
  to   { clip-path: circle(120% at 60% 35%); opacity: 1; }
}

/* the ring a wash dries to, a label, a dab of ink, the light */
.painting .paint-fade { animation: paint-fade var(--len, .6s) ease-out var(--d, 0s) both; }
@keyframes paint-fade { from { opacity: 0; } }

/* the seal is pressed last, slightly askew, and stays */
.bar-seal { transform-box: fill-box; transform-origin: center; transform: rotate(-6deg); }
.painting .bar-seal { animation: seal .5s cubic-bezier(.3, 1.5, .5, 1) var(--seal-at, 4s) both; }
@keyframes seal {
  0%   { opacity: 0; transform: scale(1.7) rotate(-6deg); }
  60%  { opacity: 1; transform: scale(.94) rotate(-6deg); }
  100% { opacity: 1; transform: scale(1) rotate(-6deg); }
}

/* the menu comes in under it once the counter is painted */
.painting-page #filters,
.painting-page #menu-body,
.painting-page .choice { animation: paint-fade .9s ease-out var(--menu-at, 2s) both; }

/* ================================================================
   THE MENU — sections of drinks set like a printed card
   ================================================================ */

/* Filters: four words, the live one underlined. Nothing chosen means
   everything; tapping the live one lets it go. */
.filters {
  display: flex;
  justify-content: center;
  gap: 4px clamp(10px, 3vw, 28px);
  margin: 34px 0 6px;
  padding: 0 0 14px;
  border-bottom: 1px solid var(--rule);
  /* full names on one line, down to a 360px phone; anything narrower swipes */
  overflow-x: auto;
  scrollbar-width: none;
}
.filters::-webkit-scrollbar { display: none; }
.filters.more {
  justify-content: flex-start;
  -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent);
  mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent);
}
.filter {
  flex: none;
  padding: 6px 0;
  border: 0;
  background: none;
  font-family: var(--sans);
  font-size: clamp(.72rem, 3.3vw, .78rem);
  font-weight: 400;
  letter-spacing: .02em;
  white-space: nowrap;
  color: var(--ink-3);
  cursor: pointer;
  transition: color .2s;
}
.filter > span { padding-bottom: 4px; border-bottom: 1px solid transparent; transition: border-color .2s; }
.filter:hover { color: var(--ink); }
.filter[aria-pressed='true'] { color: var(--ink); }
.filter[aria-pressed='true'] > span { border-color: var(--ink); }
:lang(th) .filter { font-size: .9375rem; letter-spacing: 0; }

/* a section of the card */
.section { margin-top: clamp(40px, 7vw, 64px); }
.section-head {
  display: grid;
  gap: 6px;
  margin: 0 0 6px;
  text-align: center;
}
.section-title {
  margin: 0;
  font-family: var(--display);
  font-size: clamp(2rem, 6vw, 2.75rem);
  font-weight: 500;
  line-height: 1;
  letter-spacing: -.01em;
}
.section-head .caps { color: var(--ink-3); }
/* a short brush stroke under the title instead of a full rule */
.section-head svg { justify-self: center; width: 56px; height: 8px; margin-top: 6px; }

.entries {
  display: grid;
  grid-template-columns: 1fr;
  column-gap: clamp(32px, 5vw, 64px);
}
@media (min-width: 820px) { .entries { grid-template-columns: 1fr 1fr; } }

/* One drink. The whole row opens it. */
.entry {
  display: grid;
  grid-template-columns: clamp(76px, 22vw, 104px) 1fr;
  gap: 4px clamp(12px, 3.6vw, 22px);
  align-items: start;
  width: 100%;
  padding: 22px 0 24px;
  border: 0;
  border-bottom: 1px solid var(--rule);
  background: none;
  text-align: left;
  cursor: pointer;
  animation: entry-in .6s var(--ease) backwards;
  animation-delay: calc(var(--i, 0) * 32ms);
}
@keyframes entry-in { from { opacity: 0; transform: translateY(8px); } }
.entry-art { aspect-ratio: 120 / 170; transition: transform .5s var(--ease); }
.entry-art svg { display: block; width: 100%; height: 100%; overflow: visible; }
.entry:hover .entry-art { transform: translateY(-3px); }

.entry-text { display: grid; gap: 5px; min-width: 0; padding-top: 6px; }
.entry-name {
  font-family: var(--display);
  font-size: clamp(1.625rem, 5.4vw, 1.875rem);
  font-weight: 600;
  line-height: 1.02;
  letter-spacing: -.005em;
  color: var(--ink);
  text-wrap: balance;
}
.entry-name > span {
  background: linear-gradient(currentColor, currentColor) 0 100% / 0 1px no-repeat;
  transition: background-size .5s var(--ease);
}
.entry:hover .entry-name > span { background-size: 100% 1px; }
.entry-hook {
  margin: 2px 0 0;
  max-width: 34ch;
  font-style: italic;
  font-size: 1.0625rem;
  line-height: 1.42;
  color: var(--ink-2);
}
:lang(th) .entry-hook { font-size: 1rem; line-height: 1.6; }

/* what's special about it, in a line of small print */
.notes-line {
  display: flex;
  flex-wrap: wrap;
  gap: 2px 14px;
  margin-top: 6px;
  font-family: var(--sans);
  font-size: .75rem;
  letter-spacing: .03em;
  color: var(--ink-3);
}
:lang(th) .notes-line { font-size: .8125rem; letter-spacing: 0; }
.note { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.note svg { width: 12px; height: 12px; flex: none; }
.note.smoke { color: var(--smoke); }
.note.warn { color: var(--shu); }
.note.zero { color: var(--matcha); }
.note.egg, .note.low { color: var(--kincha); }

.no-match {
  padding: 56px 24px;
  text-align: center;
  font-style: italic;
  color: var(--ink-3);
}

/* found, not advertised — the eighteenth green at the foot of the card.
   The button covers the pin and its flag (x 211–288, y 9–108 of 320 × 150). */
.secret { margin: 72px auto 0; max-width: 380px; text-align: center; }
.green { position: relative; animation: entry-in 1.4s var(--ease) both; }
.green svg { display: block; width: 100%; height: auto; overflow: visible; }
.green text { font-family: var(--sans); font-weight: 500; }
.pennant { transform-box: fill-box; transform-origin: 0 50%; animation: pennant 3.8s ease-in-out infinite; }
@keyframes pennant {
  0%, 100% { transform: scaleX(1) skewY(0deg); }
  34%      { transform: scaleX(.92) skewY(-4deg); }
  68%      { transform: scaleX(1.03) skewY(2deg); }
}
.flag-hit {
  position: absolute;
  left: 66%;
  top: 6%;
  width: 24%;
  height: 66%;
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
  touch-action: manipulation;
}
.green:has(.flag-hit:hover) .pennant path { fill: var(--shu-2); }
.flag-hit:focus-visible { outline: 1.5px solid var(--shu); outline-offset: 2px; }

/* ================================================================
   THE CARD — one drink, opened. Heavier stock than the menu, with a
   fine frame printed just inside the edge.
   ================================================================ */

dialog {
  width: min(600px, calc(100vw - 24px));
  /* svh: the height you can see with the phone's browser bars up */
  max-height: min(90svh, 920px);
  padding: 0;
  border: 0;
  border-radius: var(--radius-lg);
  background-color: var(--paper-hi);
  background-image: var(--washi, none);
  background-size: 420px 420px;
  color: var(--ink);
  box-shadow:
    0 1px 0 rgba(255, 255, 255, .8) inset,
    0 0 0 1px rgba(38, 34, 30, .06),
    0 40px 70px -34px rgba(52, 38, 24, .55);
}
/* a phone lays the card out in a viewport taller than the visible one, so
   centring would slide the top of it under the toolbar — pin it high */
@media (max-width: 640px) {
  dialog {
    margin-top: max(12px, env(safe-area-inset-top));
    margin-bottom: auto;
    max-height: calc(90svh - env(safe-area-inset-top));
  }
}
dialog:focus { outline: none; }
dialog::backdrop { background: rgba(48, 40, 32, .38); backdrop-filter: blur(2px); }
dialog[open] { animation: card-in .34s var(--ease); }
@keyframes card-in { from { opacity: 0; transform: translateY(16px) scale(.985); } }

.sheet {
  position: relative;
  display: flex;
  flex-direction: column;
  max-height: inherit;
  overflow: hidden;
}
/* the printed frame, its corners following the card's */
.sheet::before {
  content: '';
  position: absolute;
  inset: 7px;
  z-index: 3;
  border: 1px solid var(--rule);
  border-radius: calc(var(--radius-lg) - 7px);
  pointer-events: none;
}

/* The drawing beside the name, the line about it under the name. On a
   phone the line runs the full width under both. The rules stop at the
   printed frame rather than crossing it. */
.sheet-head {
  position: relative;
  flex: none;
  display: grid;
  grid-template-columns: auto 1fr;
  grid-template-areas: 'art title' 'art hook';
  gap: 8px 20px;
  margin: 0 7px;
  padding: 30px 48px 22px 19px;
  border-bottom: 1px solid var(--rule);
}
@media (max-width: 640px) {
  .sheet-head { grid-template-areas: 'art title' 'hook hook'; padding: 26px 44px 18px 15px; }
  .sheet-title { align-self: center; }
  .sheet-hook { padding-left: 6px; }
}
.preview { grid-area: art; width: clamp(88px, 24vw, 118px); aspect-ratio: 120 / 170; }
.preview svg { display: block; width: 100%; height: 100%; overflow: visible; }
.sheet-title {
  grid-area: title;
  align-self: end;
  margin: 0;
  font-family: var(--display);
  font-size: clamp(2rem, 7vw, 2.5rem);
  font-weight: 600;
  line-height: 1;
  letter-spacing: -.01em;
  text-wrap: balance;
}
.sheet-hook {
  grid-area: hook;
  margin: 0;
  font-style: italic;
  font-size: 1.0625rem;
  line-height: 1.42;
  color: var(--ink-2);
}

.sheet-close {
  position: absolute;
  top: 16px;
  right: 16px;
  z-index: 4;
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: none;
  color: var(--ink-2);
  cursor: pointer;
  transition: color .2s, background-color .2s, transform .3s var(--ease);
}
.sheet-close:hover { color: var(--ink); background: rgba(38, 34, 30, .05); transform: rotate(90deg); }
.sheet-close svg { width: 18px; height: 18px; }

.sheet-body {
  flex: 1 1 auto;
  min-height: 0;
  display: grid;
  gap: 30px;
  padding: 26px 28px 30px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}
.sheet-foot {
  flex: none;
  margin: 0 7px;
  padding: 16px 17px 22px;
  border-top: 1px solid var(--rule);
}

.field { display: grid; gap: 12px; }

/* the story, with a lettered initial */
.story {
  margin: 0;
  max-width: var(--measure);
  font-size: 1.0625rem;
  line-height: 1.6;
  color: var(--ink-2);
  font-variant-numeric: oldstyle-nums;
}
.story:lang(en)::first-letter {
  float: left;
  margin: .06em .08em 0 0;
  font-family: var(--display);
  font-size: 3.4em;
  font-weight: 600;
  line-height: .78;
  color: var(--shu);
}
:lang(th) .story { font-size: 1rem; line-height: 1.75; }

/* the one drink on the list that isn't what it looks like */
.warn-box {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 14px;
  align-items: start;
  padding: 14px 16px;
  border: 1px solid rgba(176, 57, 42, .35);
  border-radius: var(--radius);
  font-size: .9375rem;
  line-height: 1.5;
  color: var(--ink-2);
}
.warn-box .seal { width: 26px; height: 26px; }
.warn-box p { margin: 0; }
.warn-box b { font-weight: 500; color: var(--shu); }

/* what's in it, set like a menu: name … measure */
.build { display: grid; gap: 9px; margin: 0; padding: 0; list-style: none; }
.build li {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: baseline;
  gap: 8px;
  font-size: 1.0625rem;
  color: var(--ink);
}
.build li::after {
  content: '';
  grid-column: 2;
  grid-row: 1;
  height: 1px;
  align-self: end;
  margin-bottom: .32em;
  background-image: radial-gradient(circle, var(--ink-4) 0 .7px, transparent 1px);
  background-size: 5px 2px;
  background-repeat: repeat-x;
}
.build .ing { grid-column: 1; }
.build .qty {
  grid-column: 3;
  font-family: var(--sans);
  font-size: .8125rem;
  letter-spacing: .04em;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.build li.swapped .ing { color: var(--matcha); }
.build li.unmeasured::after { display: none; }

/* tasting card: five rows of ink dots */
.tasting { display: grid; gap: 9px; margin: 0; }
.taste {
  display: grid;
  grid-template-columns: 7.5rem auto;
  align-items: center;
  gap: 14px;
}
:lang(th) .taste { grid-template-columns: 6rem auto; }
.dots { display: flex; gap: 6px; }
.dots i {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  border: 1px solid var(--ink-3);
}
.dots i.on { background: var(--ink); border-color: var(--ink); }

/* options — smoke, egg white, zero sugar */
.option {
  position: relative;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 14px;
  align-items: start;
  padding: 16px 16px 16px 14px;
  border: 1px solid var(--rule-2);
  border-radius: var(--radius);
  cursor: pointer;
  transition: border-color .25s, background-color .25s;
}
.option:hover { border-color: var(--ink-3); }
.option input { position: absolute; opacity: 0; pointer-events: none; }
.option .box {
  width: 20px;
  height: 20px;
  margin-top: 2px;
  border: 1px solid var(--ink-2);
  border-radius: 5px;
  background: var(--paper-hi);
  display: grid;
  place-items: center;
}
.option .box svg { width: 16px; height: 16px; opacity: 0; transform: scale(.6); transition: opacity .2s, transform .3s var(--ease); }
.option:has(input:checked) { border-color: var(--ink-2); background: rgba(255, 255, 255, .35); }
.option:has(input:checked) .box svg { opacity: 1; transform: scale(1); }
.option:has(input:focus-visible) { outline: 1.5px solid var(--shu); outline-offset: 3px; }
.option-text { display: grid; gap: 4px; }
.option-title { font-family: var(--display); font-size: 1.375rem; font-weight: 600; line-height: 1.1; }
.option-why { font-size: .9375rem; line-height: 1.5; color: var(--ink-3); }
.option.smoke:has(input:checked) .box { border-color: var(--smoke); }
.option.zero:has(input:checked) .option-title { color: var(--matcha); }

.woods {
  display: grid;
  gap: 10px;
  margin-top: -1px;
  padding: 16px 16px 18px 48px;
  border: 1px solid var(--ink-2);
  border-radius: 0 0 var(--radius) var(--radius);
  border-top-style: dashed;
  border-top-color: var(--rule-2);
}
/* the smoke option and its woods read as one card while the woods are open */
.option.smoke:has(+ .woods:not([hidden])) { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.wood-row { display: flex; flex-wrap: wrap; gap: 6px 18px; }
.wood {
  padding: 4px 0;
  border: 0;
  background: none;
  font-family: var(--sans);
  font-size: .875rem;
  letter-spacing: .02em;
  color: var(--ink-3);
  cursor: pointer;
}
.wood > span { padding-bottom: 3px; border-bottom: 1px solid transparent; transition: border-color .2s, color .2s; }
.wood:hover { color: var(--ink); }
.wood[aria-pressed='true'] { color: var(--ink); }
.wood[aria-pressed='true'] > span { border-color: var(--smoke); }
.wood-note { margin: 0; font-style: italic; font-size: .9375rem; color: var(--ink-3); }

.no-smoke {
  margin: 0;
  padding-left: 14px;
  border-left: 1px solid var(--rule-2);
  font-size: .9375rem;
  line-height: 1.5;
  color: var(--ink-3);
}
.no-smoke b { font-weight: 500; color: var(--ink-2); }

/* the guest's name and note, written on a line */
.write {
  width: 100%;
  padding: 8px 0 9px;
  border: 0;
  border-bottom: 1px solid var(--rule-2);
  border-radius: 0;
  background: none;
  font-family: var(--serif);
  font-size: 1.125rem;
  color: var(--ink);
  transition: border-color .2s;
}
.write::placeholder { color: var(--ink-4); font-style: italic; }
.write:focus { outline: none; border-color: var(--ink); }
textarea.write { min-height: 64px; resize: vertical; line-height: 1.5; }
.write.wanting { border-color: var(--shu); }
.write.wanting::placeholder { color: var(--shu); }

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  padding: 16px 20px;
  border: 0;
  border-radius: var(--radius);
  background: var(--ink);
  color: var(--paper-hi);
  font-family: var(--sans);
  font-size: .8125rem;
  font-weight: 500;
  letter-spacing: .24em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background-color .3s ease;
}
.btn:hover { background: #3A332D; }
:lang(th) .btn { font-size: 1rem; letter-spacing: .02em; }

/* ================================================================
   ORDERS — tickets on the rail, stamped when they're poured
   ================================================================ */

.orders { max-width: 860px; margin: 0 auto; }

.orders-head {
  display: grid;
  gap: 10px;
  margin: 26px 0 34px;
  text-align: center;
}
.orders-title {
  margin: 0;
  font-family: var(--display);
  font-size: clamp(2.25rem, 7vw, 3rem);
  font-weight: 500;
  line-height: 1;
}
.orders-lede {
  margin: 0 auto;
  max-width: 44ch;
  font-style: italic;
  color: var(--ink-2);
}
.orders-lede b { font-style: normal; font-weight: 500; }
.orders-meta {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 8px 28px;
  margin-top: 6px;
}
.tally { display: flex; gap: 24px; }
.tally > span { display: inline-flex; align-items: baseline; gap: 8px; }
.tally b {
  font-family: var(--display);
  font-size: 1.75rem;
  font-weight: 600;
  line-height: 1;
  color: var(--ink);
  font-variant-numeric: lining-nums tabular-nums;
}
.sync { display: inline-flex; align-items: center; gap: 8px; }
.sync::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--matcha); }
.sync.off::before { background: var(--shu); }

.rail-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  margin: 40px 0 14px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--rule-2);
}
.rail-head:first-child { margin-top: 0; }
.rail-title { margin: 0; font-family: var(--display); font-size: 1.625rem; font-weight: 600; line-height: 1; }
.link-btn {
  padding: 4px 0;
  border: 0;
  background: none;
  font-family: var(--sans);
  font-size: .75rem;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-3);
  cursor: pointer;
}
.link-btn:hover { color: var(--shu); }
:lang(th) .link-btn { font-size: .875rem; letter-spacing: 0; }

.tickets { display: grid; gap: 14px; }

/* a slip of card on the rail, torn straight across the top */
.ticket {
  position: relative;
  border-radius: 0 0 var(--radius) var(--radius);
  background: var(--paper-hi);
  box-shadow: 0 0 0 1px rgba(38, 34, 30, .07), 0 14px 26px -22px rgba(52, 38, 24, .55);
}
/* a perforated top edge, torn from the pad */
.ticket::before {
  content: '';
  position: absolute;
  top: -3px;
  left: 0;
  right: 0;
  height: 6px;
  background: radial-gradient(circle at 4px 3px, var(--paper) 2.2px, transparent 2.6px) 0 0 / 9px 6px repeat-x;
}

.ticket-main {
  display: grid;
  grid-template-columns: auto auto 1fr;
  gap: 14px;
  align-items: start;
  padding: 20px 20px 16px 16px;
}
.pour {
  width: 24px;
  height: 24px;
  margin-top: 5px;
  padding: 0;
  border: 1px solid var(--ink-3);
  border-radius: 6px;
  background: var(--paper-hi);
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: border-color .2s;
}
.pour svg { width: 18px; height: 18px; opacity: 0; transition: opacity .2s; }
.pour:hover { border-color: var(--ink); }
.ticket.done .pour svg { opacity: 1; }
.ticket-art { width: 52px; aspect-ratio: 120 / 170; transition: opacity .3s; }
.ticket-art svg { display: block; width: 100%; height: 100%; overflow: visible; }

.ticket-text { display: grid; gap: 4px; min-width: 0; }
.ticket-drink { font-family: var(--display); font-size: 1.625rem; font-weight: 600; line-height: 1.05; text-wrap: balance; }
.ticket-who { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.ticket-guest { font-style: italic; font-size: 1.0625rem; color: var(--ink-2); }
.ticket-when::before { content: '·'; margin-right: 10px; color: var(--ink-4); }
.ticket-when {
  font-family: var(--sans);
  font-size: .75rem;
  letter-spacing: .04em;
  color: var(--ink-3);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.ticket-note {
  margin: 2px 0 0;
  padding-left: 12px;
  border-left: 1px solid var(--rule-2);
  font-style: italic;
  color: var(--ink-2);
}

.ticket.done .ticket-art,
.ticket.done .ticket-text { opacity: .52; }
.ticket.done .ticket-drink { text-decoration: line-through; text-decoration-thickness: 1px; }

/* the seal, pressed when it's poured */
.stamp {
  position: absolute;
  top: 14px;
  right: 18px;
  width: 78px;
  height: 78px;
  pointer-events: none;
  transform: rotate(-12deg);
  opacity: .9;
  mix-blend-mode: multiply;
}
.stamp.fresh { animation: stamp .42s cubic-bezier(.3, 1.6, .5, 1) both; }
@keyframes stamp {
  0%   { opacity: 0; transform: rotate(-12deg) scale(1.6); }
  60%  { opacity: .95; transform: rotate(-12deg) scale(.94); }
  100% { opacity: .9; transform: rotate(-12deg) scale(1); }
}

.build-toggle {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 12px 20px 14px 56px;
  border: 0;
  border-top: 1px dashed var(--rule-2);
  background: none;
  font-family: var(--sans);
  font-size: .6875rem;
  font-weight: 500;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--ink-3);
  text-align: left;
  cursor: pointer;
  transition: color .2s;
}
:lang(th) .build-toggle { font-size: .875rem; letter-spacing: 0; }
.build-toggle:hover { color: var(--ink); }
.build-toggle svg { width: 10px; height: 10px; transition: transform .3s var(--ease); }
.build-toggle[aria-expanded='true'] svg { transform: rotate(90deg); }

.build-panel { display: grid; gap: 20px; padding: 4px 22px 24px 56px; }
.build-panel .build { max-width: 34rem; }

/* the method, numbered in the order you do it */
.steps { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; counter-reset: step; max-width: var(--measure); }
.steps li {
  display: grid;
  grid-template-columns: 1.6rem 1fr;
  gap: 10px;
  font-size: 1.0625rem;
  line-height: 1.5;
  color: var(--ink-2);
}
.steps li::before {
  counter-increment: step;
  content: counter(step);
  font-family: var(--display);
  font-size: 1.375rem;
  font-weight: 600;
  line-height: 1.05;
  color: var(--shu);
  font-variant-numeric: lining-nums;
}

.aside {
  display: grid;
  gap: 4px;
  max-width: var(--measure);
  padding: 2px 0 2px 14px;
  border-left: 1px solid var(--rule-2);
  font-size: .9375rem;
  line-height: 1.5;
  color: var(--ink-2);
}
.aside.smoke { border-color: var(--smoke); }
.aside.zero  { border-color: var(--matcha); }
.aside.tip   { border-color: var(--kincha); }
.aside.warn  { border-color: var(--shu); }

.empty { padding: 64px 24px 40px; text-align: center; }
.empty svg { width: 120px; height: 120px; margin: 0 auto 12px; display: block; }
.empty-title { font-family: var(--display); font-size: 1.75rem; font-weight: 600; }
.empty p { margin: 4px 0 0; font-style: italic; color: var(--ink-3); }

/* bar notes, folded away at the foot of the orders */
details.notes { margin-top: 64px; border-top: 1px solid var(--rule-2); }
details.notes summary {
  list-style: none;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 18px 0;
  cursor: pointer;
}
details.notes summary::-webkit-details-marker { display: none; }
details.notes summary svg { width: 10px; height: 10px; transition: transform .3s var(--ease); }
details.notes[open] summary svg { transform: rotate(90deg); }
.notes-grid {
  display: grid;
  gap: 24px 40px;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  margin-top: 6px;
}
.notes-grid h3 { margin: 0 0 4px; font-family: var(--display); font-size: 1.375rem; font-weight: 600; line-height: 1.15; }
.notes-grid p { margin: 0; color: var(--ink-2); line-height: 1.55; }

.table-wrap { overflow-x: auto; margin-top: 36px; }
.wood-table { width: 100%; min-width: 420px; border-collapse: collapse; font-size: 1rem; }
.wood-table th { padding: 0 16px 8px 0; border-bottom: 1px solid var(--rule-2); text-align: left; }
.wood-table td { padding: 10px 16px 10px 0; border-bottom: 1px solid var(--rule); vertical-align: top; color: var(--ink-2); }
.wood-table td:first-child { font-family: var(--display); font-size: 1.1875rem; font-weight: 600; color: var(--ink); white-space: nowrap; }

/* ================================================================
   SCENES — smoke that leaves the glass, the slip that
   confirms an order, and the motion inside the drawings
   ================================================================ */

/* smoke does not stay in the glass */
.page-smoke {
  position: fixed;
  inset: 0;
  z-index: 55;
  pointer-events: none;
  overflow: hidden;
}
.page-smoke svg {
  position: absolute;
  bottom: -30vh;
  width: 34vw;
  min-width: 160px;
  max-width: 340px;
  height: auto;
  overflow: visible;
  animation: page-smoke 6s cubic-bezier(.3, .2, .3, 1) forwards;
}
@keyframes page-smoke {
  0%   { opacity: 0; transform: translate(0, 0) scale(.7); }
  16%  { opacity: 1; }
  100% { opacity: 0; transform: translate(var(--drift, 2vw), -120vh) scale(1.5); }
}

/* the slip that says it went through */
.toast {
  position: fixed;
  left: 50%;
  bottom: max(24px, env(safe-area-inset-bottom));
  z-index: 60;
  display: flex;
  align-items: center;
  gap: 12px;
  max-width: calc(100vw - 32px);
  padding: 10px 22px 10px 14px;
  border-radius: 14px;
  background: var(--paper-hi);
  box-shadow: 0 0 0 1px rgba(38, 34, 30, .08), 0 20px 34px -22px rgba(52, 38, 24, .6);
  font-family: var(--serif);
  font-style: italic;
  font-size: 1rem;
  color: var(--ink);
  transform: translate(-50%, 24px);
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s ease, transform .4s var(--ease);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast-art { width: 30px; aspect-ratio: 120 / 170; flex: none; }
.toast-art:empty { display: none; }
.toast-art svg { display: block; width: 100%; height: 100%; overflow: visible; }

/* ---------- inside the drawings ---------- */

.bubble { animation: bubble linear infinite; }
@keyframes bubble {
  0%   { transform: translateY(0); opacity: 0; }
  14%  { opacity: .9; }
  80%  { opacity: .55; }
  100% { transform: translateY(var(--rise, -40px)); opacity: 0; }
}

.wisp { transform-box: fill-box; transform-origin: 50% 100%; animation: wisp 6.4s ease-in-out infinite; }
@keyframes wisp {
  0%   { opacity: 0; transform: translate(0, 6px) scale(.7, .6); }
  24%  { opacity: .85; }
  70%  { opacity: .4; }
  100% { opacity: 0; transform: translate(6px, -34px) scale(1.15, 1.4); }
}

/* the ice gives up while you make up your mind */
/* each cube is drawn about its own centre, so it shrinks in place */
.melt {
  transform-box: view-box;
  transform-origin: 0 0;
  will-change: transform;
  animation: melt 150s linear forwards;
}
@keyframes melt { to { transform: scale(.62); } }

@media (prefers-reduced-motion: reduce) {
  .page-smoke { display: none; }
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-delay: 0s !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
  .melt { animation: none !important; }
  .wisp { opacity: .45; }
}

</style>
</head>
<body>


<div class="page">
  <header class="topbar">
    <h1 class="wordmark"><button class="home" id="home" type="button">Paul<span class="amp">'</span>s Bar</button><button class="tee" id="tee" type="button" aria-label="A golf tee"></button></h1>
    <div class="topbar-right">
      <div class="langs" role="group" aria-label="Language">
        <button class="lang" id="lang-en" type="button" aria-pressed="true"><span>EN</span></button>
        <span class="sep" aria-hidden="true"></span>

/* ---------- js/00-core.js ---------- */
/* ================================================================
   CORE — DOM and storage helpers everything else leans on
   ================================================================ */

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

/* an HTML element, with an optional class and text */
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.appendChild(txt(text));
  return n;
}

/* Text for the page. Thai is set one word to a span, each kept whole,
   with a place to break between them: the words in TH_KEEP first (the
   browser's dictionary cuts those mid-word), then the dictionary splits
   what's left. The words come wrapped in one span, so a flex row they
   land in sees a single item. Text with no Thai in it is just text. */
const THAI = /[\u0E00-\u0E7F]/;
let thaiKeep = null;
let thaiWords = null;
function txt(text) {
  text = String(text);
  if (!THAI.test(text) || typeof Intl === 'undefined' || !Intl.Segmenter) return document.createTextNode(text);
  if (!thaiWords) {
    thaiWords = new Intl.Segmenter('th', { granularity: 'word' });
    thaiKeep = new RegExp('(' + TH_KEEP.slice().sort((a, b) => b.length - a.length).join('|') + ')');
  }
  const run = document.createElement('span');
  let lastThai = false;
  /* the repeat mark ๆ belongs to the word before it, never the next line */
  text.replace(/ ๆ/g, '\u00a0ๆ').split(thaiKeep).forEach((part, i) => {
    const words = i % 2 ? [part] : Array.from(thaiWords.segment(part), (s) => s.segment);
    words.forEach((w) => {
      if (!w) return;
      const thai = THAI.test(w);
      if (thai && lastThai) run.appendChild(document.createElement('wbr'));
      if (thai) run.appendChild(el('span', 'tw')).textContent = w;
      else run.appendChild(document.createTextNode(w));
      lastThai = thai;
    });
  });
  return run;
}

/* an SVG element. Numbers are rounded to two places so a drawing made of
   computed curves doesn't carry fifteen decimals per point. */
const SVG_NS = 'http://www.w3.org/2000/svg';
function S(tag, attrs = {}, kids = []) {
  const n = document.createElementNS(SVG_NS, tag);
  for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    n.setAttribute(k, typeof v === 'number' ? String(+v.toFixed(2)) : v);
  }
  kids.forEach((k) => k && n.appendChild(k));
  return n;
}

/* a whole SVG from a string — for the fixed marks that are easier to
   read as markup than as calls */
function svgFrom(markup) {
  const t = document.createElement('template');
  t.innerHTML = markup.trim();
  return t.content.firstElementChild;
}

const prefersStill = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* localStorage that never throws — private windows and full disks just
   behave as if nothing was saved */
const store = {
  get(key, fallback = null) {
    try { const v = localStorage.getItem(key); return v == null ? fallback : v; } catch (e) { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem(key, value); } catch (e) { /* nothing to be done */ }
  },
  json(key, fallback) {
    try { const v = JSON.parse(localStorage.getItem(key)); return v == null ? fallback : v; } catch (e) { return fallback; }
  }
};

const KEYS = {
  orders: 'paulsbar.orders.v1',
  guest: 'paulsbar.guest.v1',
  lang: 'paulsbar.lang.v1',
  found: 'paulsbar.found.v1'
};

/* ---------- js/01-i18n.js ---------- */
/* ================================================================
   LANGUAGE
   English is the source; Thai overrides it field by field. Each
   language gets its own merged copy of the list, built once, so
   nothing is ever rewritten in place when the language changes.
   ================================================================ */

let lang = store.get(KEYS.lang) === 'th' ? 'th' : 'en';

const LISTS = {
  en: DRINKS,
  th: DRINKS.map((d) => (TH[d.id] ? Object.assign({}, d, TH[d.id]) : d))
};

/* the drinks, in the current language */
const drinks = () => LISTS[lang];
const drinkById = (id) => LISTS[lang].find((d) => d.id === id) || null;

/* a UI string; Thai falls back to English for anything not yet translated */
function U(key) {
  const th = lang === 'th' ? T_TH[key] : undefined;
  return th !== undefined ? th : T_EN[key];
}

const woodLabel = (w) => (lang === 'th' && WOOD_TH[w]) || w;
const woodNote = (w) => ((lang === 'th' ? WOODS_TH : WOODS)[w]) || '';

/* "3 min ago", in whichever language is live */
function ago(ts) {
  const m = Math.floor((Date.now() - ts) / 60000);
  if (m < 1) return U('ago_now');
  if (m < 60) return U('ago_min')(m);
  return U('ago_hr')(Math.floor(m / 60));
}

/* The two loudest flavours plus how heavy it lands — read off the same
   scores the tasting card draws, so the two can never disagree. */
function profileWords(drink) {
  const f = drink.flavor;
  const ranked = ['bitter', 'sweet', 'citrus', 'herbal']
    .map((axis) => ({ axis, v: f[axis] || 0 }))
    .sort((a, b) => b.v - a.v);
  /* anything scoring 1 is barely there — naming it would mislead */
  let top = ranked.filter((x) => x.v >= 2).slice(0, 2);
  if (!top.length) top = ranked.slice(0, 1);

  let level;
  if (drink.na && !drink.warning) level = U('heavy_none');
  else if (f.strength <= 2) level = U('level_light');
  else if (f.strength === 3) level = U('level_medium');
  else level = U('level_strong');

  return top.map((x) => U('axis_' + x.axis)).concat(level).join(' · ');
}

const langListeners = [];
const onLang = (fn) => langListeners.push(fn);

function setLang(next) {
  if (next === lang) return;
  lang = next;
  store.set(KEYS.lang, next);
  document.documentElement.lang = lang;
  langListeners.forEach((fn) => fn());
}

/* ---------- js/02-book.js ---------- */
/* ================================================================
   THE ORDER BOOK
   Every order is written to this browser first, so nothing is lost
   when the wifi drops, then to the shared book (Supabase) so every
   phone sees the same list. Without a shared book configured, the bar
   runs on whichever device the orders were placed on.
   ================================================================ */

const Book = (() => {
  const shared = !!(BOOK.url && BOOK.key);
  let orders = store.json(KEYS.orders, []);
  if (!Array.isArray(orders)) orders = [];

  let online = true;
  const inflight = {};
  const changeFns = [];
  const statusFns = [];

  const save = () => store.set(KEYS.orders, JSON.stringify(orders));
  const changed = (isNew) => changeFns.forEach((fn) => fn(isNew));
  const find = (id) => orders.find((o) => o.id === id) || null;

  function setOnline(next) {
    if (online === next) return;
    online = next;
    statusFns.forEach((fn) => fn(online));
  }

  /* ---------- the wire ---------- */

  function api(path, opts = {}) {
    return fetch(BOOK.url + '/rest/v1/orders' + path, {
      method: opts.method || 'GET',
      headers: {
        apikey: BOOK.key,
        Authorization: 'Bearer ' + BOOK.key,
        'Content-Type': 'application/json',
        /* re-sending an order updates it rather than colliding with itself */
        Prefer: 'return=minimal,resolution=merge-duplicates'
      },
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then((r) => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      setOnline(true);
      /* a write answers with an empty body, a read with the book */
      return r.text().then((body) => (body ? JSON.parse(body) : null));
    }).catch((e) => {
      setOnline(false);
      throw e;
    });
  }

  /* The book's columns were fixed before the zero-sugar option existed,
     so that flag travels on the front of the note and is peeled off again. */
  const ZERO_MARK = '~z ';

  const toRow = (o) => ({
    id: o.id, drink: o.drink, guest: o.guest, smoke: !!o.smoke, wood: o.wood || null,
    egg: !!o.egg, note: (o.zero ? ZERO_MARK : '') + (o.note || ''),
    at: o.at, done: !!o.done, done_at: o.doneAt || null
  });
  const fromRow = (r) => {
    const note = r.note || '';
    const zero = note.startsWith(ZERO_MARK);
    return {
      id: r.id, drink: r.drink, guest: r.guest, smoke: !!r.smoke, wood: r.wood,
      egg: !!r.egg, zero, note: zero ? note.slice(ZERO_MARK.length) : note,
      at: Number(r.at), done: !!r.done, doneAt: r.done_at
    };
  };

  function push(order) {
    if (!shared || inflight[order.id]) return;
    order.pending = true;
    inflight[order.id] = true;
    api('', { method: 'POST', body: toRow(order) })
      .then(() => { delete inflight[order.id]; order.pending = false; save(); })
      .catch(() => { delete inflight[order.id]; /* goes again on the next good pull */ });
  }

  /* The whole book, newest first. Orders that haven't reached it yet are
     kept, so a dropped connection never loses anybody's drink. */
  function pull() {
    if (!shared) return Promise.resolve();
    return api('?select=*&order=at.desc&limit=200').then((rows) => {
      if (!rows) return;
      const seen = new Set(rows.map((r) => r.id));
      const waiting = orders.filter((o) => o.pending && !seen.has(o.id));
      orders = rows.map(fromRow).concat(waiting).sort((a, b) => b.at - a.at);
      save();
      changed(true);
      orders.filter((o) => o.pending).forEach(push);
    });
  }

  /* Every three seconds while the book answers; when it doesn't, wait
     longer each time — up to a minute — instead of hammering a book
     that isn't there. Coming back to the tab always asks at once. */
  const QUICK = 3000;
  const SLOW = 60000;
  let wait = QUICK;
  let timer = null;

  function schedule() {
    clearTimeout(timer);
    timer = setTimeout(tick, wait);
  }
  function tick() {
    pull()
      .then(() => { wait = QUICK; })
      .catch(() => { wait = Math.min(SLOW, wait * 2); })
      .then(schedule);
  }

  /* ---------- what the rest of the bar uses ---------- */

  return {
    shared,
    get orders() { return orders; },
    get online() { return online; },
    find,

    onChange: (fn) => changeFns.push(fn),
    onStatus: (fn) => statusFns.push(fn),

    add(order) {
      orders.unshift(order);
      save();
      changed(true);
      push(order);
    },

    toggleDone(id) {
      const o = find(id);
      if (!o) return null;
      o.done = !o.done;
      o.doneAt = o.done ? Date.now() : null;
      save();
      changed(false);
      if (o.pending) push(o);
      else if (shared) {
        api('?id=eq.' + encodeURIComponent(o.id), {
          method: 'PATCH', body: { done: o.done, done_at: o.doneAt || null }
        }).catch(() => {});
      }
      return o;
    },

    clearPoured() {
      orders = orders.filter((o) => !o.done);
      save();
      changed(false);
      if (shared) api('?done=eq.true', { method: 'DELETE' }).catch(() => {});
    },

    start() {
      /* another tab on this device placed or ticked something */
      window.addEventListener('storage', (e) => {
        if (e.key !== KEYS.orders) return;
        orders = store.json(KEYS.orders, []);
        changed(true);
      });
      if (!shared) return;
      tick();
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) return;
        wait = QUICK;
        clearTimeout(timer);
        tick();
      });
    }
  };
})();

const guestName = () => store.get(KEYS.guest, '');
const rememberGuest = (name) => store.set(KEYS.guest, name);

/* ---------- js/03-ink.js ---------- */
/* ================================================================
   INK — the drawing kit
   Brush lines that swell and taper, watercolour washes that pool at
   their edges, and white gouache for highlights. Every irregularity
   comes from a generator seeded with the thing being drawn, so a
   drink is drawn by the same hand every time it appears.
   ================================================================ */

const INK = '#2A2520';
const PAPER_WASH = '#F6F2EA';
const GOUACHE = '#FFFDF7';

/* ---------- colour ---------- */

function rgbOf(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function hexOf(rgb) {
  return '#' + rgb.map((v) => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join('');
}
function mix(a, b, t) {
  const A = rgbOf(a);
  const B = rgbOf(b);
  return hexOf(A.map((v, i) => v + (B[i] - v) * t));
}
const deepen = (c, t) => mix(c, INK, t);
const lighten = (c, t) => mix(c, PAPER_WASH, t);

/* ---------- a steady hand ---------- */

/* a small, fast generator seeded from a string */
function seeded(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  let a = h >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* smooth noise in [-1, 1] across t in [0, 1] — the waver of a hand */
function wave(rand, knots = 5) {
  const k = Array.from({ length: knots + 1 }, () => rand() * 2 - 1);
  return (t) => {
    const x = Math.max(0, Math.min(1, t)) * knots;
    const i = Math.min(knots - 1, Math.floor(x));
    const f = x - i;
    const s = (1 - Math.cos(f * Math.PI)) / 2;
    return k[i] * (1 - s) + k[i + 1] * s;
  };
}

let inkUid = 0;
const inkId = (prefix) => prefix + (++inkUid);

/* ---------- geometry ---------- */

const fx = (n) => +n.toFixed(2);

/* points along an ellipse; angles run clockwise on screen, so 0 is the
   right-hand end, π/2 the nearest point, −π/2 the far side */
function arc(cx, cy, rx, ry, a0, a1, n = 20) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const a = a0 + (a1 - a0) * (i / n);
    pts.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]);
  }
  return pts;
}

function line(p0, p1, n = 6) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    pts.push([p0[0] + (p1[0] - p0[0]) * t, p0[1] + (p1[1] - p0[1]) * t]);
  }
  return pts;
}

/* a run of points from a function of t */
function trace(fn, n = 20) {
  const pts = [];
  for (let i = 0; i <= n; i++) pts.push(fn(i / n));
  return pts;
}

/* join point runs end to end, dropping the duplicate where they meet */
function join(...runs) {
  const out = [];
  runs.forEach((run) => run.forEach((p, i) => {
    const last = out[out.length - 1];
    if (i === 0 && last && Math.hypot(last[0] - p[0], last[1] - p[1]) < 0.01) return;
    out.push(p);
  }));
  return out;
}

/* Catmull-Rom through the points, written as cubic Béziers */
function smooth(pts, closed = false) {
  const n = pts.length;
  if (n < 2) return '';
  const at = (i) => (closed ? pts[(i + n) % n] : pts[Math.max(0, Math.min(n - 1, i))]);
  let d = 'M' + fx(pts[0][0]) + ',' + fx(pts[0][1]);
  const last = closed ? n : n - 1;
  for (let i = 0; i < last; i++) {
    const p0 = at(i - 1), p1 = at(i), p2 = at(i + 1), p3 = at(i + 2);
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += 'C' + fx(c1[0]) + ',' + fx(c1[1]) + ' ' + fx(c2[0]) + ',' + fx(c2[1]) + ' ' + fx(p2[0]) + ',' + fx(p2[1]);
  }
  return closed ? d + 'Z' : d;
}

/* straight segments, for shapes that should stay crisp */
const poly = (pts, closed = true) =>
  pts.map((p, i) => (i ? 'L' : 'M') + fx(p[0]) + ',' + fx(p[1])).join('') + (closed ? 'Z' : '');

function normals(pts) {
  return pts.map((p, i) => {
    const a = pts[Math.max(0, i - 1)];
    const b = pts[Math.min(pts.length - 1, i + 1)];
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const len = Math.hypot(dx, dy) || 1;
    return [-dy / len, dx / len];
  });
}

/* nudge every point sideways by a little smooth noise */
function wobble(pts, amp, rand) {
  const w = wave(rand, Math.max(3, Math.round(pts.length / 5)));
  const ns = normals(pts);
  return pts.map((p, i) => {
    const d = w(i / (pts.length - 1)) * amp;
    return [p[0] + ns[i][0] * d, p[1] + ns[i][1] * d];
  });
}

/* ---------- marks ---------- */

/* A brush stroke along a centre line: it presses in, swells and lifts
   off. `width` is a number or a function of t; the hand's own waver
   is added on top unless `even` is set. */
function brushD(pts, width, opts = {}) {
  const n = pts.length;
  if (n < 2) return '';
  const lens = [0];
  for (let i = 1; i < n; i++) lens.push(lens[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const total = lens[n - 1] || 1;
  const ns = normals(pts);
  const press = opts.rand && !opts.even ? wave(opts.rand, 4) : () => 0;
  const t0 = opts.taper != null ? opts.taper : 0.18;
  const t1 = opts.taperEnd != null ? opts.taperEnd : t0;
  const lift = (x) => Math.sin(Math.max(0, Math.min(1, x)) * Math.PI / 2);
  const left = [], right = [];
  for (let i = 0; i < n; i++) {
    const t = lens[i] / total;
    let w = typeof width === 'function' ? width(t) : width;
    w *= 1 + press(t) * (opts.vary != null ? opts.vary : 0.28);
    if (t0 > 0 && t < t0) w *= 0.25 + 0.75 * lift(t / t0);
    if (t1 > 0 && t > 1 - t1) w *= 0.25 + 0.75 * lift((1 - t) / t1);
    w = Math.max(w, opts.min != null ? opts.min : 0.2) / 2;
    left.push([pts[i][0] + ns[i][0] * w, pts[i][1] + ns[i][1] * w]);
    right.push([pts[i][0] - ns[i][0] * w, pts[i][1] - ns[i][1] * w]);
  }
  return smooth(left.concat(right.reverse()), true);
}

function brush(pts, width, opts = {}) {
  return S('path', {
    d: brushD(pts, width, opts),
    fill: opts.color || INK,
    'fill-opacity': opts.alpha != null ? opts.alpha : 0.9,
    class: opts.cls
  });
}

/* an even pen line, for detail too small to need a brush */
function pen(pts, width, opts = {}) {
  return S('path', {
    d: opts.straight ? poly(pts, false) : smooth(pts, !!opts.closed),
    fill: 'none',
    stroke: opts.color || INK,
    'stroke-width': width,
    'stroke-opacity': opts.alpha != null ? opts.alpha : 0.85,
    'stroke-linecap': 'round',
    'stroke-linejoin': 'round',
    class: opts.cls
  });
}

/* A watercolour wash: the body of colour, plus the darker ring that
   pigment leaves where a wash dries. Pass `clipTo` (an id) to keep the
   ring on the inside of the shape, the way it really sits. */
function wash(d, color, opts = {}) {
  const g = S('g', { class: opts.cls });
  g.appendChild(S('path', {
    d, fill: opts.fill || color,
    'fill-opacity': opts.alpha != null ? opts.alpha : 0.88
  }));
  if (opts.edge !== 0) {
    g.appendChild(S('path', {
      d, fill: 'none',
      stroke: deepen(color, opts.edge != null ? opts.edge : 0.22),
      'stroke-width': opts.edgeWidth != null ? opts.edgeWidth : 1.1,
      'stroke-opacity': opts.edgeAlpha != null ? opts.edgeAlpha : 0.5,
      'stroke-linejoin': 'round',
      'clip-path': opts.clipTo ? 'url(#' + opts.clipTo + ')' : null
    }));
  }
  return g;
}

/* pigment that settled into the paper's tooth */
function grainPattern(defs, rand, color) {
  const id = inkId('grain');
  const p = S('pattern', { id, width: 9, height: 9, patternUnits: 'userSpaceOnUse' });
  for (let i = 0; i < 6; i++) {
    p.appendChild(S('circle', {
      cx: rand() * 9, cy: rand() * 9, r: 0.25 + rand() * 0.45,
      fill: color, 'fill-opacity': 0.1 + rand() * 0.14
    }));
  }
  defs.appendChild(p);
  return id;
}

function clipPath(defs, d, id = inkId('clip')) {
  defs.appendChild(S('clipPath', { id }, [S('path', { d })]));
  return id;
}

/* ---------- js/04-glass.js ---------- */
/* ================================================================
   THE DRINKS — each one drawn from its own data
   Glass, liquid, ice, bubbles, foam and garnish all come from the
   drink; the options change the drawing (egg white moves a sour into
   a coupe and caps it with foam, smoke sends curls off the rim).
   Seen from a little above, so every rim and surface is an ellipse.

   mode: 'static' — tickets and the toast
         'live'   — the menu; bubbles rise
         'pour'   — the open card; it fills, and the ice melts
   ================================================================ */

const CX = 60;
const ART_BOX = '0 0 120 170';

const GLASS = {
  rocks: { kind: 'tumbler', rimY: 66, rimW: 28, baseY: 146, baseW: 25.5, base: 10, wall: 1.8, tilt: .2, level: .5 },
  tall:  { kind: 'tumbler', rimY: 24, rimW: 19.5, baseY: 148, baseW: 17.5, base: 11, wall: 1.6, tilt: .2, level: .86 },
  coupe: { kind: 'coupe', rimY: 62, rimW: 34, depth: 27, stemY: 142, footW: 19, wall: 1.6, tilt: .22, level: .84 },
  /* a big white-wine glass, the way Lillet and a spritz are poured over ice */
  wine:  { kind: 'bowl', rimY: 36, rimW: 21, bellyY: 66, bellyW: 27, bottomY: 101, stemY: 146, footW: 20, wall: 1.5, tilt: .22, level: .6 },
  /* the balloon a Spanish bar pours its gin and tonic into */
  copa:  { kind: 'bowl', rimY: 34, rimW: 25, bellyY: 72, bellyW: 33, bottomY: 108, stemY: 146, footW: 22, wall: 1.5, tilt: .22, level: .56 }
};

const CITRUS = {
  orange: { peel: '#E28A33', zest: '#BF6420', pith: '#F7E8C8', flesh: '#F0A04A' },
  lemon:  { peel: '#E7C74A', zest: '#C3A12B', pith: '#F8F1D4', flesh: '#F1DD79' },
  lime:   { peel: '#8EAE48', zest: '#6A8B30', pith: '#EFF2D0', flesh: '#BDD279' }
};
const GLASS_TINT = '#D4DCDA';
const ICE_CLEAR = '#EEF2F0';
const SMOKE_INK = '#8A9497';

/* what the drink looks like once the options are applied */
function visual(drink, opts = {}) {
  const v = {
    glass: drink.glass, color: drink.color, ice: drink.ice, garnish: drink.garnish,
    bubbles: !!drink.bubbles, foam: false, bitters: false, smoke: !!opts.smoke
  };
  /* a sour with egg white goes up in a coupe, no ice, foam on top */
  if (drink.egg && opts.egg) {
    v.glass = 'coupe';
    v.ice = 'none';
    v.foam = true;
    v.bitters = drink.id === 'whiskey-sour';
  }
  return v;
}

/* where the walls are at any height, for each kind of glass */
function geometry(G) {
  if (G.kind === 'tumbler') {
    const outerAt = (y) => G.rimW + (G.baseW - G.rimW) * ((y - G.rimY) / (G.baseY - G.rimY));
    const innerAt = (y) => outerAt(y) - G.wall;
    const bottom = G.baseY - G.base;
    const levelY = bottom - G.level * (bottom - (G.rimY + 4));
    return { G, outerAt, innerAt, bottom, levelY, groundY: G.baseY, groundW: G.baseW };
  }
  if (G.kind === 'bowl') {
    /* in towards the rim above the belly, round underneath it */
    const profile = (y, rim, belly, bottom) => (y <= G.bellyY
      ? rim + (belly - rim) * Math.sin(Math.max(0, (y - G.rimY) / (G.bellyY - G.rimY)) * Math.PI / 2)
      : belly * Math.sqrt(Math.max(0, 1 - ((y - G.bellyY) / (bottom - G.bellyY)) ** 2)));
    const bottom = G.bottomY - G.wall;
    return {
      G,
      outerAt: (y) => profile(y, G.rimW, G.bellyW, G.bottomY),
      innerAt: (y) => profile(y, G.rimW - G.wall, G.bellyW - G.wall, bottom),
      bottom,
      levelY: bottom - G.level * (bottom - G.rimY),
      groundY: G.stemY, groundW: G.footW, stemTop: G.bottomY - .6
    };
  }
  const Di = G.depth - G.wall;
  const Ri = G.rimW - G.wall;
  const outerAt = (y) => G.rimW * Math.sqrt(Math.max(0, 1 - ((y - G.rimY) / G.depth) ** 2));
  const innerAt = (y) => Ri * Math.sqrt(Math.max(0, 1 - ((y - G.rimY) / Di) ** 2));
  return {
    G, outerAt, innerAt, Di, Ri,
    bottom: G.rimY + Di,
    levelY: G.rimY + (1 - G.level) * Di,
    groundY: G.stemY, groundW: G.footW, stemTop: G.rimY + G.depth - .6
  };
}

/* down one side of a bowl from y0 to y1, closer together near the bottom
   where the curve turns fastest */
function bowlSide(widthAt, y0, y1, n) {
  return trace((t) => {
    const y = y0 + (y1 - y0) * (1 - (1 - t) ** 2);
    return [CX - widthAt(y), y];
  }, n);
}
const mirrored = (side) => side.slice().reverse().map(([x, y]) => [2 * CX - x, y]);

/* The inside of the glass filled to y: down one wall, across the bottom,
   up the other, and back along the far edge of the surface. `inset`
   leaves a hair of paper between the wash and the glass's ink line,
   the way a hand-tinted drawing never quite meets its outline. */
function fillPts(geo, y, inset = 0) {
  const { G, bottom } = geo;
  const innerAt = (yy) => Math.max(0, geo.innerAt(yy) - inset);
  const rx = innerAt(y);
  const back = arc(CX, y, rx, rx * G.tilt, 0, -Math.PI, 20);
  if (G.kind === 'tumbler') {
    const bot = bottom - inset * .7;
    const rb = innerAt(bot);
    return join(
      line([CX - rx, y], [CX - rb, bot], 8),
      arc(CX, bot, rb, rb * G.tilt, Math.PI, 0, 20),
      line([CX + rb, bot], [CX + rx, y], 8),
      back
    );
  }
  if (G.kind === 'bowl') {
    const left = bowlSide(innerAt, y, bottom - inset * .7, 22);
    return join(left, mirrored(left), back);
  }
  const Ri = geo.Ri - inset, Di = geo.Di - inset * .7;
  const from = Math.asin(Math.max(-1, Math.min(1, (y - G.rimY) / Di)));
  const left = trace((t) => {
    const p = from + (Math.PI / 2 - from) * t;
    return [CX - Ri * Math.cos(p), G.rimY + Di * Math.sin(p)];
  }, 18);
  const right = left.slice().reverse().map(([x, py]) => [2 * CX - x, py]);
  return join(left, right, back);
}

/* the outside of the glass, for its faint tint */
function silhouettePts(geo) {
  const { G } = geo;
  const backRim = arc(CX, G.rimY, G.rimW, G.rimW * G.tilt, 0, -Math.PI, 20);
  if (G.kind === 'tumbler') {
    return join(
      line([CX - G.rimW, G.rimY], [CX - G.baseW, G.baseY], 6),
      arc(CX, G.baseY, G.baseW, G.baseW * G.tilt, Math.PI, 0, 20),
      line([CX + G.baseW, G.baseY], [CX + G.rimW, G.rimY], 6),
      backRim
    );
  }
  if (G.kind === 'bowl') {
    const left = bowlSide(geo.outerAt, G.rimY, G.bottomY, 24);
    return join(left, mirrored(left), backRim);
  }
  const left = trace((t) => {
    const p = (Math.PI / 2) * t;
    return [CX - G.rimW * Math.cos(p), G.rimY + G.depth * Math.sin(p)];
  }, 18);
  const right = left.slice().reverse().map(([x, y]) => [2 * CX - x, y]);
  return join(left, right, backRim);
}

function drawDrink(drink, opts = {}, mode = 'static') {
  const v = visual(drink, opts);
  const G = GLASS[v.glass];
  const geo = geometry(G);
  const rand = seeded(drink.id + ':' + v.glass + (v.foam ? ':foam' : ''));
  const pouring = mode === 'pour' && !prefersStill();
  const moving = mode !== 'static';

  const svg = S('svg', { viewBox: ART_BOX, 'aria-hidden': 'true', focusable: 'false' });
  const defs = S('defs');
  svg.appendChild(defs);

  /* ---------- the paper under it ---------- */
  svg.appendChild(S('ellipse', {
    cx: CX + 5, cy: geo.groundY + 2.4, rx: geo.groundW + 10, ry: 3.6,
    fill: INK, 'fill-opacity': .075
  }));
  /* light through the drink lands on the paper in the drink's colour */
  svg.appendChild(S('ellipse', {
    cx: CX + 12, cy: geo.groundY + 3.4, rx: geo.groundW * .9, ry: 2.6,
    fill: lighten(v.color, .25), 'fill-opacity': .2
  }));

  if (G.kind !== 'tumbler') svg.appendChild(drawStemAndFoot(geo, rand));

  /* ---------- the glass, faintly ---------- */
  svg.appendChild(S('path', { d: smooth(silhouettePts(geo), true), fill: GLASS_TINT, 'fill-opacity': .24 }));
  svg.appendChild(brush(arc(CX, G.rimY, G.rimW, G.rimW * G.tilt, Math.PI * 1.04, Math.PI * 1.96, 24), .8,
    { rand, alpha: .5, taper: .3 }));

  /* ---------- inside: liquid, ice, bubbles, foam ---------- */
  const inside = clipPath(defs, smooth(fillPts(geo, G.rimY), true));
  const within = S('g', { 'clip-path': 'url(#' + inside + ')' });
  svg.appendChild(within);

  const L = v.foam ? geo.levelY + 1.5 : geo.levelY;
  const liquid = S('g');
  let reveal = null;
  if (pouring) {
    reveal = S('rect', { x: 0, width: 120, y: geo.bottom + 8, height: 0 });
    const rid = inkId('pour');
    defs.appendChild(S('clipPath', { id: rid }, [reveal]));
    liquid.setAttribute('clip-path', 'url(#' + rid + ')');
  }

  const bodyD = smooth(wobble(fillPts(geo, L, 1.1), .3, rand), true);
  const bodyClip = clipPath(defs, bodyD);
  const grad = inkId('lg');
  defs.appendChild(S('linearGradient', { id: grad, x1: 0, y1: 0, x2: .25, y2: 1 }, [
    S('stop', { offset: 0, 'stop-color': lighten(v.color, .3) }),
    S('stop', { offset: .55, 'stop-color': v.color }),
    S('stop', { offset: 1, 'stop-color': deepen(v.color, .08) })
  ]));
  liquid.appendChild(wash(bodyD, v.color, {
    fill: 'url(#' + grad + ')', alpha: .9, edge: .32, edgeWidth: 2.4, edgeAlpha: .42, clipTo: bodyClip
  }));
  /* the paler bloom where the wash ran back on itself */
  const rxL = geo.innerAt(L) - 1.1;
  liquid.appendChild(S('ellipse', {
    cx: CX - rxL * .32, cy: L + (geo.bottom - L) * .42, rx: rxL * .42, ry: Math.max(4, (geo.bottom - L) * .24),
    fill: lighten(v.color, .55), 'fill-opacity': .2, 'clip-path': 'url(#' + bodyClip + ')'
  }));
  liquid.appendChild(S('path', { d: bodyD, fill: 'url(#' + grainPattern(defs, rand, deepen(v.color, .5)) + ')' }));

  if (v.garnish === 'cherry') liquid.appendChild(cherry(geo, L, rand));

  /* ice: tinted where it sits in the drink, clear where it rises out */
  const cubes = iceFor(v.ice, geo, L, rand);
  const below = S('g', { 'clip-path': 'url(#' + clipPath(defs, poly([[0, L], [120, L], [120, 170], [0, 170]])) + ')' });
  const above = S('g', { 'clip-path': 'url(#' + clipPath(defs, poly([[0, 0], [120, 0], [120, L], [0, L]])) + ')' });
  const lines = S('g');
  cubes.forEach((c) => {
    const melt = () => S('g', { class: pouring ? 'melt' : null });
    const place = () => S('g', { transform: 'translate(' + fx(c.x) + ' ' + fx(c.y) + ') rotate(' + fx(c.rot) + ')' });
    const b = place(), bm = melt(); b.appendChild(bm);
    bm.appendChild(S('path', { d: c.d, fill: lighten(v.color, .58), 'fill-opacity': .74 }));
    below.appendChild(b);
    const a = place(), am = melt(); a.appendChild(am);
    am.appendChild(S('path', { d: c.d, fill: ICE_CLEAR, 'fill-opacity': .8 }));
    above.appendChild(a);
    const l = place(), lm = melt(); l.appendChild(lm);
    c.lines.forEach((n) => lm.appendChild(n));
    lines.appendChild(l);
  });
  liquid.appendChild(below);

  /* the surface, lighter where it catches the sky, and its waterline */
  const ry = rxL * G.tilt;
  liquid.appendChild(S('ellipse', { cx: CX, cy: L, rx: rxL, ry, fill: lighten(v.color, .46), 'fill-opacity': .78 }));
  liquid.appendChild(brush(arc(CX, L, rxL - 3, ry - .7, -Math.PI * .86, -Math.PI * .6, 6), 1.1,
    { color: GOUACHE, alpha: .75, taper: .4, even: true }));

  within.appendChild(liquid);
  within.appendChild(above);
  within.appendChild(lines);
  if (G.kind !== 'coupe' && v.garnish === 'orange-slice') within.appendChild(sunkenSlice(geo, L, rand, v.color));

  const surface = S('g');
  if (reveal) surface.setAttribute('clip-path', liquid.getAttribute('clip-path'));
  surface.appendChild(pen(arc(CX, L, rxL, ry, Math.PI, 0, 22), .7, { color: deepen(v.color, .38), alpha: .55 }));
  if (v.bubbles) bubblesIn(surface, geo, L, rand, moving);
  if (v.foam) surface.appendChild(foam(geo, rand, v.bitters));
  within.appendChild(surface);

  /* ---------- garnish that sits on the rim goes behind the glass's ink,
     so the rim and the wall cross it the way a slot would ---------- */
  const g = v.garnish;
  if (g === 'lemon-wheel') svg.appendChild(wheel(geo, CITRUS.lemon, rand));
  else if (/-wedge$/.test(g)) svg.appendChild(wedge(geo, CITRUS[g.split('-')[0]], rand));

  /* ---------- the glass in ink, then light on it ---------- */
  svg.appendChild(G.kind === 'tumbler' ? tumblerInk(geo, rand) : G.kind === 'bowl' ? bowlInk(geo, rand) : coupeInk(geo, rand));

  /* ---------- garnish that hangs in front, and smoke ---------- */
  if (/-twist$/.test(g)) svg.appendChild(twist(geo, CITRUS[g.split('-')[0]], rand));
  if (g === 'cherry') svg.appendChild(pick(geo, rand));

  if (v.smoke) svg.appendChild(smokeOver(geo, rand, mode === 'pour'));

  if (reveal) pour(reveal, geo, L - ry - 8);
  return svg;
}

/* fill from the bottom up over most of a second, easing as it tops up */
function pour(rect, geo, top) {
  const from = geo.bottom + 8;
  const start = performance.now();
  const D = 950;
  const step = (now) => {
    const t = Math.min(1, (now - start) / D);
    const e = 1 - Math.pow(1 - t, 3);
    const y = from - (from - top) * e;
    rect.setAttribute('y', fx(y));
    rect.setAttribute('height', fx(from - y + 2));
    if (t < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(() => requestAnimationFrame(step));
}

/* ---------- the glass ---------- */

function tumblerInk(geo, rand) {
  const { G } = geo;
  const t = G.tilt;
  const ink = S('g');
  /* the thick bottom, a band of glass between two ellipses */
  const ob = geo.outerAt(geo.bottom);
  ink.appendChild(S('path', {
    d: smooth(join(
      line([CX - ob, geo.bottom], [CX - G.baseW, G.baseY], 3),
      arc(CX, G.baseY, G.baseW, G.baseW * t, Math.PI, 0, 20),
      line([CX + G.baseW, G.baseY], [CX + ob, geo.bottom], 3),
      arc(CX, geo.bottom, ob, ob * t, 0, Math.PI, 20)
    ), true),
    fill: GLASS_TINT, 'fill-opacity': .5
  }));
  ink.appendChild(pen(arc(CX, geo.bottom, geo.innerAt(geo.bottom), geo.innerAt(geo.bottom) * t, Math.PI * .97, Math.PI * .03, 18), .6, { alpha: .4 }));
  /* walls */
  ink.appendChild(brush(wobble(line([CX - G.rimW, G.rimY], [CX - G.baseW, G.baseY], 12), .3, rand), 1.55, { rand, taper: .05 }));
  ink.appendChild(brush(wobble(line([CX + G.rimW, G.rimY], [CX + G.baseW, G.baseY], 12), .3, rand), 1.45, { rand, taper: .05 }));
  /* the lip: a heavier front edge with the glass's thickness just inside it */
  ink.appendChild(brush(arc(CX, G.rimY, G.rimW, G.rimW * t, Math.PI, 0, 26), 1.35, { rand, taper: .08 }));
  ink.appendChild(pen(arc(CX, G.rimY + 1, G.rimW - 1.7, (G.rimW - 1.7) * t, Math.PI * .9, Math.PI * .1, 18), .5, { alpha: .32 }));
  ink.appendChild(brush(arc(CX, G.baseY, G.baseW, G.baseW * t, Math.PI, 0, 24), 1.5, { rand, taper: .1 }));
  /* white gouache: a long gleam down the left, a short one on the right */
  ink.appendChild(brush(line([CX - G.rimW + 4.8, G.rimY + 9], [CX - G.baseW + 4.4, geo.bottom - 4], 8), 2.3,
    { color: GOUACHE, alpha: .8, rand, taper: .35 }));
  ink.appendChild(brush(line([CX + G.rimW - 5.2, G.rimY + 14], [CX + G.rimW - 5.6, G.rimY + 14 + (geo.bottom - G.rimY) * .28], 5), 1.2,
    { color: GOUACHE, alpha: .62, taper: .45, even: true }));
  ink.appendChild(brush(arc(CX, G.baseY - 3.4, G.baseW - 5, (G.baseW - 5) * t, Math.PI * .82, Math.PI * .6, 6), 1.3,
    { color: GOUACHE, alpha: .7, taper: .4, even: true }));
  return ink;
}

function coupeInk(geo, rand) {
  const { G } = geo;
  const t = G.tilt;
  const ink = S('g');
  const left = trace((u) => {
    const p = (Math.PI / 2) * u;
    return [CX - G.rimW * Math.cos(p), G.rimY + G.depth * Math.sin(p)];
  }, 20);
  const right = left.slice().reverse().map(([x, y]) => [2 * CX - x, y]);
  ink.appendChild(brush(wobble(join(left, right), .28, rand), 1.45, { rand, taper: .04 }));
  ink.appendChild(brush(arc(CX, G.rimY, G.rimW, G.rimW * t, Math.PI, 0, 28), 1.3, { rand, taper: .08 }));
  ink.appendChild(pen(arc(CX, G.rimY + 1, G.rimW - 1.7, (G.rimW - 1.7) * t, Math.PI * .9, Math.PI * .1, 18), .5, { alpha: .3 }));
  /* gleam along the inside of the bowl */
  ink.appendChild(brush(trace((u) => {
    const p = .2 + .72 * u;
    return [CX - (geo.Ri - 4) * Math.cos(p), G.rimY + 1.5 + (geo.Di - 4) * Math.sin(p)];
  }, 10), 2.1, { color: GOUACHE, alpha: .78, rand, taper: .4 }));
  return ink;
}

/* a wine glass or a balloon: the bowl in one stroke, the rim, two gleams */
function bowlInk(geo, rand) {
  const { G } = geo;
  const t = G.tilt;
  const ink = S('g');
  const left = bowlSide(geo.outerAt, G.rimY, G.bottomY, 26);
