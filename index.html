  ink.appendChild(brush(wobble(join(left, mirrored(left)), .28, rand), 1.4, { rand, taper: .04 }));
  ink.appendChild(brush(arc(CX, G.rimY, G.rimW, G.rimW * t, Math.PI, 0, 28), 1.3, { rand, taper: .08 }));
  ink.appendChild(pen(arc(CX, G.rimY + 1, G.rimW - 1.7, (G.rimW - 1.7) * t, Math.PI * .9, Math.PI * .1, 18), .5, { alpha: .3 }));
  const gleam = trace((u) => {
    const y = G.rimY + 9 + (G.bottomY - G.rimY - 22) * u;
    return [CX - geo.innerAt(y) + 4.4, y];
  }, 10);
  ink.appendChild(brush(gleam, 2.2, { color: GOUACHE, alpha: .78, rand, taper: .4 }));
  ink.appendChild(brush(trace((u) => {
    const y = G.bellyY - 7 + 13 * u;
    return [CX + geo.innerAt(y) - 4.6, y];
  }, 5), 1.2, { color: GOUACHE, alpha: .6, taper: .45, even: true }));
  return ink;
}

function drawStemAndFoot(geo, rand) {
  const { G } = geo;
  const g = S('g');
  const top = geo.stemTop;
  const fr = G.footW * G.tilt;
  g.appendChild(S('ellipse', { cx: CX, cy: G.stemY, rx: G.footW, ry: fr, fill: GLASS_TINT, 'fill-opacity': .45 }));
  g.appendChild(brush(arc(CX, G.stemY, G.footW, fr, Math.PI * 1.04, Math.PI * 1.96, 18), .7, { rand, alpha: .45, taper: .3 }));
  /* a rod of glass that swells into the bowl above and the foot below */
  const bot = G.stemY - fr * .4;
  const half = (u) => 1.2 + (u < .16 ? ((1 - u / .16) ** 2) * 2.8 : 0) + (u > .78 ? (((u - .78) / .22) ** 2) * 4.2 : 0);
  const leftEdge = trace((u) => [CX - half(u), top + (bot - top) * u], 18);
  const rightEdge = trace((u) => [CX + half(u), top + (bot - top) * u], 18);
  g.appendChild(S('path', { d: smooth(join(leftEdge, rightEdge.slice().reverse()), true), fill: GLASS_TINT, 'fill-opacity': .7 }));
  g.appendChild(brush(leftEdge, .85, { rand, taper: .12 }));
  g.appendChild(brush(rightEdge, .8, { rand, taper: .12 }));
  g.appendChild(brush(line([CX - .35, top + 7], [CX - .35, bot - 6], 4), .6, { color: GOUACHE, alpha: .8, taper: .3, even: true }));
  g.appendChild(brush(arc(CX, G.stemY, G.footW, fr, Math.PI, 0, 22), 1.35, { rand, taper: .12 }));
  return g;
}

/* ---------- ice ---------- */

/* A cube as a softened square drawn about its own centre — it is placed
   and rotated by a parent group, so a melt can scale it in place. */
function cube(size, rand) {
  const h = size / 2;
  const r = size * .2;
  const corner = (cx, cy, a0) => arc(cx, cy, r, r, a0, a0 + Math.PI / 2, 4);
  const pts = wobble(join(
    corner(h - r, h - r, 0), corner(-h + r, h - r, Math.PI / 2),
    corner(-h + r, -h + r, Math.PI), corner(h - r, -h + r, Math.PI * 1.5)
  ), size * .012, rand);
  const d = smooth(pts, true);
  const lines = [
    /* the far edges, seen through the ice */
    pen([[-h * .7 + 2.4, -h * .7 - 2.4], [h * .7 + 2.4, -h * .7 - 2.4], [h * .7 + 2.4, h * .7 - 2.4], [-h * .7 + 2.4, h * .7 - 2.4], [-h * .7 + 2.4, -h * .7 - 2.4]],
      .45, { alpha: .2, straight: true }),
    S('path', { d, fill: 'none', stroke: INK, 'stroke-width': .9, 'stroke-opacity': .62, 'stroke-linejoin': 'round' }),
    brush(line([-h + r * .7, -h + 2.2], [h * .3, -h + 1.6], 5), 1.3, { color: GOUACHE, alpha: .85, taper: .4, even: true }),
    brush(line([-h + 2, -h + r * .9], [-h + 1.6, h * .15], 5), 1.1, { color: GOUACHE, alpha: .7, taper: .4, even: true })
  ];
  return { d, lines };
}

function iceFor(kind, geo, L, rand) {
  const B = geo.bottom;
  let spots = [];
  if (kind === 'cube') spots = [[CX + 1, B - 19, 36, -7]];
  if (kind === 'cubes') spots = [[CX - 7, B - 13, 23, -12], [CX + 8, B - 31, 22, 14]];
  /* a bowl full of ice, the top cube breaking the surface */
  if (kind === 'bowl') spots = [[CX - 9, L + 12, 16, -10], [CX + 9, L + 10, 15, 13], [CX + 1, L + 25, 15, 4], [CX + 2, L - 2, 14, -5]];
  /* a highball is packed to the top: stack them until one breaks the surface */
  if (kind === 'tall') {
    for (let y = B - 11, i = 0; y > L; y -= 20, i++) {
      spots.push([CX + (i % 2 ? 2.5 : -1.5), y, 19 - i * .3, i % 2 ? 11 : -8]);
    }
  }
  return spots.map(([x, y, size, rot]) => Object.assign({ x, y, rot: rot + (rand() - .5) * 4 }, cube(size, rand)));
}

/* ---------- bubbles and foam ---------- */

function bubblesIn(group, geo, L, rand, moving) {
  /* spread across the glass a little above the bottom, which a bowl needs */
  const w = geo.innerAt(geo.bottom - (geo.bottom - L) * .3) * .62;
  for (let i = 0; i < 8; i++) {
    const x = CX + (rand() * 2 - 1) * w;
    const y = geo.bottom - 4 - rand() * (geo.bottom - L) * .55;
    const c = S('circle', {
      cx: x, cy: y, r: .6 + rand() * .75,
      fill: GOUACHE, 'fill-opacity': .55, stroke: INK, 'stroke-opacity': .38, 'stroke-width': .4,
      class: moving ? 'bubble' : null
    });
    if (moving) {
      c.style.animationDuration = (2.6 + rand() * 2.2).toFixed(2) + 's';
      c.style.animationDelay = (-rand() * 4).toFixed(2) + 's';
      c.style.setProperty('--rise', -(y - L - 3).toFixed(1) + 'px');
    }
    group.appendChild(c);
  }
}

function foam(geo, rand, bitters) {
  const { G } = geo;
  const g = S('g');
  const top = geo.levelY - 2.5;
  const rx = geo.innerAt(top);
  const ry = rx * G.tilt;
  /* the head: everything inside the bowl above a line seven units down */
  const depthY = top + 4.5;
  const rxD = geo.innerAt(depthY);
  const head = join(
    arc(CX, top, rx, ry, Math.PI, Math.PI * 2, 20),
    line([CX + rx, top], [CX + rxD, depthY], 3),
    arc(CX, depthY, rxD, rxD * G.tilt, 0, Math.PI, 20),
    line([CX - rxD, depthY], [CX - rx, top], 3)
  );
  g.appendChild(wash(smooth(head, true), '#E3D5BA', { fill: '#ECE1CB', alpha: .97, edge: .14, edgeAlpha: .45 }));
  g.appendChild(S('ellipse', { cx: CX, cy: top, rx, ry, fill: '#F6EFE1', 'fill-opacity': .96 }));
  g.appendChild(S('ellipse', { cx: CX - rx * .25, cy: top - ry * .2, rx: rx * .45, ry: ry * .45, fill: GOUACHE, 'fill-opacity': .5 }));
  /* a little texture in the foam */
  for (let i = 0; i < 22; i++) {
    const a = rand() * Math.PI * 2, d = Math.sqrt(rand());
    g.appendChild(S('circle', {
      cx: CX + Math.cos(a) * rx * .9 * d, cy: top + Math.sin(a) * ry * .8 * d + (rand() < .5 ? 0 : 3.5 * rand()),
      r: .3 + rand() * .35, fill: INK, 'fill-opacity': .14 + rand() * .12
    }));
  }
  g.appendChild(pen(arc(CX, top, rx, ry, Math.PI, 0, 20), .5, { color: '#B9AC93', alpha: .7 }));
  if (bitters) {
    [-9, 0, 9].forEach((dx, i) => {
      const cy = top + Math.sqrt(Math.max(0, 1 - (dx / rx) ** 2)) * ry * (i === 1 ? .1 : -.25);
      g.appendChild(wash(smooth(arc(CX + dx, cy, 2, 1.15, 0, Math.PI * 2, 10), true), '#8E2F1F', { alpha: .82, edge: .3, edgeWidth: .5 }));
    });
  }
  return g;
}

/* ---------- garnish ---------- */

/* A long strip of peel over the rim, twisting down the outside. Its
   width follows the twist, so it reads as a ribbon turning in the light. */
function twist(geo, c, rand) {
  const { G } = geo;
  const x0 = CX + G.rimW + 5;
  const pts = join(
    [[CX + G.rimW * .34, G.rimY + 3.5], [CX + G.rimW * .68, G.rimY - 2.6], [CX + G.rimW + 1.6, G.rimY - 3]],
    trace((t) => [x0 + 4.4 * Math.sin(t * Math.PI * 3.3 + .4), G.rimY - 1 + t * 27], 30)
  );
  const width = (t) => 3.6 * (.3 + .7 * Math.abs(Math.cos(t * Math.PI * 3.6 + .3)));
  const g = S('g');
  const d = brushD(pts, width, { rand, taper: .06, taperEnd: .2, vary: .1 });
  g.appendChild(wash(d, c.peel, { alpha: .95, edge: .35, edgeWidth: .7, edgeAlpha: .7 }));
  /* the pale side of the peel where the ribbon turns */
  g.appendChild(brush(pts, (t) => width(t) * .28, { color: c.pith, alpha: .7, taper: .1, even: true }));
  for (let i = 0; i < 9; i++) {
    const p = pts[Math.floor(4 + rand() * (pts.length - 6))];
    g.appendChild(S('circle', { cx: p[0] + (rand() - .5) * 1.4, cy: p[1] + (rand() - .5) * 1.4, r: .32, fill: c.zest, 'fill-opacity': .8 }));
  }
  g.appendChild(pen(pts.slice(0, 5), .5, { alpha: .45 }));
  return g;
}

/* a wheel of citrus slotted onto the rim */
function wheel(geo, c, rand) {
  const { G } = geo;
  const cx = CX + G.rimW + 2.5, cy = G.rimY - 1, r = 11.5;
  const g = S('g');
  const disc = (rr) => smooth(wobble(arc(cx, cy, rr, rr, 0, Math.PI * 2, 24).slice(0, 24), .18, rand), true);
  g.appendChild(wash(disc(r), c.peel, { alpha: .95, edge: .35, edgeWidth: .8, edgeAlpha: .7 }));
  g.appendChild(S('path', { d: disc(r - 1.5), fill: c.pith }));
  g.appendChild(wash(disc(r - 2.5), c.flesh, { alpha: .9, edge: .18, edgeWidth: .6 }));
  for (let i = 0; i < 9; i++) {
    const a = (i / 9) * Math.PI * 2 + rand() * .12;
    g.appendChild(pen([[cx + Math.cos(a) * 1.4, cy + Math.sin(a) * 1.4], [cx + Math.cos(a) * (r - 2.6), cy + Math.sin(a) * (r - 2.6)]], .7,
      { color: c.pith, alpha: .95, straight: true }));
  }
  g.appendChild(S('circle', { cx, cy, r: 1.3, fill: c.pith }));
  g.appendChild(S('path', { d: disc(r), fill: 'none', stroke: INK, 'stroke-width': .55, 'stroke-opacity': .45 }));
  return g;
}

/* a wedge perched on the rim, flesh towards us */
function wedge(geo, c, rand) {
  const { G } = geo;
  const cx = CX + G.rimW - 6, cy = G.rimY + 3;
  const r = 14;
  const a0 = -Math.PI * .92, a1 = -Math.PI * .34;
  const g = S('g');
  const sector = (rr) => join([[cx, cy]], arc(cx, cy, rr, rr * .92, a0, a1, 14));
  g.appendChild(wash(smooth(wobble(sector(r), .15, rand), true), c.peel, { alpha: .95, edge: .35, edgeWidth: .8, edgeAlpha: .7 }));
  g.appendChild(S('path', { d: smooth(sector(r - 1.5), true), fill: c.pith }));
  g.appendChild(wash(smooth(sector(r - 2.6), true), c.flesh, { alpha: .9, edge: .18, edgeWidth: .6 }));
  [.36, .64].forEach((f) => {
    const a = a0 + (a1 - a0) * f;
    g.appendChild(pen([[cx, cy], [cx + Math.cos(a) * (r - 2.6), cy + Math.sin(a) * (r - 2.6) * .92]], .65, { color: c.pith, straight: true, alpha: .95 }));
  });
  g.appendChild(S('path', { d: smooth(sector(r), true), fill: 'none', stroke: INK, 'stroke-width': .55, 'stroke-opacity': .45 }));
  return g;
}

/* half a wheel pressed against the inside of a highball, among the ice */
function sunkenSlice(geo, L, rand, liquid) {
  const c = CITRUS.orange;
  const cx = CX - geo.innerAt(L) * .35, cy = L + (geo.bottom - L) * .38, r = 11;
  const g = S('g', { transform: 'rotate(-14 ' + fx(cx) + ' ' + fx(cy) + ')' });
  const half = (rr) => smooth(join(arc(cx, cy, rr, rr, -Math.PI / 2, Math.PI / 2, 14), [[cx, cy + rr]]), true);
  g.appendChild(wash(half(r), mix(c.peel, liquid, .25), { alpha: .9, edge: .3, edgeWidth: .7 }));
  g.appendChild(S('path', { d: half(r - 1.4), fill: mix(c.pith, liquid, .2) }));
  g.appendChild(wash(half(r - 2.4), mix(c.flesh, liquid, .25), { alpha: .88, edge: .15, edgeWidth: .5 }));
  for (let i = 1; i < 5; i++) {
    const a = -Math.PI / 2 + (i / 5) * Math.PI;
    g.appendChild(pen([[cx + 1, cy], [cx + Math.cos(a) * (r - 2.4), cy + Math.sin(a) * (r - 2.4)]], .6, { color: mix(c.pith, liquid, .2), straight: true }));
  }
  return g;
}

/* a cherry on a bamboo pick, resting across the rim of the coupe */
function cherry(geo, L, rand) {
  const { G } = geo;
  const cx = CX + 7, cy = L + 8.5;
  const g = S('g');
  g.appendChild(wash(smooth(wobble(arc(cx, cy, 4.9, 4.6, 0, Math.PI * 2, 16).slice(0, 16), .15, rand), true), '#7C1D27', { alpha: .95, edge: .4, edgeWidth: 1 }));
  g.appendChild(brush(arc(cx, cy, 2.8, 2.6, -Math.PI * .9, -Math.PI * .55, 5), 1.1, { color: GOUACHE, alpha: .65, taper: .4, even: true }));
  return g;
}
function pick(geo, rand) {
  const { G } = geo;
  const g = S('g');
  const from = [CX + G.rimW + 9, G.rimY - 20];
  const to = [CX + 5.5, geo.levelY + 11];
  g.appendChild(brush(line(from, to, 8), 1.6, { color: '#C7A26A', alpha: .95, taper: .05, even: true }));
  g.appendChild(pen(line(from, to, 2), .45, { alpha: .55, straight: true }));
  /* the bark left on at the top of a kuromoji pick */
  g.appendChild(brush(line(from, [from[0] + (to[0] - from[0]) * .16, from[1] + (to[1] - from[1]) * .16], 3), 1.9, { color: '#6E4E2E', alpha: .9, taper: 0, even: true }));
  return g;
}

/* ---------- smoke ---------- */

/* Smoke drawn the way incense rises: a fine line at the core, a fainter
   wider haze around it, both widening and wandering as they climb. */
function smokeOver(geo, rand, rising) {
  const { G } = geo;
  const g = S('g');
  const top = G.rimY - G.rimW * G.tilt - 1;
  [
    { x: CX - 3, h: rising ? 46 : 30, amp: 4.5, ph: 0, delay: 0 },
    { x: CX + 6, h: rising ? 38 : 25, amp: 3.6, ph: 2.3, delay: 2.4 }
  ].forEach((w) => {
    const pts = trace((t) => [w.x + Math.sin(t * Math.PI * 2.1 + w.ph) * w.amp * (.25 + t) + t * t * 5, top - t * w.h], 26);
    const wisp = S('g', { class: rising ? 'wisp' : null, opacity: rising ? null : .75 });
    wisp.appendChild(brush(pts, (t) => 8 * (.35 + t), { color: SMOKE_INK, alpha: .07, rand, taper: .25, taperEnd: .35, vary: .35 }));
    wisp.appendChild(brush(pts, (t) => 3.4 * (.45 + t * .7), { color: SMOKE_INK, alpha: .13, rand, taper: .2, taperEnd: .4, vary: .3 }));
    wisp.appendChild(brush(pts, (t) => 1.1 * (1 - t * .45), { color: SMOKE_INK, alpha: .34, rand, taper: .08, taperEnd: .55, vary: .2 }));
    if (rising) wisp.style.animationDelay = w.delay + 's';
    g.appendChild(wisp);
  });
  return g;
}

/* a drawing in a box, ready to drop into the page */
function artBox(cls, drink, opts, mode) {
  const box = el('div', cls);
  box.appendChild(drawDrink(drink, opts, mode));
  return box;
}

/* ---------- js/05-bar.js ---------- */
/* ================================================================
   THE BAR
   The bar with nobody at it: a lit back bar of bottles, a paper
   lantern, and on the hinoki counter the tools of the trade. Tap one
   and it does its party piece for ten seconds: the wine bottles juggle
   themselves, the spoon stirs, the shaker gives a hard shake, and a
   golf ball is chipped into a coupe. An order arriving sets the shaker
   going too.

   Every arrival paints it onto the page the way a painter would, a part
   at a time, and presses the house seal on the front of the bar to
   finish.

   Things are drawn on a stage 340 units wide that keeps its size: up
   to 560px on a phone and 800px on a desktop. The counter and the
   shelves run on past it to the edges of the window. Groups that move
   carry the class `moves` and no transform attribute of their own; a
   parent group places them (bar.css).
   ================================================================ */

const COUNTER_Y = 140;                /* the front edge of the bar top */
const BAR_TOP = COUNTER_Y - 2;        /* where things stand on it */
const LABEL = '#F4F0E8';              /* paper labels */

/* a group the stylesheet animates, sitting inside one that places it */
function joint(x, y, cls) {
  const inner = S('g', { class: 'moves ' + cls });
  const outer = S('g', { transform: 'translate(' + fx(x) + ' ' + fx(y) + ')' }, [inner]);
  return { outer, inner };
}
const moving = (x, y, cls, kids) => {
  const j = joint(x, y, cls);
  kids.forEach((k) => j.inner.appendChild(k));
  return j.outer;
};
/* a thing the painter draws as one: the part of the bar it belongs to,
   and where it comes in that part's order (see "painted in") */
const paintAs = (el, part, order) => {
  el.setAttribute('data-part', part);
  el.setAttribute('data-order', order);
  return el;
};

/* ---------- the room ---------- */

function lantern(rand) {
  /* hung from the top edge; it sways about where the cord is tied */
  const hang = joint(180, -4, 'lantern');
  const g = S('g', { transform: 'scale(.84)' });
  hang.inner.appendChild(g);
  g.appendChild(pen([[0, 0], [0, 15]], .6, { alpha: .7, straight: true }));
  g.appendChild(S('rect', { x: -3.4, y: 14.6, width: 6.8, height: 3.6, rx: .6, fill: '#3B3530' }));
  const glow = inkId('lamp');
  const body = 'M0,18 C13,18 16.6,28 16.6,36.4 C16.6,46 11,55.4 0,55.4 C-11,55.4 -16.6,46 -16.6,36.4 C-16.6,28 -13,18 0,18 Z';
  g.appendChild(S('defs', {}, [S('radialGradient', { id: glow, cx: .45, cy: .48, r: .6 }, [
    S('stop', { offset: 0, 'stop-color': '#FFF4D8' }),
    S('stop', { offset: .7, 'stop-color': '#F3DDAE' }),
    S('stop', { offset: 1, 'stop-color': '#DDBF8A' })
  ])]));
  g.appendChild(S('path', { d: body, fill: '#EFE6D4' }));
  g.appendChild(S('path', { d: body, fill: 'url(#' + glow + ')', class: 'lantern-light' }));
  /* the bamboo ribs show through the paper */
  for (let y = 22.5; y < 53; y += 4.2) {
    const half = 16.6 * Math.sqrt(Math.max(0, 1 - ((y - 36.6) / 19.4) ** 2));
    g.appendChild(pen(arc(0, y, half, half * .16, Math.PI * .98, Math.PI * .02, 12), .45, { alpha: .22 }));
  }
  g.appendChild(S('path', { d: body, fill: 'none', stroke: INK, 'stroke-width': .9, 'stroke-opacity': .75 }));
  g.appendChild(S('rect', { x: -4.2, y: 54.4, width: 8.4, height: 2.4, rx: .8, fill: '#3B3530' }));
  return paintAs(hang.outer, 'lantern', 0);
}

/* The bar top and the front of the slab, from x0 to x1, and the vase and
   the bottle at either end of the stage. The long front edge of the bar
   top is the first line the painter draws; the rest of the slab, its
   other edges and its washes, waits until what stands on it is drawn. */
function counter(rand, x0, x1) {
  const g = S('g');
  const top = COUNTER_Y;
  const slab = paintAs(S('g'), 'counter', 13);
  slab.appendChild(wash(poly([[x0, top - 6], [x1, top - 6], [x1, top], [x0, top]]), '#E6D2B0', { alpha: 1, edge: 0 }));
  slab.appendChild(wash(poly([[x0, top], [x1, top], [x1, top + 22], [x0, top + 22]]), '#D2B288', { alpha: 1, edge: 0 }));
  /* grain, in long runs along the slab */
  const runs = Math.ceil((x1 - x0) / 38);
  for (let i = 0; i < runs; i++) {
    const y = top + 3 + (i % 9) * 2.2 + rand() * 1.2;
    const sx = x0 - 40 + (i / runs) * (x1 - x0) + rand() * 50;
    const pts = trace((t) => [sx + t * (180 + rand() * 60), y + Math.sin(t * Math.PI * (1 + rand())) * 1.2], 10);
    slab.appendChild(pen(pts, .35, { color: '#8C6A43', alpha: .28 + rand() * .2 }));
  }
  const edge = paintAs(brush(line([x0, top], [x1, top], Math.ceil((x1 - x0) / 16)), 1.2, { rand, taper: 0 }), 'counter', 0);
  slab.appendChild(pen(line([x0, top - 6], [x1, top - 6], 2), .5, { alpha: .45, straight: true }));
  slab.appendChild(pen(line([x0, top + 22], [x1, top + 22], 2), .7, { alpha: .55, straight: true }));
  slab.appendChild(pen(line([x0, top - 3.2], [x1, top - 3.2], 2), .8, { color: GOUACHE, alpha: .5, straight: true }));
  g.appendChild(slab);
  g.appendChild(edge);

  /* a single branch in a stoneware vase at one end of the stage… */
  const vx = 30, vy = top - 3;
  const vase = paintAs(S('g'), 'counter', 7);
  g.appendChild(vase);
  vase.appendChild(wash('M' + (vx - 5) + ',' + vy + ' Q' + (vx - 7.4) + ',' + (vy - 9) + ' ' + (vx - 2.2) + ',' + (vy - 13) + ' L' + (vx - 2.2) + ',' + (vy - 17) +
    ' L' + (vx + 2.2) + ',' + (vy - 17) + ' L' + (vx + 2.2) + ',' + (vy - 13) + ' Q' + (vx + 7.4) + ',' + (vy - 9) + ' ' + (vx + 5) + ',' + vy + ' Z',
    '#B9AC97', { alpha: .97, edge: .35, edgeWidth: .8, edgeAlpha: .8 }));
  const branch = [[vx, vy - 16], [vx + 3, vy - 30], [vx + 1, vy - 44], [vx + 7, vy - 56]];
  vase.appendChild(brush(branch, 1.2, { rand, taper: .1, taperEnd: .5 }));
  [[vx + 3, vy - 30, 1], [vx + 1.4, vy - 41, -1], [vx + 5.6, vy - 51, 1]].forEach(([x, y, s]) => {
    vase.appendChild(wash(smooth([[x, y], [x + 4 * s, y - 3], [x + 7.5 * s, y - 1.5], [x + 3.6 * s, y + 1.2]], true), '#7F8F55', { alpha: .9, edge: .3, edgeWidth: .5 }));
  });

  /* …and the bottle that's being poured at the other */
  const bx = 334, by = top - 3;
  const bottleD = 'M' + (bx - 5) + ',' + by + ' L' + (bx - 5) + ',' + (by - 22) + ' Q' + (bx - 5) + ',' + (by - 27) + ' ' + (bx - 1.6) + ',' + (by - 29) +
    ' L' + (bx - 1.6) + ',' + (by - 36) + ' L' + (bx + 1.6) + ',' + (by - 36) + ' L' + (bx + 1.6) + ',' + (by - 29) + ' Q' + (bx + 5) + ',' + (by - 27) + ' ' + (bx + 5) + ',' + (by - 22) + ' L' + (bx + 5) + ',' + by + ' Z';
  const bottle = paintAs(S('g'), 'counter', 12);
  g.appendChild(bottle);
  bottle.appendChild(wash(bottleD, '#A86A2C', { alpha: .9, edge: .3, edgeWidth: .8 }));
  bottle.appendChild(S('rect', { x: bx - 4, y: by - 17, width: 8, height: 8, fill: LABEL, stroke: INK, 'stroke-width': .4, 'stroke-opacity': .6 }));
  bottle.appendChild(brush(line([bx - 3, by - 3], [bx - 3, by - 20], 4), .9, { color: GOUACHE, alpha: .6, taper: .3, even: true }));
  bottle.appendChild(S('rect', { x: bx - 2, y: by - 38.5, width: 4, height: 3, fill: '#3B3530' }));
  bottle.appendChild(S('path', { d: bottleD, fill: 'none', stroke: INK, 'stroke-width': .7, 'stroke-opacity': .8 }));
  return g;
}

/* ---------- the back bar ---------- */

/* Bottles, each standing on 0,0: its outline, where the cap sits, and the
   paper label on the front when it has one. */
const BOTTLES = {
  square:   { w: 9.2, neck: -20.6, nw: 1.5, label: [-3.6, -11.4, 7.2, 6.2],
    d: 'M-4.6,0 L4.6,0 L4.6,-14 Q4.6,-16.2 2.4,-16.6 L1.5,-16.8 L1.5,-20.6 L-1.5,-20.6 L-1.5,-16.8 L-2.4,-16.6 Q-4.6,-16.2 -4.6,-14 Z' },
  round:    { w: 7.2, neck: -24.2, nw: 1.2, label: [-3, -9.6, 6, 5],
    d: 'M-3.6,0 L3.6,0 L3.6,-12 Q3.6,-15.6 1.2,-17.2 L1.2,-24.2 L-1.2,-24.2 L-1.2,-17.2 Q-3.6,-15.6 -3.6,-12 Z' },
  slim:     { w: 6, neck: -26.4, nw: 1.1, label: [-2.4, -12.6, 4.8, 7],
    d: 'M-3,0 L3,0 L3,-17 Q3,-19.2 1.1,-20.2 L1.1,-26.4 L-1.1,-26.4 L-1.1,-20.2 Q-3,-19.2 -3,-17 Z' },
  squat:    { w: 11, neck: -16, nw: 1.3, label: [-3.2, -8, 6.4, 4],
    d: 'M-4.4,0 L4.4,0 Q6.2,-5.6 4.2,-10 Q2.8,-12.2 1.3,-12.6 L1.3,-16 L-1.3,-16 L-1.3,-12.6 Q-2.8,-12.2 -4.2,-10 Q-6.2,-5.6 -4.4,0 Z' },
  decanter: { w: 11.2, neck: -18.2, nw: 1.6, label: null,
    d: 'M-4.9,0 L4.9,0 Q5.7,-6.4 4.9,-12.4 Q4.1,-15.2 1.6,-15.6 L1.6,-18.2 L-1.6,-18.2 L-1.6,-15.6 Q-4.1,-15.2 -4.9,-12.4 Q-5.7,-6.4 -4.9,0 Z' }
};
const BOTTLE_KINDS = Object.keys(BOTTLES);
/* whisky, brandy, gin, a blue gin, the bitter red, vermouth, chartreuse,
   amaro, tequila, a green sake bottle, an old gold liqueur */
const SPIRITS = ['#B47A34', '#8C5426', '#D5DED7', '#6E8BA3', '#A93A2E', '#6F2C28', '#7E8F4A', '#4B3A2E', '#E2DBC9', '#5F7656', '#C59A4A'];
/* where each shelf's bottles stand: one high, one behind the counter */
const SHELVES = [44, 100];

const placed = (item) => 'translate(' + fx(item.x) + ' ' + item.y + ') scale(' + fx(item.scale) + ')';

function shelfBottle(item) {
  const b = BOTTLES[item.kind];
  const g = S('g', { transform: placed(item) });
  g.appendChild(wash(b.d, item.color, { alpha: .92, edge: .3, edgeWidth: .7 }));
  if (b.label && item.label) g.appendChild(S('rect', { x: b.label[0], y: b.label[1], width: b.label[2], height: b.label[3], rx: .5, fill: '#F3EDE1', 'fill-opacity': .9 }));
  g.appendChild(pen([[-b.w * .27, -2.2], [-b.w * .27, b.neck * .5]], .7, { color: GOUACHE, alpha: .55, straight: true }));
  g.appendChild(S('rect', { x: -b.nw - .3, y: b.neck - 2.4, width: (b.nw + .3) * 2, height: 2.4, rx: .5, fill: item.gold ? '#B08D4A' : '#3B3530' }));
  g.appendChild(S('path', { d: b.d, fill: 'none', stroke: INK, 'stroke-width': .5, 'stroke-opacity': .55, 'stroke-linejoin': 'round' }));
  return g;
}

/* a lidded jar in celadon or tea-brown glaze, between the bottles */
function shelfJar(item) {
  const g = S('g', { transform: placed(item) });
  const body = 'M-4.6,0 L4.6,0 Q7.2,-5.8 5.2,-10.6 Q3.6,-12.6 0,-12.6 Q-3.6,-12.6 -5.2,-10.6 Q-7.2,-5.8 -4.6,0 Z';
  g.appendChild(wash(body, item.color, { alpha: .95, edge: .3, edgeWidth: .8 }));
  g.appendChild(S('ellipse', { cx: 0, cy: -12.8, rx: 3.8, ry: 1.1, fill: deepen(item.color, .2) }));
  g.appendChild(S('rect', { x: -.9, y: -14.8, width: 1.8, height: 2, rx: .7, fill: deepen(item.color, .3) }));
  g.appendChild(pen(arc(0, -6, 4.4, 4.4, Math.PI * .95, Math.PI * 1.3, 6), .7, { color: GOUACHE, alpha: .5 }));
  g.appendChild(S('path', { d: body, fill: 'none', stroke: INK, 'stroke-width': .5, 'stroke-opacity': .55 }));
  return g;
}

/* What stands on a shelf: little groups of two or three with room between
   them, and now and then a jar. The run is laid out from a fixed point far
   to the left, so a wider window shows more of the same bar rather than a
   different one. Nothing stands where the lantern hangs, or on the lower
   shelf right behind the tall things on the counter. */
const clearOnShelf = [
  (x) => Math.abs(x - 180) > 26,
  (x) => Math.abs(x - 30) > 13 && Math.abs(x - 334) > 9 && Math.abs(x - 160) > 12 && Math.abs(x - 190) > 11
];
function shelfItems(row, x0, x1) {
  const r = seeded('shelf' + row);
  const y = SHELVES[row];
  const clear = clearOnShelf[row];
  const items = [];
  const keep = (item) => { if (item.x > x0 - 12 && item.x < x1 + 12 && clear(item.x)) items.push(item); };
  let x = -1600;
  while (x < x1 + 12) {
    if (r() < .14) {
      const scale = .9 + r() * .2;
      keep({ jar: true, x: x + 6 * scale, y, scale, color: r() < .5 ? '#A9B79E' : '#8B6B4C' });
      x += 12 * scale + 16 + r() * 20;
      continue;
    }
    const n = 2 + Math.floor(r() * 2);
    for (let i = 0; i < n; i++) {
      const kind = BOTTLE_KINDS[Math.floor(r() * BOTTLE_KINDS.length)];
      const scale = .9 + r() * .22;
      const w = BOTTLES[kind].w * scale;
      keep({ kind, scale, x: x + w / 2, y, color: SPIRITS[Math.floor(r() * SPIRITS.length)], label: r() < .75, gold: r() < .4 });
      x += w + 1.6;
    }
    x += 16 + r() * 20;
  }
  return items;
}

/* Floating hinoki shelves from one edge of the window to the other, lit
   along the back so the bottles stand against a warm glow. */
function backBar(defs, x0, x1) {
  const g = S('g');
  const glow = inkId('shelfglow');
  defs.appendChild(S('linearGradient', { id: glow, x1: 0, y1: 0, x2: 0, y2: 1 }, [
    S('stop', { offset: 0, 'stop-color': '#FBE3B4', 'stop-opacity': 0 }),
    S('stop', { offset: 1, 'stop-color': '#FBE3B4', 'stop-opacity': .85 })
  ]));
  const shade = inkId('shelfshade');
  defs.appendChild(S('linearGradient', { id: shade, x1: 0, y1: 0, x2: 0, y2: 1 }, [
    S('stop', { offset: 0, 'stop-color': '#5A4630', 'stop-opacity': .16 }),
    S('stop', { offset: 1, 'stop-color': '#5A4630', 'stop-opacity': 0 })
  ]));
  SHELVES.forEach((y, row) => {
    g.appendChild(S('rect', { x: x0, y: y - 26, width: x1 - x0, height: 26, fill: 'url(#' + glow + ')', class: 'shelf-glow' }));
    /* each shelf is painted from the top down: its plank, then what
       stands on it from left to right */
    shelfItems(row, x0, x1).forEach((item, i) => g.appendChild(paintAs(item.jar ? shelfJar(item) : shelfBottle(item), 'shelves', row * 1000 + 1 + i)));
    /* the plank edge-on, and its shadow on the wall */
    g.appendChild(paintAs(S('g', {}, [
      S('rect', { x: x0, y: y + 3.4, width: x1 - x0, height: 5, fill: 'url(#' + shade + ')' }),
      wash(poly([[x0, y], [x1, y], [x1, y + 3.4], [x0, y + 3.4]]), '#D3B48A', { alpha: 1, edge: 0 }),
      pen(line([x0, y + .5], [x1, y + .5], 2), .6, { color: GOUACHE, alpha: .6, straight: true }),
      pen(line([x0, y + 3.4], [x1, y + 3.4], 2), .45, { alpha: .45, straight: true })
    ]), 'shelves', row * 1000));
  });
  return g;
}

/* ---------- on the counter ---------- */

/* A cobbler shaker, the one Japanese bartenders use: a body that widens
   to the shoulder, a strainer cone, a small cap. Drawn standing on 0,0. */
function shaker() {
  const g = S('g');
  const outline = 'M-3.3,0 L3.3,0 L4.6,-14.6 L4.6,-15.8 C4.2,-18 2.9,-19.6 2.2,-20.4 L2.2,-21.2 ' +
    'C2.2,-23.4 1.4,-24.6 0,-24.6 C-1.4,-24.6 -2.2,-23.4 -2.2,-21.2 L-2.2,-20.4 C-2.9,-19.6 -4.2,-18 -4.6,-15.8 L-4.6,-14.6 Z';
  g.appendChild(wash(outline, '#C6C9C5', { alpha: .97, edge: .3, edgeWidth: .8, edgeAlpha: .8 }));
  /* the seams where the cone and the cap sit */
  g.appendChild(pen([[-4.6, -14.8], [4.6, -14.8]], .5, { alpha: .5, straight: true }));
  g.appendChild(pen([[-2.2, -20.6], [2.2, -20.6]], .45, { alpha: .5, straight: true }));
  g.appendChild(brush(line([-1.5, -2], [-2.4, -13.6], 4), 1.1, { color: GOUACHE, alpha: .85, taper: .3, even: true }));
  g.appendChild(brush(line([-1.6, -16.4], [-.9, -19.4], 3), .7, { color: GOUACHE, alpha: .7, taper: .3, even: true }));
  g.appendChild(S('path', { d: outline, fill: 'none', stroke: INK, 'stroke-width': .7, 'stroke-opacity': .8, 'stroke-linejoin': 'round' }));
  return g;
}

/* a bottle of red, standing about its middle */
function wineBottle() {
  const g = S('g');
  const shape = 'M-3.3,8 L3.3,8 L3.3,-2.5 Q3.3,-5.6 1.3,-7.2 L1.3,-12 L-1.3,-12 L-1.3,-7.2 Q-3.3,-5.6 -3.3,-2.5 Z';
  g.appendChild(wash(shape, '#3E5A43', { alpha: .95, edge: .3, edgeWidth: .7 }));
  g.appendChild(S('rect', { x: -2.6, y: -1, width: 5.2, height: 5, fill: LABEL, stroke: INK, 'stroke-width': .35, 'stroke-opacity': .6 }));
  g.appendChild(S('rect', { x: -1.5, y: -13, width: 3, height: 3.4, fill: '#7B2B22' }));
  g.appendChild(brush(line([-1.9, 6], [-1.9, -3], 3), .7, { color: GOUACHE, alpha: .6, taper: .3, even: true }));
  g.appendChild(S('path', { d: shape, fill: 'none', stroke: INK, 'stroke-width': .6, 'stroke-opacity': .8 }));
  return g;
}

/* a cut-glass mixing glass, half full and stirred, the spoon leaning out of it */
function mixingGlass(rand) {
  const g = S('g');
  const body = 'M-12.4,0 Q-13,0 -13,-1.6 L-13.8,-28 L13.8,-28 L13,-1.6 Q13,0 12.4,0 Z';
  g.appendChild(S('path', { d: body, fill: GLASS_TINT, 'fill-opacity': .35 }));
  const liquid = 'M-11.6,-2 L-12.3,-17 L12.3,-17 L11.6,-2 Z';
  g.appendChild(wash(liquid, '#B4823F', { alpha: .82, edge: .3, edgeWidth: 1.2, edgeAlpha: .4 }));
  g.appendChild(S('ellipse', { cx: 0, cy: -17, rx: 12.3, ry: 2.2, fill: lighten('#B4823F', .4), 'fill-opacity': .8 }));
  /* the diamond cut, low on the glass */
  for (let i = -4; i <= 4; i++) {
    g.appendChild(pen([[i * 3.2 - 5, -2], [i * 3.2 + 5, -14]], .45, { color: GOUACHE, alpha: .4, straight: true }));
    g.appendChild(pen([[i * 3.2 + 5, -2], [i * 3.2 - 5, -14]], .45, { color: INK, alpha: .12, straight: true }));
  }
  g.appendChild(S('path', { d: body, fill: 'none', stroke: INK, 'stroke-width': .8, 'stroke-opacity': .75, 'stroke-linejoin': 'round' }));
  g.appendChild(S('ellipse', { cx: 0, cy: -28, rx: 13.8, ry: 2.6, fill: 'none', stroke: INK, 'stroke-width': .7, 'stroke-opacity': .7 }));
  g.appendChild(brush(line([-10.5, -4], [-11.2, -25], 5), 1.6, { color: GOUACHE, alpha: .7, taper: .3, even: true }));
  return g;
}

/* a bar spoon, twisted along its length, drawn from where it rests on the rim */
function barSpoon() {
  const g = S('g');
  const tip = [9, -46];
  g.appendChild(pen([[-5, 16], tip], 1, { color: '#8E9391', alpha: 1, straight: true }));
  for (let i = 1; i < 14; i++) {
    const u = i / 14;
    const x = -5 + (tip[0] + 5) * u, y = 16 + (tip[1] - 16) * u;
    g.appendChild(pen([[x - 1, y + .4], [x + 1, y - .4]], .45, { color: INK, alpha: .45, straight: true }));
  }
  g.appendChild(wash(smooth(arc(tip[0] + .8, tip[1] - 2.2, 1.6, 2.6, 0, Math.PI * 2, 10), true), '#A7ACAA', { alpha: 1, edge: .4, edgeWidth: .6 }));
  return g;
}

/* a Japanese jigger: two cones point to point */
function jigger() {
  const d = 'M-4.6,-17 L4.6,-17 L1.2,-8.6 L4.2,0 L-4.2,0 L-1.2,-8.6 Z';
  return S('g', {}, [
    wash(d, '#C6C9C5', { alpha: .97, edge: .3, edgeWidth: .7 }),
    S('ellipse', { cx: 0, cy: -17, rx: 4.6, ry: 1, fill: '#9EA3A1' }),
    pen([[-2.6, -15], [-.9, -9.6]], .7, { color: GOUACHE, alpha: .7, straight: true }),
    S('path', { d, fill: 'none', stroke: INK, 'stroke-width': .6, 'stroke-opacity': .75 })
  ]);
}

/* What's on the bar, left to right, the stretch of it each one's button
   covers, and the words a screen reader says for it. */
const PIECES = [
  { id: 'juggle', x0: 82, x1: 124, label: 'piece_juggle' },
  { id: 'stir', x0: 136, x1: 170, label: 'piece_stir' },
  { id: 'shake', x0: 176, x1: 204, label: 'piece_shake' },
  { id: 'chip', x0: 232, x1: 300, label: 'piece_chip' }
];

/* each piece as a group: what's always there (.still), and what only
   appears while it performs (.act) */
function drawPieces(rand) {
  const piece = (id, still, act) => {
    const g = S('g', { class: 'piece piece-' + id });
    if (still) g.appendChild(S('g', { class: 'still' }, still));
    if (act) g.appendChild(S('g', { class: 'act' }, act));
    return g;
  };

  /* three wine bottles, and the same three going round in the air */
  /* the painter's order along the counter: the shaker, the mixing glass and
     its spoon, the wine bottles from the right, then (past the vase) the
     jigger, the tee and its ball, and the coupe */
  const standing = [92, 103, 114].map((x, i) => paintAs(S('g', { transform: 'translate(' + x + ' ' + (BAR_TOP - 14) + ') scale(1.75)' }, [wineBottle()]), 'counter', 6 - i));
  const loop = S('g', { transform: 'translate(103 64)' });
  for (let i = 0; i < 3; i++) {
    const b = S('g', { class: 'moves bottle' }, [S('g', { transform: 'scale(1.4)' }, [wineBottle()])]);
    b.style.animationDelay = (-i * 1.3 / 3).toFixed(2) + 's';
    loop.appendChild(b);
  }

  /* a ball teed up beside a coupe, which is a Sidecar */
  const coupe = paintAs(drawDrink(drinkById('sidecar'), {}, 'static'), 'counter', 11);
  [['x', 266], ['y', BAR_TOP - 41], ['width', 32], ['height', 45.3]].forEach(([k, v]) => coupe.setAttribute(k, v));

  return [
    piece('juggle', standing, [loop]),
    piece('stir', [
      paintAs(S('g', { transform: 'translate(152 ' + BAR_TOP + ')' }, [mixingGlass(rand)]), 'counter', 2),
      paintAs(moving(152, BAR_TOP - 22, 'spoon', [barSpoon()]), 'counter', 3)
    ]),
    piece('shake', [paintAs(moving(190, BAR_TOP, 'shake-body', [S('g', { transform: 'scale(1.85)' }, [shaker()])]), 'counter', 1)]),
    piece('chip', [
      paintAs(S('g', { transform: 'translate(216 ' + BAR_TOP + ')' }, [jigger()]), 'counter', 8),
      coupe,
      paintAs(pen([[244, BAR_TOP], [244, BAR_TOP - 3.6]], 1.1, { color: '#C7A26A', alpha: 1, straight: true }), 'counter', 9),
      paintAs(moving(244, BAR_TOP - 6, 'chip-ball', [S('circle', { cx: 0, cy: 0, r: 2.6, fill: GOUACHE, stroke: INK, 'stroke-width': .6, 'stroke-opacity': .8 })]), 'counter', 10)
    ])
  ];
}

/* how long a piece keeps going, so a short turn never cuts a long one off */
const pieceUntil = {};
const pieceTimers = {};
function perform(id, ms) {
  if (prefersStill()) return;
  const el = $('#scene .piece-' + id);
  if (!el) return;
  pieceUntil[id] = Math.max(pieceUntil[id] || 0, Date.now() + ms);
  el.classList.add('acting');
  clearTimeout(pieceTimers[id]);
  pieceTimers[id] = setTimeout(() => el.classList.remove('acting'), pieceUntil[id] - Date.now());
}

/* an order lands and the shaker goes for a few seconds */
const stirTheBar = () => perform('shake', 3000);

/* ---------- painted in ---------- */

/* On arrival the bar is painted onto the page the way a painter works: a
   part at a time, and each part outlined in ink, then washed with colour,
   then finished with its fine lines and highlights before the hand moves
   on. The counter comes first: the long line of its front edge, then what
   stands on it, the shaker before anything; then the shelves behind, each
   plank and then its bottles; then the lantern, which is lit last; then
   the seal. A tap, a key or a scroll finishes it at once.

   Each thing in the drawing says which part it belongs to and where it
   comes in that part's order (paintAs). What each of its marks is, an ink
   line, a wash, a highlight, is read from how it's drawn (markOf), so a
   drawing needn't be written with the painting in mind. */

/* How long each part's ink, washes and finishing take, in seconds. A part
   with more in it gets a little longer for each thing, up to `most`; past
   that it's drawn faster, and then a quick hand starts the next thing
   before the last is done, the way it runs along a shelf. */
const PAINT_PARTS = [
  { part: 'counter', ink: 3.3, wash: 1.7, finish: .6 },
  { part: 'shelves', ink: 1.6, each: .015, most: 2.6, wash: 1.6, finish: .5 },
  { part: 'lantern', ink: .8, wash: .5, finish: .3 }
];
const PAINT_FROM = .5;          /* a moment of bare paper first */
const INK_SPEED = 150;          /* an unhurried hand, in units of the stage a second */
const PAINT_SKIP = ['pointerdown', 'keydown', 'wheel', 'touchstart'];
const PAINTED = 'path, rect, circle, ellipse';
const UNPAINTED = 'defs, clipPath, mask, pattern, .act';
const HIGHLIGHT = [GOUACHE, PAPER_WASH];     /* white, put on last */
const PAPER = [LABEL, '#F3EDE1'];             /* labels: the wash goes round them */
const INKS = [INK, '#3B3530'];

const filled = (s) => (s.getAttribute('fill') || '').toLowerCase() !== 'none';

/* how far the hand travels along a mark, in units of the stage: a stroke
   of the brush is about half the way round its outline */
function reach(s, k, half) {
  let len = 0;
  try { len = s.getTotalLength(); } catch (e) { /* measured from its box below */ }
  if (!len) { const b = s.getBBox(); len = 2 * (b.width + b.height); }
  return len * k * (half ? .5 : 1);
}

/* What a mark is, from how it's drawn: an ink line, a stroke of the brush
   in ink, a dab of ink, a wash, the ring a wash dries to, a label left as
   paper, a fine line, a highlight, or the lantern's light. k is how big
   the mark is drawn against the stage. */
function markOf(s, k) {
  const attr = (a) => (s.getAttribute(a) || '').toUpperCase();
  const num = (a) => { const v = parseFloat(s.getAttribute(a)); return isNaN(v) ? 1 : v; };
  if (/lantern-light/.test(s.getAttribute('class') || '')) return 'light';
  const fill = attr('fill'), stroke = attr('stroke');
  const stroked = stroke !== '' && stroke !== 'NONE';
  if (fill === 'NONE') {
    if (!stroked) return null;
    if (HIGHLIGHT.includes(stroke)) return 'shine';
    const body = s.previousElementSibling;
    if (body && s.getAttribute('d') && body.getAttribute('d') === s.getAttribute('d') && filled(body)) return 'ring';
    if (num('stroke-opacity') < .3 || num('stroke-width') * k < .4 || reach(s, k) < 4) return 'fine';
    return 'line';
  }
  if (stroked && !HIGHLIGHT.includes(stroke)) return 'line';
  if (HIGHLIGHT.includes(fill)) return 'shine';
  if (PAPER.includes(fill)) return 'paper';
  if (INKS.includes(fill) && num('fill-opacity') >= .3) return s.tagName === 'path' ? 'stroke' : 'dab';
  return 'wash';
}

/* which way a stroke of the brush was pulled: from the end its outline
   starts at, along its longer side */
function pulled(s) {
  const b = s.getBBox();
  const m = /M\s*(-?[\d.]+)[\s,]+(-?[\d.]+)/.exec(s.getAttribute('d') || '');
  if (b.width >= b.height) return !m || +m[1] - b.x <= b.x + b.width - +m[1] ? 'r' : 'l';
  return !m || +m[2] - b.y <= b.y + b.height - +m[2] ? 'd' : 'u';
}

/* a wash laid along with a wide brush rather than dropped in */
const longWash = (s, k) => { const b = s.getBBox(); return b.width * k > 60 && b.width > b.height * 4; };

function paintIn(box, svg) {
  const view = svg.getScreenCTM();
  if (!view || !box.clientWidth) return;
  const unit = Math.hypot(view.a, view.b);

  /* the hand's timetable: when each mark starts (--d) and how long it takes (--len) */
  const timed = new Set();
  const put = (s, how, at, len) => {
    how.split(' ').forEach((c) => s.classList.add(c));
    if (how.includes('paint-line')) s.setAttribute('pathLength', 1);
    s.style.setProperty('--d', at.toFixed(2) + 's');
    s.style.setProperty('--len', len.toFixed(2) + 's');
    timed.add(s);
    return at + len;
  };

  /* what's in each part, in order, and every mark of every thing */
  const parts = {};
  svg.querySelectorAll('[data-part]').forEach((o) => {
    const part = o.getAttribute('data-part');
    (parts[part] = parts[part] || []).push(o);
  });
  const marks = new Map();
  const marksOf = (o) => {
    if (!marks.has(o)) {
      const shapes = o.matches(PAINTED) ? [o] : Array.from(o.querySelectorAll(PAINTED));
      marks.set(o, shapes.filter((s) => !s.closest(UNPAINTED)).map((s) => {
        const m = s.getScreenCTM();
        const k = m ? Math.hypot(m.a, m.b) / unit : 1;
        const kind = markOf(s, k);
        return { s, k, kind, long: kind === 'wash' && longWash(s, k) };
      }).filter((m) => m.kind));
    }
    return marks.get(o);
  };

  /* The ink: each thing's outlines one after another, the longest first,
     so its contour goes down before what's inside it, and its dark dabs
     last; then on to the next thing. */
  function ink(list, from, time) {
    const plans = list.map((o) => {
      const steps = [];
      let t = 0;
      marksOf(o).filter((m) => m.kind === 'line' || m.kind === 'stroke')
        .map((m) => [m, reach(m.s, m.k, m.kind === 'stroke')])
        .sort((a, b) => b[1] - a[1])
        .forEach(([m, far]) => {
          const len = Math.min(.9, Math.max(.1, far / INK_SPEED));
          steps.push([m, t, len]);
          t += len + .05;
        });
      marksOf(o).forEach((m) => {
        if (m.kind !== 'dab') return;
        steps.push([m, Math.max(0, t - .1), .2]);
        t += .05;
      });
      return { steps, len: t };
    });
    const GAP = .12;
    const whole = plans.reduce((sum, p) => sum + p.len + GAP, 0);
    const pace = Math.min(1.2, Math.max(.3, time / whole));
    const tail = plans.length ? plans[plans.length - 1].len * pace : 0;
    const spread = whole * pace > time ? Math.max(.08, (time - tail) / (whole * pace - tail)) : 1;
    let t = from, end = from;
    plans.forEach((p) => {
      p.steps.forEach(([m, at, len]) => {
        const how = m.kind === 'line' ? 'paint-line' + (filled(m.s) ? ' paint-filled' : '')
          : m.kind === 'dab' || m.s.hasAttribute('clip-path') ? 'paint-fade' : 'paint-wipe-' + pulled(m.s);
        end = Math.max(end, put(m.s, how, t + at * pace, len * pace));
      });
      t += (p.len + GAP) * pace * spread;
    });
    return end;
  }

  /* The colour: the long washes first, laid along one after another with a
     wide brush, then each thing's own, a thing at a time, spreading from
     where the brush touched. The ring a wash dries to comes up after it,
     and a label is left as paper. */
  function washes(list, from, time) {
    let lead = 0, end = from;
    list.forEach((o) => marksOf(o).forEach((m) => {
      if (!m.long) return;
      end = Math.max(end, put(m.s, 'paint-wipe-r', from + lead, Math.min(1.2, Math.max(.5, m.s.getBBox().width * m.k / 320))));
      lead += .15;
    }));
    const coloured = list.filter((o) => marksOf(o).some((m) => m.kind === 'wash' && !m.long));
    const step = Math.min(.14, Math.max(.015, (time - 1.1) / Math.max(1, coloured.length)));
    let t = from + Math.min(lead, .3), n = 0;
    coloured.forEach((o) => {
      const when = new Map();
      /* a thing's own washes go on within a third of a second of each other */
      const inner = Math.min(.05, .3 / marksOf(o).filter((m) => m.kind === 'wash' && !m.long).length);
      let i = 0;
      marksOf(o).forEach((m) => {
        if (m.kind === 'wash' && !m.long) {
          const at = t + i++ * inner;
          when.set(m.s, at);
          end = Math.max(end, put(m.s, m.s.hasAttribute('clip-path') ? 'paint-fade' : 'paint-bleed' + (n++ % 2 ? ' paint-bleed-b' : ''), at, .8));
        } else if (m.kind === 'ring') {
          const body = m.s.previousElementSibling;
          end = Math.max(end, put(m.s, 'paint-fade', (when.has(body) ? when.get(body) : t) + .35, .6));
        } else if (m.kind === 'paper') end = Math.max(end, put(m.s, 'paint-fade', t, .4));
      });
      t += step;
    });
    return end;
  }

  /* The finish: fine lines and highlights, quickly, thing by thing. */
  function finish(list, from, time) {
    const all = [];
    list.forEach((o) => marksOf(o).forEach((m) => { if (m.kind === 'fine' || m.kind === 'shine') all.push(m); }));
    const step = Math.min(.03, (time - .4) / Math.max(1, all.length));
    let end = from;
    all.forEach((m, i) => {
      const line = !filled(m.s);
      end = Math.max(end, put(m.s, line ? 'paint-line' : m.s.hasAttribute('clip-path') ? 'paint-fade' : 'paint-wipe-' + pulled(m.s),
        from + i * step, line ? Math.min(.6, Math.max(.08, reach(m.s, m.k) / 300)) : .3));
    });
    return end;
  }

  let t = PAINT_FROM, menuAt = 0;
  PAINT_PARTS.forEach((p) => {
    const list = (parts[p.part] || []).sort((a, b) => a.getAttribute('data-order') - b.getAttribute('data-order'));
    t = ink(list, t, Math.min(p.most || p.ink, p.ink + (p.each || 0) * list.length));
    t = washes(list, t - .1, p.wash);
    t = finish(list, t - .3, p.finish);
    if (p.part === 'counter') menuAt = t;
  });

  /* the lantern is lit, then its light reaches the room and the shelves */
  const lit = t + .1;
  svg.querySelectorAll('.lantern-light').forEach((s) => put(s, 'paint-fade', lit, .8));
  svg.querySelectorAll('.lantern-glow').forEach((s) => put(s, 'paint-fade', lit + .25, 1.3));
  svg.querySelectorAll('.shelf-glow').forEach((s) => put(s, 'paint-fade', lit + .4, 1.3));
  /* anything the timetable missed comes up with the light, never before */
  svg.querySelectorAll(PAINTED).forEach((s) => {
    if (!timed.has(s) && !s.closest(UNPAINTED + ', .bar-seal')) put(s, 'paint-fade', lit, 1);
  });
  const sealAt = lit + 1.1;
  svg.style.setProperty('--seal-at', sealAt.toFixed(2) + 's');
  /* the menu comes in under the bar once the counter is painted */
  document.documentElement.style.setProperty('--menu-at', menuAt.toFixed(2) + 's');
  box.classList.add('painting');
  document.documentElement.classList.add('painting-page');

  let done = false;
  const end = () => {
    if (done) return;
    done = true;
    box.classList.remove('painting');
    document.documentElement.classList.remove('painting-page');
    document.documentElement.style.removeProperty('--menu-at');
    PAINT_SKIP.forEach((type) => window.removeEventListener(type, end));
  };
  PAINT_SKIP.forEach((type) => window.addEventListener(type, end, { passive: true }));
  setTimeout(end, (sealAt + .6) * 1000);
}

/* ---------- the scene ---------- */

const STAGE_W = 340;
/* pixels to a unit of the stage */
function stageUnit() {
  const main = $('main');
  const cs = getComputedStyle(main);
  const content = main.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  return Math.min(content, window.innerWidth >= 760 ? 800 : 560) / STAGE_W;
}

/* the width the bar was last drawn at, so a resize only redraws it when it has to */
let sceneWidth = 0;

/* paint: draw it in, the way it arrives on a fresh visit */
function renderScene(paint = false) {
  const box = $('#scene');
  sceneWidth = box.clientWidth;
  const span = Math.max(sceneWidth / stageUnit(), STAGE_W);
  const x0 = 180 - span / 2, x1 = 180 + span / 2;
  const rand = seeded('bar');
  const svg = S('svg', { viewBox: [x0, -2, span, 176].map((n) => fx(n)).join(' '), 'aria-hidden': 'true', focusable: 'false' });
  const defs = S('defs');
  const glow = inkId('room');
  /* the lantern's pool of light, round whatever the width */
  defs.appendChild(S('radialGradient', { id: glow, gradientUnits: 'userSpaceOnUse', cx: 180, cy: 40, r: 210 }, [
    S('stop', { offset: 0, 'stop-color': '#F2C98C', 'stop-opacity': .5 }),
    S('stop', { offset: .55, 'stop-color': '#EBC48E', 'stop-opacity': .14 }),
    S('stop', { offset: 1, 'stop-color': '#EBC48E', 'stop-opacity': 0 })
  ]));
  svg.appendChild(defs);

  svg.appendChild(backBar(defs, x0 - 2, x1 + 2));
  svg.appendChild(S('rect', { x: x0, y: -2, width: span, height: COUNTER_Y + 2, fill: 'url(#' + glow + ')', class: 'lantern-glow' }));
  svg.appendChild(lantern(rand));
  svg.appendChild(counter(rand, x0 - 2, x1 + 2));
  drawPieces(rand).forEach((g) => svg.appendChild(g));
  /* the house seal on the front of the bar, the way a painter signs */
  svg.appendChild(S('g', { transform: 'translate(322 151.5)' }, [S('g', { class: 'bar-seal' }, [houseSeal(17)])]));

  box.innerHTML = '';
  box.appendChild(svg);

  /* a real button over each piece: a phone won't reliably tap an SVG shape */
  const taps = el('div', 'piece-taps');
  PIECES.forEach((p) => {
    const b = el('button', 'piece-tap');
    b.type = 'button';
    b.style.left = ((p.x0 - x0) / span * 100).toFixed(3) + '%';
    b.style.width = ((p.x1 - p.x0) / span * 100).toFixed(3) + '%';
    b.setAttribute('aria-label', U(p.label));
    b.addEventListener('click', () => perform(p.id, 10000));
    taps.appendChild(b);
  });
  box.appendChild(taps);
  if (paint && !prefersStill()) paintIn(box, svg);
}

/* a turned phone or a resized window gets the bar redrawn to its new width */
function fitScene() {
  const box = $('#scene');
  if (box.clientWidth && box.clientWidth !== sceneWidth) renderScene();
}

/* ================================================================
   THE MENU — filters, sections, and a line for every drink
   ================================================================ */

/* a section id, or 'all' — nothing chosen means everything. The sections
   always run in the card's order, spirit-forward first (SECTIONS). */
let showing = 'all';

function phaseNow(now = new Date()) {
  const h = now.getHours();
  if (h >= 2 && h < 5) return 'lastcall';
  if (h >= 5 && h < 17) return 'day';
  if (h >= 17 && h < 23) return 'evening';
  return 'late';
}

/* the room's light changes with the hour; nothing announces it */
function applyPhase() {
  document.documentElement.dataset.phase = phaseNow();
}

const listed = (sec) => drinks().filter((d) => d.section === sec && !d.hidden);

/* ---------- filters ---------- */

function renderFilters() {
  const bar = $('#filters');
  bar.innerHTML = '';
  bar.setAttribute('aria-label', U('filters_label'));
  SECTIONS.forEach((sec) => {
    if (!listed(sec).length) return;
    const b = el('button', 'filter');
    b.type = 'button';
    b.appendChild(el('span', null, U('sec_' + sec)));
    b.setAttribute('aria-pressed', String(showing === sec));
    b.addEventListener('click', () => {
      /* tapping the live one lets it go, back to everything */
      showing = showing === sec ? 'all' : sec;
      renderFilters();
      renderMenu();
      const top = $('#filters').getBoundingClientRect().top + window.scrollY - 70;
      if (window.scrollY > top) window.scrollTo({ top, behavior: 'smooth' });
    });
    bar.appendChild(b);
  });
  paintFilterFade();
}

/* fade the right edge only while there is genuinely more to swipe to */
function paintFilterFade() {
  const bar = $('#filters');
  bar.classList.toggle('more', bar.scrollWidth > bar.clientWidth + 2 && bar.scrollLeft + bar.clientWidth < bar.scrollWidth - 2);
}

/* ---------- a drink, as the menu lists it ---------- */

/* what's particular about it, as a line of small print */
function notesFor(drink) {
  const out = [];
  if (drink.smoke) {
    out.push({ cls: 'smoke', icon: 'smoke', text: drink.best ? U('chip_smoke_best') : U('chip_smoke') + woodLabel(drink.woods[0]).toLowerCase() });
  }
  if (drink.low) out.push({ cls: 'low', icon: 'low', text: U('chip_low') });
  if (drink.na && !drink.warning) out.push({ cls: 'na', icon: 'none', text: U('chip_na') });
  if (drink.warning) out.push({ cls: 'warn', icon: 'warn', text: U('chip_warn') });
  if (drink.egg) out.push({ cls: 'egg', icon: 'egg', text: U('chip_egg_opt') });
  if (drink.zero) out.push({ cls: 'zero', icon: 'leaf', text: U('chip_zero_opt') });
  return out;
}

function notesLine(items) {
  const line = el('div', 'notes-line');
  items.forEach((n) => {
    const s = el('span', 'note ' + n.cls);
    s.appendChild(icon(n.icon));
    s.appendChild(txt(n.text));
    line.appendChild(s);
  });
  return line;
}

function entryEl(drink, index) {
  const b = el('button', 'entry');
  b.type = 'button';
  b.dataset.drink = drink.id;
  b.style.setProperty('--i', String(index));
  b.appendChild(artBox('entry-art', drink, {}, 'live'));

  const text = el('div', 'entry-text');
  const name = el('div', 'entry-name');
  name.appendChild(el('span', null, drink.name));
  text.appendChild(name);
  text.appendChild(el('div', 'caps', profileWords(drink)));
  text.appendChild(el('p', 'entry-hook', drink.hook));
  const notes = notesFor(drink);
  if (notes.length) text.appendChild(notesLine(notes));
  b.appendChild(text);

  b.addEventListener('click', () => openSheet(drink));
  return b;
}

function renderMenu() {
  const body = $('#menu-body');
  body.innerHTML = '';
  let shown = 0;
  SECTIONS.forEach((sec) => {
    if (showing !== 'all' && showing !== sec) return;
    const list = listed(sec);
    if (!list.length) return;

    const section = el('section', 'section');
    section.id = 'sec-' + sec;
    const head = el('header', 'section-head');
    head.appendChild(el('h2', 'section-title', U('sec_' + sec)));
    head.appendChild(el('p', 'caps', U('sec_' + sec + '_sub')));
    head.appendChild(brushRule());
    section.appendChild(head);

    const grid = el('div', 'entries');
    list.forEach((d, i) => grid.appendChild(entryEl(d, shown + i)));
    section.appendChild(grid);
    body.appendChild(section);
    shown += list.length;
  });
  if (!shown) body.appendChild(el('p', 'no-match', U('bar_quiet_sub')));
}

/* ---------- js/08-sheet.js ---------- */
/* ================================================================
   THE CARD — one drink, opened: its story, what's in it, how it
   tastes, the choices, and the guest's name
   ================================================================ */

/* the method, in the order it's done — smoking the glass comes first,
   egg white swaps in the dry shake, zero sugar swaps the syrup */
function stepsFor(drink, opts = {}) {
  const zero = opts.zero && drink.zero;
  let base = drink.steps;
  if (opts.egg && drink.eggSteps) base = drink.eggSteps;
  else if (zero && drink.zero.steps) base = drink.zero.steps;
  let list = base.slice();
  if (zero) list = list.map((st) => st.split(drink.zero.from).join(drink.zero.to));
  if (opts.smoke) {
    const wood = opts.wood || drink.woods[0];
    /* the blend gets its own sentence — "the oak + a pinch of cinnamon chip" doesn't read */
    const blended = wood.includes('+');
    let chipName = blended ? woodLabel('Oak') : woodLabel(wood);
    if (lang === 'en') chipName = chipName.toLowerCase();
    list.unshift(U('smoke_step')(chipName, blended));
  }
  return list;
}

function stepsList(drink, opts) {
  const ol = el('ol', 'steps');
  stepsFor(drink, opts).forEach((step) => ol.appendChild(el('li', null, step)));
  return ol;
}

/* zero sugar changes exactly one ingredient, so swap that line rather
   than keeping a second copy of every recipe */
function buildList(drink, opts = {}) {
  const ul = el('ul', 'build');
  drink.build.forEach(([qty, ing]) => {
    const swapped = opts.zero && drink.zero && ing === drink.zero.from;
    const li = el('li', (swapped ? 'swapped' : '') + (qty ? '' : ' unmeasured'));
    li.appendChild(el('span', 'ing', swapped ? drink.zero.to : ing));
    li.appendChild(el('span', 'qty', swapped ? (drink.zero.qty || qty) : qty));
    ul.appendChild(li);
  });
  return ul;
}

/* five rows of ink dots */
function tastingCard(drink) {
  const card = el('div', 'tasting');
  AXES.forEach((axis) => {
    const v = drink.flavor[axis] || 0;
    const row = el('div', 'taste');
    row.appendChild(el('span', 'caps', U('axis_' + axis)));
    const dots = el('span', 'dots');
    dots.setAttribute('role', 'img');
    dots.setAttribute('aria-label', U('axis_' + axis) + ' ' + v + ' / 5');
    for (let i = 1; i <= 5; i++) dots.appendChild(el('i', i <= v ? 'on' : null));
    row.appendChild(dots);
    card.appendChild(row);
  });
  return card;
}

function field(label, ...kids) {
  const f = el('div', 'field');
  f.appendChild(el('div', 'caps', label));
  kids.forEach((k) => f.appendChild(k));
  return f;
}

function optionRow(cls, title, why) {
  const label = el('label', 'option ' + cls);
  const input = el('input');
  input.type = 'checkbox';
  label.appendChild(input);
  const box = el('span', 'box');
  box.appendChild(icon('tick'));
  label.appendChild(box);
  const text = el('span', 'option-text');
  text.appendChild(el('span', 'option-title', title));
  text.appendChild(el('span', 'option-why', why));
  label.appendChild(text);
  return { label, input };
}

const sheet = $('#sheet');

/* the card fills the dialog, so a click on the dialog itself is the backdrop */
sheet.addEventListener('click', (e) => { if (e.target === sheet) sheet.close(); });

function openSheet(drink) {
  sheet.innerHTML = '';
  const state = { smoke: !!drink.defaultSmoke, egg: false, zero: false, wood: drink.woods ? drink.woods[0] : null };

  const form = el('form', 'sheet');
  form.method = 'dialog';

  /* ---------- head: the drink, drawn and named ---------- */
  const head = el('div', 'sheet-head');
  const close = el('button', 'sheet-close');
  close.type = 'button';
  close.setAttribute('aria-label', U('close'));
  close.appendChild(icon('close'));
  close.addEventListener('click', () => sheet.close());
  head.appendChild(close);

  const preview = artBox('preview', drink, state, 'pour');
  head.appendChild(preview);
  const redraw = () => {
    preview.innerHTML = '';
    preview.appendChild(drawDrink(drink, state, 'pour'));
  };

  /* no profile words up here: the tasting card below says it better */
  const h2 = el('h2', 'sheet-title', drink.name);
  h2.id = 'sheet-title';
  head.appendChild(h2);
  head.appendChild(el('p', 'sheet-hook', drink.hook));
  form.appendChild(head);

  /* ---------- body ---------- */
  const body = el('div', 'sheet-body');

  if (drink.story) body.appendChild(field(U('the_story'), el('p', 'story', drink.story)));

  if (drink.warning) {
    const warn = el('div', 'warn-box');
    warn.appendChild(warnSeal());
    const text = el('p');
    text.appendChild(el('b', null, U('heads_up')));
    text.appendChild(txt(drink.warning));
    warn.appendChild(text);
    body.appendChild(warn);
  }

  let build = buildList(drink, state);
  const whatField = field(U('whats_in_it'), build);
  body.appendChild(whatField);
  const repaintBuild = () => {
    const next = buildList(drink, state);
    whatField.replaceChild(next, build);
    build = next;
  };

  body.appendChild(field(U('tastes_like'), tastingCard(drink)));

  if (drink.smoke) {
    const block = el('div');
    const smoke = optionRow('smoke', U('smoke_it'), drink.smokeNote);
    smoke.input.checked = state.smoke;
    block.appendChild(smoke.label);

    const woods = el('div', 'woods');
    woods.hidden = !state.smoke;
    woods.appendChild(el('div', 'caps', U('wood')));
    const row = el('div', 'wood-row');
    const note = el('p', 'wood-note', woodNote(state.wood));
    drink.woods.forEach((w) => {
      const b = el('button', 'wood');
      b.type = 'button';
      b.dataset.wood = w;
      b.appendChild(el('span', null, woodLabel(w)));
      b.setAttribute('aria-pressed', String(w === state.wood));
      b.addEventListener('click', () => {
        state.wood = w;
        $$('.wood', row).forEach((c) => c.setAttribute('aria-pressed', String(c.dataset.wood === w)));
        note.replaceChildren(txt(woodNote(w)));
      });
      row.appendChild(b);
    });
    woods.appendChild(row);
    woods.appendChild(note);
    block.appendChild(woods);

    smoke.input.addEventListener('change', () => {
      state.smoke = smoke.input.checked;
      woods.hidden = !state.smoke;
      redraw();
    });
    body.appendChild(block);
  } else {
    const no = el('p', 'no-smoke');
    no.appendChild(el('b', null, U('no_smoke_here')));
    no.appendChild(txt(drink.noSmoke));
    body.appendChild(no);
  }

  if (drink.egg) {
    const egg = optionRow('egg', U('egg_white'), U('egg_why'));
    egg.input.addEventListener('change', () => { state.egg = egg.input.checked; redraw(); });
    body.appendChild(egg.label);
  }

  if (drink.zero) {
    const zero = optionRow('zero', U('zero_sugar'), drink.zero.note);
    zero.input.addEventListener('change', () => { state.zero = zero.input.checked; repaintBuild(); });
    body.appendChild(zero.label);
  }

  const nameInput = el('input', 'write');
  nameInput.type = 'text';
  nameInput.placeholder = U('name_ph');
  nameInput.value = guestName();
  nameInput.maxLength = 40;
  nameInput.autocomplete = 'given-name';
  body.appendChild(field(U('your_name'), nameInput));

  const noteInput = el('textarea', 'write');
  noteInput.placeholder = U('note_ph');
  noteInput.maxLength = 200;
  noteInput.rows = 2;
  body.appendChild(field(U('anything_else'), noteInput));

  form.appendChild(body);

  /* ---------- foot ---------- */
  const foot = el('div', 'sheet-foot');
  const send = el('button', 'btn', U('send'));
  send.type = 'submit';
  foot.appendChild(send);
  form.appendChild(foot);

  nameInput.addEventListener('input', () => nameInput.classList.remove('wanting'));
  form.addEventListener('submit', (ev) => {
    ev.preventDefault();
    const who = nameInput.value.trim();
    if (!who) {
      nameInput.classList.add('wanting');
      nameInput.placeholder = U('name_ph_err');
      nameInput.focus();
      return;
    }
    rememberGuest(who);
    Book.add({
      id: 'o' + Date.now() + Math.random().toString(36).slice(2, 6),
      drink: drink.id,
      guest: who,
      smoke: state.smoke,
      wood: state.smoke ? state.wood : null,
      egg: state.egg,
      zero: state.zero,
      note: noteInput.value.trim(),
      at: Date.now(),
      done: false
    });
    sheet.close();
    toast(U('toast_ordered') + drink.name + U('toast_for') + who, drink, state);
    stirTheBar();
    if (state.smoke) releaseSmoke();
  });

  sheet.appendChild(form);
  sheet.showModal();
  /* showModal focuses the close button, which would open the card with a
     ring around it. A phone focuses the card itself, so no ring and no
     keyboard over the drawing; a computer goes straight to the name, or
     to Send if the name is already there. Neither scrolls the body. */
  if (window.matchMedia('(hover: none)').matches) sheet.focus({ preventScroll: true });
  else (nameInput.value ? send : nameInput).focus({ preventScroll: true });
  body.scrollTop = 0;
  requestAnimationFrame(() => { body.scrollTop = 0; });
}

/* ================================================================
   ORDERS — tickets on the rail, the build behind each one, and a
   seal pressed on every drink that's been poured
   ================================================================ */

/* which builds are open, kept outside the tickets so a redraw restores them */
const openBuilds = new Set();
/* tickets poured since the last draw, so only they get the stamp's thump */
const justPoured = new Set();
let lastOrdersKey = null;
let lastWorking = 0;

/* What the book looks like right now. The shared copy is re-read every
   few seconds, and redrawing on every read would close the build that
   somebody is halfway through reading. */
function ordersKey() {
  return lang + Book.orders.map((o) => [
    o.id, o.at, o.drink, o.guest, o.note || '', o.wood || '',
    (o.done ? 'd' : '') + (o.smoke ? 's' : '') + (o.egg ? 'e' : '') + (o.zero ? 'z' : '') + (o.pending ? 'p' : '')
  ].join('\u0001')).join('\u0002');
}

function aside(cls, label, text) {
  const a = el('div', 'aside ' + cls);
  a.appendChild(el('div', 'caps', label));
  a.appendChild(el('div', null, text));
  return a;
}

function ticketEl(order) {
  const drink = drinkById(order.drink);
  if (!drink) return null;

  const wrap = el('article', 'ticket' + (order.done ? ' done' : ''));
  const main = el('div', 'ticket-main');

  const pour = el('button', 'pour');
  pour.type = 'button';
  pour.setAttribute('role', 'checkbox');
  pour.setAttribute('aria-checked', String(!!order.done));
  pour.setAttribute('aria-label', (order.done ? U('toast_back') : U('toast_poured') + drink.name) + U('toast_for') + order.guest);
  pour.appendChild(icon('tick'));
  pour.addEventListener('click', () => {
    /* noted before the toggle, because the toggle redraws the list */
    const before = Book.find(order.id);
    if (before && !before.done) justPoured.add(order.id);
    const o = Book.toggleDone(order.id);
    if (!o) return;
    toast(o.done ? U('toast_poured') + drink.name + U('toast_for') + o.guest : U('toast_back'), drink, o);
  });
  main.appendChild(pour);
  main.appendChild(artBox('ticket-art', drink, order, 'static'));

  /* the drink, then who it's for and when they asked */
  const text = el('div', 'ticket-text');
  text.appendChild(el('div', 'ticket-drink', drink.name));
  const who = el('div', 'ticket-who');
  who.appendChild(el('span', 'ticket-guest', order.guest));
  const when = el('span', 'ticket-when', ago(order.at));
  when.dataset.at = order.at;
  who.appendChild(when);
  text.appendChild(who);

  /* how it's to be made, in small print */
  const notes = [{ cls: '', icon: 'none', text: drink.method }];
  if (order.smoke) notes.push({ cls: 'smoke', icon: 'smoke', text: U('chip_smoked') + woodLabel(order.wood || drink.woods[0]).toLowerCase() });
  if (order.egg) notes.push({ cls: 'egg', icon: 'egg', text: U('chip_egg') });
  if (order.zero) notes.push({ cls: 'zero', icon: 'leaf', text: U('chip_zero') });
  text.appendChild(notesLine(notes));
  if (order.note) text.appendChild(el('p', 'ticket-note', order.note));
  main.appendChild(text);
  wrap.appendChild(main);

  if (order.done) {
    const stamp = pouredStamp();
    if (justPoured.has(order.id)) stamp.classList.add('fresh');
    wrap.appendChild(stamp);
  }

  /* the build: what goes in, the method, and anything worth knowing */
  const panelId = 'build-' + order.id;
  const toggle = el('button', 'build-toggle');
  toggle.type = 'button';
  toggle.setAttribute('aria-expanded', String(openBuilds.has(order.id)));
  toggle.setAttribute('aria-controls', panelId);
  toggle.appendChild(icon('chevron'));
  toggle.appendChild(txt(U('the_build')));

  const panel = el('div', 'build-panel');
  panel.id = panelId;
  panel.hidden = !openBuilds.has(order.id);
  panel.appendChild(buildList(drink, order));
  panel.appendChild(stepsList(drink, order));
  if (order.zero && drink.zero) panel.appendChild(aside('zero', U('aside_zero'), drink.zero.note));
  if (order.smoke) {
    const wood = order.wood || drink.woods[0];
    panel.appendChild(aside('smoke', U('aside_smoke') + woodLabel(wood), woodNote(wood)));
  }
  if (drink.warning) panel.appendChild(aside('warn', U('aside_warn'), drink.warning));
  if (drink.tip) panel.appendChild(aside('tip', U('aside_tip'), drink.tip));

  toggle.addEventListener('click', () => {
    const open = toggle.getAttribute('aria-expanded') === 'true';
    toggle.setAttribute('aria-expanded', String(!open));
    panel.hidden = open;
    if (open) openBuilds.delete(order.id); else openBuilds.add(order.id);
  });
  wrap.appendChild(toggle);
  wrap.appendChild(panel);
  return wrap;
}

function railHead(title, action) {
  const h = el('div', 'rail-head');
  h.appendChild(el('h3', 'rail-title', title));
  if (action) h.appendChild(action);
  return h;
}

function renderOrders(isNew) {
  const key = ordersKey();
  if (key === lastOrdersKey) return;
  lastOrdersKey = key;

  const orders = Book.orders;
  const working = orders.filter((o) => !o.done);
  const poured = orders.filter((o) => o.done);

  $('#tally-working').textContent = working.length;
  $('#tally-poured').textContent = poured.length;
  const counts = [$('#pending-count'), $('#burger-count')];
  counts.forEach((n) => { n.textContent = working.length; n.hidden = !working.length; });
  if (isNew && working.length > lastWorking && $('#tab-orders').getAttribute('aria-selected') !== 'true') {
    counts.forEach((n) => { n.classList.remove('pulse'); void n.offsetWidth; n.classList.add('pulse'); });
  }
  lastWorking = working.length;

  const body = $('#orders-body');
  body.innerHTML = '';

  if (!orders.length) {
    const empty = el('div', 'empty');
    empty.appendChild(emptyGlass());
    empty.appendChild(el('div', 'empty-title', U('bar_quiet')));
    empty.appendChild(el('p', null, U('bar_quiet_sub')));
    body.appendChild(empty);
    return;
  }

  if (working.length) {
    body.appendChild(railHead(U('on_the_rail')));
    const list = el('div', 'tickets');
    working.forEach((o) => { const t = ticketEl(o); if (t) list.appendChild(t); });
    body.appendChild(list);
  }

  if (poured.length) {
    const clear = el('button', 'link-btn', U('clear'));
    clear.type = 'button';
    clear.addEventListener('click', () => Book.clearPoured());
    body.appendChild(railHead(U('poured_title'), clear));
    const list = el('div', 'tickets');
    poured.forEach((o) => { const t = ticketEl(o); if (t) list.appendChild(t); });
    body.appendChild(list);
  }
  justPoured.clear();
}

function paintSync() {
  const tag = $('#sync');
  tag.hidden = !Book.shared;
  if (!Book.shared) return;
  tag.classList.toggle('off', !Book.online);
  tag.textContent = U(Book.online ? 'sync_on' : 'sync_off');
}

/* the house notes and the wood table, folded at the foot of the orders */
function renderNotes() {
  const notes = $('#notes-body');
  notes.innerHTML = '';
  const grid = el('div', 'notes-grid');
  U('notes').forEach((n) => {
    const cell = el('div');
    cell.appendChild(el('h3', null, n.h));
    cell.appendChild(el('p', null, n.p));
    grid.appendChild(cell);
  });
  notes.appendChild(grid);

  const wrap = el('div', 'table-wrap');
  const table = el('table', 'wood-table');
  const head = el('tr');
  U('wood_table_head').forEach((h) => head.appendChild(el('th', 'caps', h)));
  table.appendChild(el('thead')).appendChild(head);
  const tbody = el('tbody');
  U('wood_table').forEach((r) => {
    const tr = el('tr');
    r.forEach((c) => tr.appendChild(el('td', null, c)));
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
  notes.appendChild(wrap);
}

/* ---------- js/10-app.js ---------- */
/* ================================================================
   THE BAR — paper, tabs, language, the drink that isn't on
   the list, and switching it all on
   ================================================================ */

/* ---------- washi ---------- */

/* Kozo paper: a tooth of fine specks and long pale fibres, with the odd
   darker one. Drawn once at boot on a canvas that tiles seamlessly — each
   fibre is also drawn shifted by a tile in every direction, so the ones
   that cross an edge come back in on the other side. */
function makeWashi() {
  const rand = seeded('washi');
  const px = 420 * Math.min(2, window.devicePixelRatio || 1);
  const k = px / 420;
  const c = document.createElement('canvas');
  c.width = c.height = px;
  const ctx = c.getContext('2d');
  if (!ctx) return;

  for (let i = 0; i < 7000; i++) {
    const light = rand() < .55;
    ctx.fillStyle = light ? 'rgba(255,253,246,' + (.18 + rand() * .3) + ')' : 'rgba(96,78,52,' + (.04 + rand() * .08) + ')';
    const s = (rand() < .9 ? .7 : 1.4) * k;
    ctx.fillRect(rand() * px, rand() * px, s, s);
  }
  ctx.lineCap = 'round';
  const fibre = (style, width) => {
    const x = rand() * px, y = rand() * px;
    const len = (24 + rand() * 90) * k;
    const a = rand() * Math.PI * 2;
    const bend = (rand() - .5) * len * .6;
    const ex = x + Math.cos(a) * len, ey = y + Math.sin(a) * len;
    const mx = (x + ex) / 2 - Math.sin(a) * bend, my = (y + ey) / 2 + Math.cos(a) * bend;
    ctx.strokeStyle = style;
    ctx.lineWidth = width * k;
    for (let dx = -px; dx <= px; dx += px) {
      for (let dy = -px; dy <= px; dy += px) {
        ctx.beginPath();
        ctx.moveTo(x + dx, y + dy);
        ctx.quadraticCurveTo(mx + dx, my + dy, ex + dx, ey + dy);
        ctx.stroke();
      }
    }
  };
  for (let i = 0; i < 64; i++) fibre('rgba(255,253,247,' + (.1 + rand() * .14) + ')', .35 + rand() * .5);
  for (let i = 0; i < 16; i++) fibre('rgba(120,98,66,' + (.04 + rand() * .05) + ')', .3 + rand() * .4);
  document.documentElement.style.setProperty('--washi', 'url(' + c.toDataURL('image/png') + ')');
}

/* ---------- small things that happen ---------- */

let toastTimer;
function toast(message, drink, opts) {
  $('#toast-text').replaceChildren(txt(message));
  const art = $('#toast-art');
  art.innerHTML = '';
  if (drink) art.appendChild(drawDrink(drink, opts || {}, 'static'));
  const t = $('#toast');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

/* smoke doesn't stay in the glass */
function releaseSmoke() {
  if (prefersStill()) return;
  const layer = el('div', 'page-smoke');
  for (let i = 0; i < 4; i++) {
    const plume = smokePlume('plume' + Date.now() + i);
    plume.style.left = (4 + i * 24 + Math.random() * 10) + '%';
    plume.style.setProperty('--drift', (Math.random() * 14 - 7) + 'vw');
    plume.style.animationDelay = (i * .25 + Math.random() * .3).toFixed(2) + 's';
    layer.appendChild(plume);
  }
  document.body.appendChild(layer);
  setTimeout(() => layer.remove(), 7000);
}

/* ---------- the drink that isn't on the list ---------- */

const SECRET = 'vieux-carre';
const secretFound = () => store.get(KEYS.found) === '1';
const openSecret = () => { const d = drinkById(SECRET); if (d) openSheet(d); };

/* once the tee has been found, the eighteenth green appears at the foot
   of the menu, and its flag is the way back */
function paintSecret() {
  const spot = $('#secret');
  spot.hidden = !secretFound();
  spot.innerHTML = '';
  if (spot.hidden) return;
  const green = el('div', 'green');
  green.appendChild(greenScene());
  const flag = el('button', 'flag-hit');
  flag.type = 'button';
  flag.setAttribute('aria-label', U('secret_line'));
  flag.addEventListener('click', openSecret);
  green.appendChild(flag);
  spot.appendChild(green);
}

function wireTee() {
  const tee = $('#tee');
  tee.appendChild(teeMark());
  tee.addEventListener('click', () => {
    if (secretFound()) { openSecret(); return; }
    store.set(KEYS.found, '1');
    paintSecret();
    $('#secret').scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
}

/* ---------- tabs and the menu button ---------- */

function showTab(which) {
  const menu = which === 'menu';
  $('#tab-menu').setAttribute('aria-selected', String(menu));
  $('#tab-orders').setAttribute('aria-selected', String(!menu));
  $('#view-menu').hidden = !menu;
  $('#view-orders').hidden = menu;
  /* the window may have changed width while the bar was out of sight */
  if (menu) fitScene();
  if (!menu) $$('.count').forEach((n) => n.classList.remove('pulse'));
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function setNav(open) {
  $('#burger').setAttribute('aria-expanded', String(open));
  $('#nav-menu').hidden = !open;
}

function wireChrome() {
  const burger = $('#burger');
  const nav = $('#nav-menu');
  burger.addEventListener('click', (e) => { e.stopPropagation(); setNav(nav.hidden); });
  document.addEventListener('click', (e) => { if (!nav.hidden && !nav.contains(e.target)) setNav(false); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !nav.hidden) setNav(false); });
  $('#tab-menu').addEventListener('click', () => { showTab('menu'); setNav(false); });
  $('#tab-orders').addEventListener('click', () => { showTab('orders'); setNav(false); });

  /* the name takes you home: the whole menu, from the top */
  $('#home').addEventListener('click', () => {
    showing = 'all';
    renderFilters();
    renderMenu();
    showTab('menu');
    setNav(false);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  $('#lang-en').addEventListener('click', () => setLang('en'));
  $('#lang-th').addEventListener('click', () => setLang('th'));

  const choice = $('#choice');
  choice.addEventListener('click', () => {
    const pool = drinks().filter((d) => !d.hidden);
    choice.classList.add('rolling');
    setTimeout(() => choice.classList.remove('rolling'), 600);
    openSheet(pool[Math.floor(Math.random() * pool.length)]);
  });

  $('#filters').addEventListener('scroll', paintFilterFade, { passive: true });
  window.addEventListener('resize', paintFilterFade);
  /* the first measure is taken before the fonts are in, and they change the widths */
  if (document.fonts) document.fonts.ready.then(paintFilterFade);

  /* the bar is drawn to the window's width; redraw it once a resize settles */
  let fitTimer;
  window.addEventListener('resize', () => {
    clearTimeout(fitTimer);
    fitTimer = setTimeout(() => { if (!$('#view-menu').hidden) fitScene(); }, 150);
  });

  /* the bar gets a hairline once the menu slides under it */
  const bar = $('.topbar');
  const paintBar = () => bar.classList.toggle('scrolled', window.scrollY > 4);
  window.addEventListener('scroll', paintBar, { passive: true });
  paintBar();
}

/* the words that aren't rebuilt by a render function */
function paintStatic() {
  document.documentElement.lang = lang;
  $('#lang-en').setAttribute('aria-pressed', String(lang === 'en'));
  $('#lang-th').setAttribute('aria-pressed', String(lang === 'th'));
  $('#tab-menu-text').textContent = U('tab_menu');
  $('#tab-orders-text').textContent = U('tab_orders');
  $('#orders-title').textContent = U('tab_orders');
  $('#tee').setAttribute('aria-label', U('tee_label'));

  const choice = $('#choice');
  choice.innerHTML = '';
  choice.appendChild(icon('die'));
  choice.appendChild(el('span', null, U('surprise')));

  $('#notes-summary').textContent = U('bar_notes');
  const summary = $('#notes-summary').parentNode;
  if (!summary.querySelector('svg')) summary.appendChild(icon('chevron'));

  const lede = $('#orders-lede');
  lede.innerHTML = '';
  lede.appendChild(txt(U('orders_lede_a')));
  lede.appendChild(el('b', null, U('orders_lede_b')));
  lede.appendChild(txt(U('orders_lede_c')));
  $('#tally-working-label').textContent = U('working');
  $('#tally-poured-label').textContent = U('poured');
}

/* ---------- switch it on ---------- */

makeWashi();

applyPhase();
setInterval(applyPhase, 60000);

paintStatic();
/* every arrival paints the bar in, however many times you come back */
renderScene(true);
wireChrome();
wireTee();
paintSecret();
renderFilters();
renderMenu();
renderOrders();
renderNotes();
paintSync();

onLang(() => {
  paintStatic();
  renderScene();
  renderFilters();
  renderMenu();
  renderOrders();
  renderNotes();
  paintSecret();
  paintSync();
});

Book.onChange((isNew) => renderOrders(isNew));
Book.onStatus(paintSync);
Book.start();

/* "3 min ago" keeps up with the clock */
setInterval(() => {
  $$('.ticket-when').forEach((n) => { n.textContent = ago(Number(n.dataset.at)); });
}, 30000);

})();
</script>
