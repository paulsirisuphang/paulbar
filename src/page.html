<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ECE6DA">
<title>Paul's Bar</title>
<link rel="icon" href="{{FAVICON}}">
<style>
{{FONTS}}
{{STYLES}}
</style>
</head>
<body>

<div class="arrival" id="arrival" aria-hidden="true"></div>

<div class="page">
  <header class="topbar">
    <h1 class="wordmark"><button class="home" id="home" type="button">Paul<span class="amp">'</span>s Bar</button><button class="tee" id="tee" type="button" aria-label="A golf tee"></button></h1>
    <div class="topbar-right">
      <div class="langs" role="group" aria-label="Language">
        <button class="lang" id="lang-en" type="button" aria-pressed="true"><span>EN</span></button>
        <span class="sep" aria-hidden="true"></span>
        <button class="lang" id="lang-th" type="button" aria-pressed="false"><span>ไทย</span></button>
      </div>
      <button class="burger" id="burger" type="button" aria-expanded="false" aria-controls="nav-menu" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
          <path class="l1" d="M4 9h16"/><path class="l2" d="M4 15h16"/>
        </svg>
        <span class="count" id="burger-count" hidden>0</span>
      </button>
      <nav class="nav-menu" id="nav-menu" role="tablist" aria-label="Sections" hidden>
        <button class="nav-item" id="tab-menu" role="tab" aria-selected="true" aria-controls="view-menu" type="button"><span id="tab-menu-text">Menu</span></button>
        <button class="nav-item" id="tab-orders" role="tab" aria-selected="false" aria-controls="view-orders" type="button"><span id="tab-orders-text">Orders</span><span class="count" id="pending-count" hidden>0</span></button>
      </nav>
    </div>
  </header>

  <main>
    <section class="view" id="view-menu" role="tabpanel" aria-labelledby="tab-menu">
      <div class="hero">
        <div class="crew" id="crew"></div>
        <button class="choice" id="choice" type="button"></button>
      </div>
      <nav class="filters" id="filters" aria-label="Show one kind of drink"></nav>
      <div id="menu-body"></div>
      <div class="secret" id="secret" hidden></div>
    </section>

    <section class="view orders" id="view-orders" role="tabpanel" aria-labelledby="tab-orders" hidden>
      <div class="orders-head">
        <h2 class="orders-title" id="orders-title">Orders</h2>
        <p class="orders-lede" id="orders-lede"></p>
        <div class="orders-meta">
          <span class="sync caps" id="sync" hidden></span>
          <div class="tally caps">
            <span><b id="tally-working">0</b><span id="tally-working-label">working</span></span>
            <span><b id="tally-poured">0</b><span id="tally-poured-label">poured</span></span>
          </div>
        </div>
      </div>
      <div id="orders-body"></div>
      <details class="notes">
        <summary class="caps"><span id="notes-summary">Bar notes</span></summary>
        <div id="notes-body"></div>
      </details>
    </section>
  </main>
</div>

<dialog id="sheet" aria-labelledby="sheet-title" tabindex="-1"></dialog>

<div class="toast" id="toast" role="status" aria-live="polite"><span class="toast-art" id="toast-art"></span><span id="toast-text"></span></div>

<script>
{{SCRIPT}}
</script>
</body>
</html>
