<meta charset="utf-8">
<title>Paul's Bar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23120E0B'/%3E%3Cpath d='M9 7h14l-1.6 18a2 2 0 0 1-2 1.8h-6.8a2 2 0 0 1-2-1.8Z' fill='%23A8321C'/%3E%3Cpath d='M9 7h14l-.5 5.5h-13Z' fill='%23D24A22'/%3E%3Cpath d='M9 7h14l-1.6 18a2 2 0 0 1-2 1.8h-6.8a2 2 0 0 1-2-1.8Z' fill='none' stroke='%23F0E6D6' stroke-opacity='.45' stroke-width='1.4'/%3E%3C/svg%3E">

<style>
@font-face {
  font-family: 'Newsreader';
  font-style: normal;
  font-weight: 400 700;
  font-display: swap;
  src: url(data:font/woff2;base64,__NEWSREADER__) format('woff2');
}
@font-face {
  font-family: 'Jakarta';
  font-style: normal;
  font-weight: 400 700;
  font-display: swap;
  src: url(data:font/woff2;base64,__JAKARTA__) format('woff2');
}

:root {
  color-scheme: dark;

  --bg:        #120E0B;
  --bg-2:      #1A1411;
  --bg-3:      #241C16;
  --line:      #2E2419;
  --line-2:    #3E3123;

  --text:      #F0E6D6;
  --text-2:    #B3A18C;
  --text-3:    #7E6E5D;

  --campari:   #D24A22;
  --campari-2: #F0663A;
  --brass:     #D2A24C;
  --smoke:     #93A3A8;
  --poured:    #8FA86B;

  /* Newsreader and Jakarta carry no Thai, so Thai glyphs fall through to the
     system Thai face per character. Nothing to switch — the browser does it. */
  --serif: 'Newsreader', 'Noto Serif Thai', 'Sukhumvit Set', Thonburi, 'Leelawadee UI', Georgia, serif;
  --sans: 'Jakarta', 'Noto Sans Thai', 'Sukhumvit Set', Thonburi, 'Leelawadee UI', ui-sans-serif, system-ui, -apple-system, sans-serif;

  --r: 10px;
  --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 18px 40px -24px rgba(0,0,0,.9);
}

*, *::before, *::after { box-sizing: border-box; }

body, .page {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 0.9375rem;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

.page {
  position: relative;
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
}
.page::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(120% 70% at 50% -18%, rgba(214,124,52,.22), transparent 62%),
    radial-gradient(80% 50% at 88% 6%, rgba(210,74,34,.10), transparent 70%),
    radial-gradient(70% 55% at 6% 92%, rgba(150,60,30,.07), transparent 72%);
  z-index: 0;
  animation: candle 11s ease-in-out infinite;
}
/* the room is lit by something with a flame in it */
@keyframes candle {
  0%, 100% { opacity: .88; }
  40%      { opacity: 1; }
  70%      { opacity: .93; }
}
.page::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .5;
  z-index: 1;
  background-image: var(--grain);
  background-size: 160px 160px;
}
.page > * { position: relative; z-index: 2; }

button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible {
  outline: 2px solid var(--campari-2);
  outline-offset: 2px;
  border-radius: 4px;
}

/* ---------- shell ---------- */

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 8px 20px;
  padding: 16px clamp(16px, 4vw, 40px) 12px;
  background: linear-gradient(to bottom, rgba(18,14,11,.97) 62%, rgba(18,14,11,0));
  backdrop-filter: blur(8px);
}
.wordmark {
  margin: 0;
  font-family: var(--serif);
  font-size: clamp(1.5rem, 3.4vw, 1.875rem);
  font-weight: 600;
  letter-spacing: -0.015em;
}
.wordmark .amp { color: var(--campari); }
.hours {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 0.6875rem;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--text-3);
}
/* the little sign in the window */
.live-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--campari-2);
  box-shadow: 0 0 0 0 rgba(240,102,58,.5);
  animation: sign 2.6s ease-out infinite;
}
@keyframes sign {
  0%   { box-shadow: 0 0 0 0 rgba(240,102,58,.55); }
  70%  { box-shadow: 0 0 0 7px rgba(240,102,58,0); }
  100% { box-shadow: 0 0 0 0 rgba(240,102,58,0); }
}

.langs {
  display: flex;
  gap: 2px;
  margin-left: auto;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--bg-2);
}
.lang {
  padding: 5px 12px;
  border: 0;
  border-radius: 999px;
  background: none;
  color: var(--text-3);
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: .06em;
  cursor: pointer;
  transition: color .18s, background-color .18s;
}
.lang:hover { color: var(--text-2); }
.lang[aria-pressed='true'] { background: var(--bg-3); color: var(--brass); }

.tabs {
  display: flex;
  gap: 2px;
  margin-left: 10px;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--bg-2);
}
.tab {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 6px 16px;
  border: 0;
  border-radius: 999px;
  background: none;
  color: var(--text-2);
  font-size: 0.8125rem;
  font-weight: 600;
  letter-spacing: .02em;
  cursor: pointer;
  transition: color .18s, background-color .18s;
}
.tab:hover { color: var(--text); }
.tab[aria-selected='true'] {
  background: var(--bg-3);
  color: var(--text);
  box-shadow: 0 1px 0 rgba(255,255,255,.04) inset;
}
.count {
  min-width: 19px;
  padding: 0 5px;
  border-radius: 999px;
  background: var(--campari);
  color: #fff;
  font-size: 0.6875rem;
  font-weight: 700;
  line-height: 19px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.count[hidden] { display: none; }
.count.pulse { animation: pulse .9s ease-out 2; }
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(210,74,34,0); }
  35%      { box-shadow: 0 0 0 6px rgba(210,74,34,.28); }
}

main { padding: clamp(20px, 4vw, 40px) clamp(16px, 4vw, 40px) 96px; }
.view[hidden] { display: none; }

.lede {
  max-width: 48ch;
  margin: 0 0 clamp(20px, 3vw, 28px);
  color: var(--text-2);
  font-size: 1rem;
}
.lede b { color: var(--text); font-weight: 600; }

.rule {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 4px 16px;
  margin: 46px 0 22px;
}
.rule::after {
  content: '';
  flex: 1 0 60px;
  height: 1px;
  align-self: center;
  background: linear-gradient(to right, var(--line-2), transparent);
}
.rule-title {
  font-family: var(--serif);
  font-size: clamp(1.5rem, 3vw, 1.875rem);
  font-weight: 600;
  line-height: 1.1;
  letter-spacing: -0.02em;
  color: var(--text);
}
.rule .sub {
  font-size: 0.6875rem;
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--brass);
}
.section[hidden] { display: none; }

/* ---------- filters ---------- */

.filters {
  display: grid;
  gap: 10px;
  padding: 0 0 20px;
  border-bottom: 1px solid var(--line);
}
/* on a phone the drinks come first; the controls stay a tap away */
.filter-toggle {
  display: none;
  align-items: center;
  gap: 7px;
  /* sized to match the filter pills it opens */
  padding: 6px 14px;
  border: 1px solid var(--line-2);
  border-radius: 999px;
  background: var(--bg-2);
  color: var(--text-2);
  font-size: 0.8125rem;
  font-weight: 600;
  cursor: pointer;
}
.filter-toggle .caret { transition: transform .22s; }
.filter-toggle[aria-expanded='true'] { color: var(--text); border-color: var(--text-3); }
.filter-toggle[aria-expanded='true'] .caret { transform: rotate(90deg); }
@media (max-width: 620px) {
  .filter-toggle { display: inline-flex; margin-bottom: 22px; }
  .filters.collapsed { display: none; }
  .filter-toggle[aria-expanded='true'] { margin-bottom: 16px; }
}
.filter-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.filter-label {
  flex: none;
  width: 6.5rem;
  padding-right: 8px;
  font-size: 0.625rem;
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--text-3);
}
@media (max-width: 620px) {
  .filter-label { width: 100%; padding: 4px 0 0; }
  .filter-row + .filter-row { margin-top: 6px; }
}
.pill {
  padding: 6px 14px;
  border: 1px solid var(--line-2);
  border-radius: 999px;
  background: var(--bg-2);
  color: var(--text-2);
  font-size: 0.8125rem;
  font-weight: 600;
  cursor: pointer;
  transition: color .18s, border-color .18s, background-color .18s;
}
.pill:hover:not(:disabled) { color: var(--text); border-color: #55432F; }
.pill:disabled { opacity: .3; cursor: default; }
.pill[aria-pressed='true'] {
  border-color: var(--campari);
  background: rgba(210,74,34,.16);
  color: #F6CDBC;
}
.pill.smoke-pill[aria-pressed='true'] {
  border-color: rgba(147,163,168,.6);
  background: rgba(147,163,168,.14);
  color: #D3DCDE;
}
.pill.long-pill[aria-pressed='true'] {
  border-color: rgba(210,162,76,.6);
  background: rgba(210,162,76,.13);
  color: #EBD3A0;
}
.filter-sep {
  width: 1px;
  height: 22px;
  background: var(--line-2);
  margin: 0 4px;
}
@media (max-width: 620px) {
  /* the pills wrap to several rows here, where a divider between them reads as debris */
  .filter-sep { display: none; }
}
.filter-count {
  margin-left: auto;
  font-size: 0.75rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
}

/* ---------- menu ---------- */

.menu {
  display: grid;
  gap: 16px;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 268px), 1fr));
}

.card {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 8px 18px 18px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: linear-gradient(to bottom, #1E1613 0%, #150F0D 62%);
  box-shadow: var(--shadow);
  text-align: center;
  cursor: pointer;
  transition: border-color .25s, transform .25s, box-shadow .25s;
  animation: light-up .55s cubic-bezier(.2,.75,.3,1) backwards;
  animation-delay: calc(var(--i, 0) * 45ms);
}
/* every drink lights its own card, in its own colour */
.card::before {
  content: '';
  position: absolute;
  z-index: 0;
  left: 50%;
  top: -46px;
  width: 250px;
  height: 250px;
  transform: translateX(-50%);
  border-radius: 50%;
  background: radial-gradient(circle at 50% 50%, var(--glow, transparent), transparent 62%);
  opacity: .8;
  pointer-events: none;
  transition: opacity .3s ease, transform .3s ease;
}
.card > * { position: relative; z-index: 1; }
.card:hover {
  border-color: var(--edge, var(--line-2));
  transform: translateY(-3px);
  box-shadow: var(--shadow), 0 0 34px -18px var(--edge, transparent);
}
.card:hover::before { opacity: 1; transform: translateX(-50%) scale(1.1); }
.card:hover .card-name { color: var(--campari-2); }
.card:hover .glass-art { transform: translateY(-4px) scale(1.05); }

@keyframes light-up {
  from { opacity: 0; transform: translateY(16px); }
}

.card-body { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; min-width: 0; }
.glass-art {
  width: 122px;
  height: 170px;
  margin-bottom: -6px;
  transition: transform .3s cubic-bezier(.2,.8,.3,1);
}
.glass-art svg { display: block; width: 100%; height: 100%; overflow: visible; }

.card-head { display: flex; flex-direction: column; gap: 3px; }
.card-name {
  font-family: var(--serif);
  font-size: 1.5rem;
  font-weight: 600;
  line-height: 1.1;
  letter-spacing: -0.02em;
  text-wrap: balance;
  transition: color .2s;
}
.card-meta {
  font-size: 0.625rem;
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--text-3);
}
.card-note {
  margin: 0;
  min-height: 3.9em;
  max-width: 30ch;
  color: var(--text-2);
  font-size: 0.8125rem;
  line-height: 1.5;
}

.profile { display: grid; gap: 5px; width: 100%; text-align: left; }
.profile-row {
  display: grid;
  grid-template-columns: 4.6rem 1fr;
  align-items: center;
  gap: 10px;
}
.profile-row span {
  font-size: 0.5625rem;
  font-weight: 700;
  letter-spacing: .13em;
  text-transform: uppercase;
  color: var(--text-3);
}
.sheet-body .profile { gap: 6px; }
.sheet-body .profile-row { grid-template-columns: 5.5rem 1fr; }
.sheet-body .profile-row span { font-size: 0.625rem; }
.track { height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
.fill {
  height: 100%;
  border-radius: 2px;
  background: linear-gradient(to right, rgba(210,162,76,.5), var(--brass));
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  align-self: flex-start;
  padding: 4px 10px 4px 8px;
  border: 1px solid var(--line-2);
  border-radius: 999px;
  background: var(--bg-3);
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: .04em;
  color: var(--text-2);
  white-space: nowrap;
}
.chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); }
.chip.smoke { color: var(--smoke); border-color: rgba(147,163,168,.3); }
.chip.smoke .dot { background: var(--smoke); }
.chip.egg { color: var(--brass); border-color: rgba(210,162,76,.3); }
.chip.egg .dot { background: var(--brass); }
.chip.poured { color: var(--poured); border-color: rgba(143,168,107,.3); }
.chip.poured .dot { background: var(--poured); }
.chip.low { color: var(--brass); border-color: rgba(210,162,76,.28); }
.chip.low .dot { background: var(--brass); }
.chip.na { color: #9CC3B0; border-color: rgba(156,195,176,.3); }
.chip.na .dot { background: #9CC3B0; }
.chip.warn { color: #E8A87C; border-color: rgba(232,168,124,.45); background: rgba(232,124,60,.1); }
.chip.warn .dot { background: #E8A87C; }

/* the one drink on the list that isn't what it looks like */
.warn-box {
  display: flex;
  gap: 12px;
  padding: 13px 15px;
  border: 1px solid rgba(232,168,124,.4);
  border-radius: 10px;
  background: rgba(232,124,60,.08);
  color: var(--text-2);
  font-size: 0.8125rem;
  line-height: 1.5;
}
.warn-box b { color: #F0BC97; font-weight: 600; }
.aside.warn-aside { box-shadow: inset 2px 0 0 #E8A87C; }

.card-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.card-chips .chip { align-self: center; }

/* can't decide — the button for that point in the evening, in its own frame
   so the filter rules below never run into it */
/* no frame — the crew sits straight on the page and the button stands on their bar */
.cta-row {
  display: flex;
  flex-direction: column;
  align-items: center;
  max-width: 540px;
  margin: 0 auto 26px;
}

/* three of them behind the bar, shaking */
.tenders { width: 100%; max-width: 510px; }
.tenders svg { display: block; width: 100%; height: auto; }
.tender-body {
  transform-box: fill-box;
  transform-origin: 50% 100%;
  animation: t-body var(--d) ease-in-out infinite alternate;
  animation-delay: var(--t);
}
.tender-arms {
  transform-box: fill-box;
  transform-origin: 33% 92%;
  animation: t-arms var(--d) ease-in-out infinite alternate;
  animation-delay: var(--t);
}
@keyframes t-arms {
  from { transform: rotate(-11deg) translateY(1px); }
  to   { transform: rotate(8deg) translateY(-2px); }
}
@keyframes t-body {
  from { transform: rotate(-2deg); }
  to   { transform: rotate(1.6deg) translateY(-1px); }
}
/* sits over the lower third of the scene, on the bar itself */
.choice {
  position: relative;
  z-index: 2;
  margin-top: -26px;
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 13px 26px;
  border: 1px solid rgba(255,196,168,.4);
  border-radius: 999px;
  background: linear-gradient(to bottom, #D8532A, #A93617);
  color: #fff;
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: .01em;
  cursor: pointer;
  box-shadow: 0 14px 30px -12px #000, 0 0 40px -14px rgba(240,102,58,.7);
  transition: background-color .2s, border-color .2s, transform .2s, box-shadow .2s;
}
.choice:hover {
  border-color: rgba(255,214,192,.7);
  background: linear-gradient(to bottom, #EA6234, #BC3D18);
  transform: translateY(-2px);
  box-shadow: 0 18px 34px -12px #000, 0 0 46px -12px rgba(240,102,58,.85);
}
.choice:active { transform: translateY(0); }
.choice .die {
  width: 15px;
  height: 15px;
  border: 1.5px solid currentColor;
  border-radius: 4px;
  position: relative;
  transition: transform .5s cubic-bezier(.2,.8,.3,1);
}
.choice .die::after {
  content: '';
  position: absolute;
  inset: 3.5px;
  border-radius: 50%;
  background: currentColor;
}
.choice:hover .die, .choice.rolling .die { transform: rotate(180deg); }
.cta-note { color: var(--text-3); font-size: 0.8125rem; }

.no-match {
  padding: 48px 24px;
  border: 1px dashed var(--line-2);
  border-radius: var(--r);
  text-align: center;
  color: var(--text-3);
}
.next-bottle {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 10px;
  align-items: baseline;
  margin-top: 44px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
  color: var(--text-3);
  font-size: 0.8125rem;
}
.next-bottle b {
  color: var(--brass);
  font-size: 0.625rem;
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;
}

/* ---------- order sheet ---------- */

dialog {
  width: min(560px, calc(100vw - 24px));
  max-height: min(88dvh, 900px);
  padding: 0;
  border: 1px solid var(--line-2);
  border-radius: 14px;
  background: var(--bg-2);
  color: var(--text);
  box-shadow: 0 40px 80px -30px #000;
}
dialog::backdrop { background: rgba(8,5,4,.72); backdrop-filter: blur(3px); }
dialog[open] { animation: rise .22s cubic-bezier(.2,.8,.3,1); }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }

.sheet { display: flex; flex-direction: column; max-height: inherit; }
.sheet-head {
  position: relative;
  display: flex;
  gap: 18px;
  align-items: center;
  padding: 22px 56px 20px 24px;
  border-bottom: 1px solid var(--line);
  overflow: hidden;
}
.sheet-head::before {
  content: '';
  position: absolute;
  inset: -60% -10% auto -10%;
  height: 200%;
  pointer-events: none;
  background: radial-gradient(50% 45% at 22% 55%, rgba(210,120,50,.18), transparent 70%);
}
.sheet-head > * { position: relative; }
.preview {
  flex: none;
  width: 108px;
  height: 152px;
}
.preview svg { display: block; width: 100%; height: 100%; overflow: visible; }
.sheet-close {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 3;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  padding: 0;
  border: 1px solid var(--line-2);
  border-radius: 50%;
  background: rgba(18,14,11,.55);
  color: var(--text-2);
  cursor: pointer;
  transition: color .18s, border-color .18s, background-color .18s;
}
.sheet-close:hover { color: var(--text); border-color: var(--text-3); background: var(--bg-3); }
.sheet-close svg { display: block; width: 15px; height: 15px; }

.sheet-title {
  margin: 6px 0 8px;
  font-family: var(--serif);
  font-size: clamp(1.625rem, 5vw, 2rem);
  font-weight: 600;
  line-height: 1.05;
  letter-spacing: -0.02em;
  text-wrap: balance;
}
.sheet-body { display: grid; gap: 20px; padding: 22px 24px; overflow-y: auto; }
.sheet-foot {
  display: flex;
  gap: 10px;
  padding: 16px 24px 20px;
  border-top: 1px solid var(--line);
  background: var(--bg-2);
}

.story {
  margin: 0;
  padding-left: 14px;

  var TENDER_SKIN = '#150E0A';

  function tender(cfg) {
    var flip = cfg.flip ? -1 : 1;
    var g = s('g', {

    body.style.setProperty('--d', cfg.dur + 's');
    body.style.setProperty('--t', cfg.delay + 's');

       the near arm and tin in front. Sharing one group turned them into mush. */
    function swingGroup() {
      var pivot = s('g', { transform: 'translate(0,-44)' });
      var g2 = s('g', { class: 'tender-arms' });
      g2.style.setProperty('--d', cfg.dur + 's');
      g2.style.setProperty('--t', cfg.delay + 's');
      pivot.appendChild(g2);
      return { pivot: pivot, inner: g2 };
    }

    /* far arm — drawn first so the torso and head sit over it */
    var far = swingGroup();
    far.inner.appendChild(s('path', {
      d: 'M-13,3 C-2,1 12,-6 20,-28', fill: 'none', stroke: TENDER_SKIN,

    far.inner.appendChild(s('path', {

      'stroke-width': '1', 'stroke-linecap': 'round', opacity: '.45'
    }));
    body.appendChild(far.pivot);

    /* torso, from the counter up — sloped shoulders, or it reads as a slab */
    body.appendChild(s('path', {
      d: 'M-18,0 L-17,-25 Q-16,-37 -7.5,-42 Q-3.5,-44 0,-44 Q3.5,-44 7.5,-42 Q16,-37 17,-25 L18,0 Z',
      fill: TENDER_SKIN, stroke: TENDER_EDGE, 'stroke-width': '1.1', 'stroke-linejoin': 'round'
    }));
    /* apron */
    body.appendChild(s('path', {
      d: 'M-12,0 L-12,-15 Q0,-19 12,-15 L12,0',
      fill: 'none', stroke: 'rgba(224,178,104,.26)', 'stroke-width': '1.1', 'stroke-linejoin': 'round'
    }));
    /* bow tie — the one spot of colour on each of them */
    body.appendChild(s('path', {
      d: 'M-6,-43.5 L-0.9,-40 L-0.9,-36.5 L-6,-33 Z M6,-43.5 L0.9,-40 L0.9,-36.5 L6,-33 Z',
      fill: cfg.tie
    }));
    body.appendChild(s('rect', { x: '-1.6', y: '-40.4', width: '3.2', height: '4.4', rx: '1', fill: cfg.tie }));
    /* neck + head */
    body.appendChild(s('rect', { x: '-3.6', y: '-51', width: '7.2', height: '9', fill: TENDER_SKIN }));
    body.appendChild(s('circle', {
      cx: '0', cy: '-59', r: '10.5',
      fill: TENDER_SKIN, stroke: TENDER_EDGE, 'stroke-width': '1.1'
    }));
    body.appendChild(s('path', {
      d: cfg.hair, fill: TENDER_SKIN, stroke: TENDER_EDGE, 'stroke-width': '1.1', 'stroke-linejoin': 'round'
    }));

    /* near arm, tin and hands — in front of everything */
    var near = swingGroup();
    var arms = near.inner;

    arms.appendChild(s('path', {
      d: 'M13,2 Q23,-6 25,-18', fill: 'none', stroke: TENDER_SKIN,
      'stroke-width': '8.5', 'stroke-linecap': 'round'
    }));
    arms.appendChild(s('path', {
      d: 'M13,2 Q23,-6 25,-18', fill: 'none', stroke: TENDER_EDGE,
      'stroke-width': '1', 'stroke-linecap': 'round', opacity: '.45'
    }));

    /* the tin, held up and clear of the face — a Boston tin, wider at the mouth */
    arms.appendChild(s('path', {
      d: 'M21.5,-16 L30.5,-16 L33,-40 L19,-40 Z',
      fill: 'url(#tinGrad)', stroke: 'rgba(242,218,176,.55)', 'stroke-width': '1', 'stroke-linejoin': 'round'
    }));
    arms.appendChild(s('path', {
      d: 'M19.6,-36.5 L32.4,-36.5', stroke: 'rgba(255,238,206,.4)', 'stroke-width': '1.1'
    }));
    arms.appendChild(s('path', {
      d: 'M24,-19 L25.6,-37', stroke: 'rgba(255,238,206,.5)', 'stroke-width': '1.5', 'stroke-linecap': 'round'
    }));

    /* hands on the tin */
    arms.appendChild(s('circle', { cx: '26', cy: '-19', r: '4.3', fill: TENDER_SKIN, stroke: TENDER_EDGE, 'stroke-width': '1' }));
    arms.appendChild(s('circle', { cx: '23', cy: '-32', r: '4.1', fill: TENDER_SKIN, stroke: TENDER_EDGE, 'stroke-width': '1' }));

    body.appendChild(near.pivot);
    g.appendChild(body);
    return g;
  }

      { x: 278, y: 115, scale: 0.87, dur: 0.49, delay: -0.36, flip: true, tie: '#93A3A8', hair: 'M-10.5,-61 Q-9,-72 0,-70.5 Q9,-69 10.5,-63 Q5,-67 -3,-66 Q-8,-65.5 -10.5,-61 Z' }

  function artBox(cls, drink, opts, mode) {
    var box = el('div', cls);
    box.appendChild(drawGlass(drink, opts, mode));
    return box;
  }

  /* ---------- menu ---------- */

  /* The filters are the same five meters printed on every card: four flavors,
     plus strength as "how heavy". Nobody needs to know a spirit to order. */
  var TASTES = {
    bitter: function (d) { return d.flavor.bitter >= 4; },
    sweet: function (d) { return d.flavor.sweet >= 4 || (d.flavor.sweet >= 3 && d.flavor.bitter <= 1); },
    citrus: function (d) { return d.flavor.citrus >= 4; },
    herbal: function (d) { return d.flavor.herbal >= 4; }
  };
  var HEAVY = {
    none: function (d) { return !!d.na; },
    light: function (d) { return !d.na && d.flavor.strength <= 2; },
    mid: function (d) { return d.flavor.strength === 3; },
    strong: function (d) { return d.flavor.strength >= 4; }
  };

  var filters = { taste: 'any', heavy: 'any', spirit: 'all', smoke: false };

  function passes(d, f) {
    if (f.taste !== 'any' && !TASTES[f.taste](d)) return false;
    if (f.heavy !== 'any' && !HEAVY[f.heavy](d)) return false;
    if (f.spirit !== 'all' && d.spirits.indexOf(f.spirit) === -1) return false;
    if (f.smoke && !d.smoke) return false;
    return true;
  }

  function matches(d) { return passes(d, filters); }

  /* how many drinks would be left if this one control changed */
  function countWith(key, value) {
    var trial = { taste: filters.taste, heavy: filters.heavy, spirit: filters.spirit, smoke: filters.smoke };
    trial[key] = value;
    return DRINKS.filter(function (d) { return passes(d, trial); }).length;
  }

  function rows() {
    return [
      {
        key: 'taste', label: U('row_taste'), any: 'any',
        options: [
          { id: 'any', label: U('any') },
          { id: 'bitter', label: U('taste_bitter') },
          { id: 'sweet', label: U('taste_sweet') },
          { id: 'citrus', label: U('taste_citrus') },
          { id: 'herbal', label: U('taste_herbal') }
        ]
      },
      {
        key: 'heavy', label: U('row_heavy'), any: 'any',
        options: [
          { id: 'any', label: U('any_heavy') },
          { id: 'none', label: U('heavy_none') },
          { id: 'light', label: U('heavy_light') },
          { id: 'mid', label: U('heavy_mid') },
          { id: 'strong', label: U('heavy_strong') }
        ]
      },
      {
        key: 'spirit', label: U('row_spirit'), any: 'all',
        options: [{ id: 'all', label: U('any') }].concat(SPIRITS.map(function (s) {
          return { id: s.id, label: U('sp_' + s.id) };
        }))
      }
    ];
  }

  function renderFilters() {
    var bar = $('#filters');
    bar.innerHTML = '';

    rows().forEach(function (rowDef) {
      var row = el('div', 'filter-row');
      row.appendChild(el('span', 'filter-label', rowDef.label));

      rowDef.options.forEach(function (opt) {
        var b = el('button', 'pill', opt.label);
        b.type = 'button';
        /* three rows each offer "Anything" — the row has to be in the name */
        b.setAttribute('aria-label', rowDef.label + ': ' + opt.label);
        b.setAttribute('aria-pressed', filters[rowDef.key] === opt.id ? 'true' : 'false');
        /* a control that would empty the list is a dead end — grey it out */
        if (opt.id !== rowDef.any && countWith(rowDef.key, opt.id) === 0) b.disabled = true;
        b.addEventListener('click', function () {
          filters[rowDef.key] = opt.id;
          renderFilters();
          renderMenu();
        });
        row.appendChild(b);
      });

      if (rowDef.key === 'spirit') {
        row.appendChild(el('span', 'filter-sep'));
        var smokeBtn = el('button', 'pill smoke-pill', U('takes_smoke'));
        smokeBtn.type = 'button';
        smokeBtn.setAttribute('aria-pressed', filters.smoke ? 'true' : 'false');
        if (!filters.smoke && countWith('smoke', true) === 0) smokeBtn.disabled = true;
        smokeBtn.addEventListener('click', function () {
          filters.smoke = !filters.smoke;
          renderFilters();
          renderMenu();
        });
        row.appendChild(smokeBtn);

        var n = DRINKS.filter(matches).length;
        row.appendChild(el('span', 'filter-count', n + ' ' + (n === 1 ? U('count_one') : U('count_many'))));
      }

      bar.appendChild(row);
    });
  }

  function drinkCard(drink, index) {
    var card = el('button', 'card');
    card.type = 'button';
    card.setAttribute('aria-label', drink.name);
    card.style.setProperty('--glow', glowOf(drink.color, 0.4));
    card.style.setProperty('--edge', glowOf(drink.color, 0.55));
    card.style.setProperty('--i', String(index));

    card.appendChild(artBox('glass-art', drink, {}, 'live'));

    var body = el('div', 'card-body');
    var head = el('div', 'card-head');
    head.appendChild(el('div', 'card-name', drink.name));
    head.appendChild(el('div', 'card-meta', drink.base + ' · ' + drink.method));
    body.appendChild(head);

    body.appendChild(el('p', 'card-note', drink.hook || drink.note));
    body.appendChild(profileEl(drink));

    var chips = el('div', 'card-chips');
    chips.appendChild(drink.smoke
      ? chip('smoke', drink.best ? U('chip_smoke_best') : U('chip_smoke') + woodLabel(drink.woods[0]))
      : chip('', U('chip_no_smoke')));
    if (drink.low) chips.appendChild(chip('low', U('chip_low')));
    if (drink.na && !drink.warning) chips.appendChild(chip('na', U('chip_na')));
    if (drink.warning) chips.appendChild(chip('warn', U('chip_warn')));
    if (drink.egg) chips.appendChild(chip('egg', U('chip_egg_opt')));
    body.appendChild(chips);
    card.appendChild(body);

    card.addEventListener('click', function () { openSheet(drink); });
    return card;
  }

  function renderMenu() {
    var body = $('#menu-body');
    body.innerHTML = '';
    var shown = 0;

    SECTIONS.forEach(function (sec) {
      var list = DRINKS.filter(function (d) { return d.section === sec.id && matches(d); });
      if (!list.length) return;

      body.appendChild(ruleEl(U('sec_' + sec.id), U('sec_' + sec.id + '_sub')));

      var grid = el('div', 'menu');
      list.forEach(function (d, i) { grid.appendChild(drinkCard(d, shown + i)); });
      body.appendChild(grid);
      shown += list.length;
    });

    if (!shown) {
      var none = el('div', 'no-match');
      none.appendChild(el('div', null, U('no_match')));
      var reset = el('button', 'link-btn', U('show_all'));
      reset.type = 'button';
      reset.style.marginTop = '10px';
      reset.addEventListener('click', function () {
        filters = { taste: 'any', heavy: 'any', spirit: 'all', smoke: false };
        renderFilters();
        renderMenu();
      });
      none.appendChild(reset);
      body.appendChild(none);
    }
  }

  function openSheet(drink) {
    sheet.innerHTML = '';

    var state = { smoke: false, egg: false, wood: drink.woods ? drink.woods[0] : null };

    var form = el('form', 'sheet');
    form.method = 'dialog';

    /* head — the drink, drawn */
    var head = el('div', 'sheet-head');

    var close = el('button', 'sheet-close');
    close.type = 'button';
    close.setAttribute('aria-label', U('close'));
    var x = s('svg', { viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor',
      'stroke-width': '2.4', 'stroke-linecap': 'round' });
    x.appendChild(s('path', { d: 'M6 6 L18 18 M18 6 L6 18' }));
    close.appendChild(x);
    close.addEventListener('click', function () { sheet.close(); });
    head.appendChild(close);

    var preview = artBox('preview', drink, state, 'pour');
    head.appendChild(preview);

    var headText = el('div');
    headText.appendChild(el('div', 'card-meta', drink.base + ' · ' + drink.method));
    var h2 = el('h2', 'sheet-title', drink.name);
    h2.id = 'sheet-title';
    headText.appendChild(h2);
    headText.appendChild(el('p', 'card-note', drink.hook || drink.note));
    head.appendChild(headText);
    form.appendChild(head);

    /* the method lives below the options and follows them — tick smoke and
       step one becomes smoking the glass */
    function redraw() {
      var next = drawGlass(drink, state, 'pour');
      preview.innerHTML = '';
      preview.appendChild(next);
    }

    /* body */
    var body = el('div', 'sheet-body');

    if (drink.story) {
      var storyField = el('div', 'field');
      storyField.appendChild(el('div', 'label', U('the_story')));
      storyField.appendChild(el('p', 'story', drink.story));
      body.appendChild(storyField);
    }

    if (drink.warning) {
      var warn = el('div', 'warn-box');
      warn.appendChild(el('b', null, U('heads_up')));
      warn.appendChild(document.createTextNode(drink.warning));
      body.appendChild(warn);
    }

    var whatField = el('div', 'field');
    whatField.appendChild(el('div', 'label', U('whats_in_it')));
    whatField.appendChild(buildList(drink));
    body.appendChild(whatField);

    var tasteField = el('div', 'field');
    tasteField.appendChild(el('div', 'label', U('tastes_like')));
    tasteField.appendChild(profileEl(drink));
    body.appendChild(tasteField);

    if (drink.smoke) {
      var block = el('div');
      var smokeRow = optionRow('smoke', U('smoke_it'), drink.smokeNote);
      var smokeInput = $('input', smokeRow);
      block.appendChild(smokeRow);

      var woods = el('div', 'woods');
      woods.hidden = true;
      woods.appendChild(el('div', 'label', U('wood')));
      var row = el('div', 'wood-row');
      var note = el('p', 'wood-note', woodNote(state.wood));

      drink.woods.forEach(function (w) {
        var b = el('button', 'wood', woodLabel(w));
        b.type = 'button';
        b.setAttribute('data-wood', w);
        b.setAttribute('aria-pressed', w === state.wood ? 'true' : 'false');
        b.addEventListener('click', function () {
          state.wood = w;
          Array.prototype.forEach.call(row.children, function (c) {
            c.setAttribute('aria-pressed', c.getAttribute('data-wood') === w ? 'true' : 'false');
          });
          note.textContent = woodNote(w);
          redraw(); /* step one names the wood */
        });
        row.appendChild(b);
      });
      woods.appendChild(row);
      woods.appendChild(note);
      block.appendChild(woods);

      smokeInput.addEventListener('change', function () {
        state.smoke = smokeInput.checked;
        woods.hidden = !smokeInput.checked;
        redraw();
      });
      body.appendChild(block);
    } else {
      var no = el('div', 'no-smoke');
      no.appendChild(el('b', null, U('no_smoke_here')));
      no.appendChild(document.createTextNode(drink.noSmoke));
      body.appendChild(no);
    }

    if (drink.egg) {
      var eggRow = optionRow('egg', U('egg_white'), U('egg_why'));
      var eggInput = $('input', eggRow);
      eggInput.addEventListener('change', function () {
        state.egg = eggInput.checked;
        redraw();
      });
      body.appendChild(eggRow);
    }

    redraw();

    var nameField = el('div', 'field');
    nameField.appendChild(el('div', 'label', U('your_name')));
    var nameInput = el('input');
    nameInput.type = 'text';
    nameInput.placeholder = U('name_ph');
    nameInput.value = guestName();
    nameInput.maxLength = 40;
    nameField.appendChild(nameInput);
    body.appendChild(nameField);

    var noteField = el('div', 'field');
    noteField.appendChild(el('div', 'label', U('anything_else')));
    var noteInput = el('textarea');
    noteInput.placeholder = U('note_ph');
    noteInput.maxLength = 200;
    noteField.appendChild(noteInput);
    body.appendChild(noteField);

    form.appendChild(body);

    var foot = el('div', 'sheet-foot');
    var send = el('button', 'btn btn-primary', U('send'));
    send.type = 'submit';
    foot.appendChild(send);
    form.appendChild(foot);

    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var who = nameInput.value.trim();
      if (!who) {
        nameInput.focus();
        nameInput.placeholder = U('name_ph_err');
        return;
      }
      rememberGuest(who);
      placeOrder({
        id: 'o' + Date.now() + Math.random().toString(36).slice(2, 6),
        drink: drink.id,
        guest: who,
        smoke: state.smoke,
        wood: state.smoke ? state.wood : null,
        egg: state.egg,
        note: noteInput.value.trim(),
        at: Date.now(),
        done: false
      });
      sheet.close();
      toast(U('toast_ordered') + drink.name + U('toast_for') + who, drink, state);
    });

    sheet.appendChild(form);
    sheet.showModal();
    /* focus without scrolling, then pin the body to the top — otherwise the
       browser scrolls the focused field into view and the drink's name and
       glass are already off-screen when the sheet opens */
    var coarse = window.matchMedia('(hover: none)').matches;
    if (!coarse) (nameInput.value ? send : nameInput).focus({ preventScroll: true });
    body.scrollTop = 0;
    requestAnimationFrame(function () { body.scrollTop = 0; });
  }

  function placeOrder(order) {
    orders.unshift(order);
    save();
    renderOrders(true);
    push(order);
  }

  /* ---------- orders ---------- */

  function ticketEl(order) {
    var drink = byId[order.drink];
    if (!drink) return null;

    var wrap = el('article', 'ticket' + (order.smoke ? ' smoked' : '') + (order.done ? ' done' : ''));
    var main = el('div', 'ticket-main');

    var pour = el('button', 'pour');
    pour.type = 'button';
    pour.setAttribute('role', 'checkbox');
    pour.setAttribute('aria-checked', order.done ? 'true' : 'false');
    pour.setAttribute('aria-label', (order.done ? U('toast_back') : U('toast_poured') + drink.name) +
      U('toast_for') + order.guest);
    pour.addEventListener('click', function () {
      order.done = !order.done;
      order.doneAt = order.done ? Date.now() : null;
      save();
      renderOrders();
      if (order.pending) push(order); else pushDone(order);
      toast(order.done ? U('toast_poured') + drink.name + U('toast_for') + order.guest : U('toast_back'),
        drink, { smoke: order.smoke, egg: order.egg });
    });
    main.appendChild(pour);

    main.appendChild(artBox('ticket-art', drink, { smoke: order.smoke, egg: order.egg }, 'static'));

    var text = el('div', 'ticket-text');

    var line = el('div', 'ticket-line');
    line.appendChild(el('span', 'ticket-drink', drink.name));
    line.appendChild(el('span', 'ticket-guest', order.guest));
    var when = el('span', 'ticket-when', ago(order.at));
    when.setAttribute('data-at', order.at);
    line.appendChild(when);
    text.appendChild(line);

    var chips = el('div', 'ticket-chips');
    chips.appendChild(order.smoke
      ? chip('smoke', U('chip_smoked') + woodLabel(order.wood || drink.woods[0]))
      : chip('', drink.smoke ? U('chip_no_smoke') : drink.method));
    if (order.egg) chips.appendChild(chip('egg', U('chip_egg')));
    if (order.done) chips.appendChild(chip('poured', U('chip_poured')));
    text.appendChild(chips);

    if (order.note) text.appendChild(el('p', 'ticket-note', order.note));

    main.appendChild(text);
    wrap.appendChild(main);

    var panelId = 'build-' + order.id;
    var toggle = el('button', 'build-toggle');
    toggle.type = 'button';
    toggle.setAttribute('aria-expanded', 'false');
    toggle.setAttribute('aria-controls', panelId);
    toggle.appendChild(el('span', 'caret', '›'));
    toggle.appendChild(document.createTextNode(U('the_build')));

    var panel = el('div', 'build-panel');
    panel.id = panelId;
    panel.hidden = true;

    panel.appendChild(buildList(drink));
    panel.appendChild(stepsList(drink, { smoke: order.smoke, egg: order.egg, wood: order.wood }));

    if (order.smoke) {
      var wood = order.wood || drink.woods[0];
      var sm = el('div', 'aside smoke-aside');
      sm.appendChild(el('div', 'aside-label', U('aside_smoke') + woodLabel(wood)));
      sm.appendChild(el('div', null, woodNote(wood)));
      panel.appendChild(sm);
    }
    if (drink.warning) {
      var wn = el('div', 'aside warn-aside');
      wn.appendChild(el('div', 'aside-label', U('aside_warn')));
      wn.appendChild(el('div', null, drink.warning));
      panel.appendChild(wn);
    }
    if (drink.tip) {
      var tp = el('div', 'aside tip-aside');
      tp.appendChild(el('div', 'aside-label', U('aside_tip')));
      tp.appendChild(el('div', null, drink.tip));
      panel.appendChild(tp);
    }

    toggle.addEventListener('click', function () {
      var open = toggle.getAttribute('aria-expanded') === 'true';
      toggle.setAttribute('aria-expanded', open ? 'false' : 'true');
      panel.hidden = open;
    });

    wrap.appendChild(toggle);
    wrap.appendChild(panel);
    return wrap;
  }

  function renderOrders(isNew) {
    var body = $('#orders-body');
    body.innerHTML = '';

    var working = orders.filter(function (o) { return !o.done; });
    var poured = orders.filter(function (o) { return o.done; });

    $('#tally-working').textContent = working.length;
    $('#tally-poured').textContent = poured.length;

    var badge = $('#pending-count');
    badge.textContent = working.length;
    badge.hidden = working.length === 0;
    if (isNew && working.length > lastPending && $('#tab-orders').getAttribute('aria-selected') !== 'true') {
      badge.classList.remove('pulse');
      void badge.offsetWidth;
      badge.classList.add('pulse');
    }
    lastPending = working.length;

    if (!orders.length) {
      var empty = el('div', 'empty');
      empty.appendChild(el('div', 'empty-title', U('bar_quiet')));
      empty.appendChild(el('div', null, U('bar_quiet_sub')));
      body.appendChild(empty);
      return;
    }

    if (working.length) {
      var w = ruleEl(U('on_the_rail'));
      w.style.marginTop = '0';
      body.appendChild(w);
      var wl = el('div', 'tickets');
      working.forEach(function (o) {
        var t = ticketEl(o);
        if (t) wl.appendChild(t);
      });
      body.appendChild(wl);
    }

    if (poured.length) {
      var p = ruleEl(U('poured_title'));
      if (!working.length) p.style.marginTop = '0';
      var clear = el('button', 'link-btn', U('clear'));
      clear.type = 'button';
      clear.addEventListener('click', function () {
        orders = orders.filter(function (o) { return !o.done; });
        save();
        renderOrders();
        pushClear();
      });
      var sub = el('span', 'sub');
      sub.appendChild(clear);
      p.appendChild(sub);
      body.appendChild(p);
      var pl = el('div', 'tickets');
      poured.forEach(function (o) {
        var t = ticketEl(o);
        if (t) pl.appendChild(t);
      });
      body.appendChild(pl);
    }
  }

  /* ---------- tabs ---------- */

  function showTab(which) {
    var isMenu = which === 'menu';
    $('#tab-menu').setAttribute('aria-selected', isMenu ? 'true' : 'false');
    $('#tab-orders').setAttribute('aria-selected', isMenu ? 'false' : 'true');
    $('#view-menu').hidden = !isMenu;
    $('#view-orders').hidden = isMenu;
    if (!isMenu) $('#pending-count').classList.remove('pulse');
    window.scrollTo({ top: 0, behavior: 'instant' });
  }
  $('#tab-menu').addEventListener('click', function () { showTab('menu'); });
  $('#tab-orders').addEventListener('click', function () { showTab('orders'); });

  /* ---------- bartender's choice ---------- */

  var filterToggle = $('#filter-toggle');
  filterToggle.addEventListener('click', function () {
    var open = filterToggle.getAttribute('aria-expanded') === 'true';
    filterToggle.setAttribute('aria-expanded', open ? 'false' : 'true');
    $('#filters').classList.toggle('collapsed', open);
  });

  var choice = $('#choice');
  choice.addEventListener('click', function () {
    var pool = DRINKS.filter(matches);
    if (!pool.length) return;
    choice.classList.add('rolling');
    setTimeout(function () { choice.classList.remove('rolling'); }, 500);
    openSheet(pool[Math.floor(Math.random() * pool.length)]);
  });

  /* ---------- grain + tick marks ---------- */

  function makeGrain() {
    var size = 160;
    var c = document.createElement('canvas');
    c.width = c.height = size;
    var ctx = c.getContext('2d');
    var img = ctx.createImageData(size, size);
    for (var i = 0; i < img.data.length; i += 4) {
      var v = 120 + Math.random() * 135;
      img.data[i] = v;
      img.data[i + 1] = v * 0.92;
      img.data[i + 2] = v * 0.8;
      img.data[i + 3] = Math.random() * 13;
    }
    ctx.putImageData(img, 0, 0);
    document.documentElement.style.setProperty('--grain', 'url(' + c.toDataURL() + ')');
  }

  function tick(color) {
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="' + color +
      '" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
    return 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")';
  }

  /* ---------- go ---------- */

  document.documentElement.style.setProperty('--tick', tick('#12100F'));
  document.documentElement.style.setProperty('--tick-dark', tick('#141109'));
  makeGrain();

  $('#lang-en').addEventListener('click', function () { if (lang !== 'en') setLang('en'); });
  $('#lang-th').addEventListener('click', function () { if (lang !== 'th') setLang('th'); });

  load();
  applyLang();
  paintStatic();
  paintSync();
  renderTenders();
  renderFilters();
  renderMenu();
  renderOrders();

  setInterval(function () {
    Array.prototype.forEach.call(document.querySelectorAll('.ticket-when'), function (n) {
      n.textContent = ago(Number(n.getAttribute('data-at')));
    });
  }, 30000);

  window.addEventListener('storage', function (e) {
    if (e.key === ORDERS_KEY) { load(); renderOrders(true); }
  });

  /* the shared book: read it now, then keep an eye on it */
  if (shared) {
    paintSync();
    pull();
    setInterval(pull, 3000);
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) pull();
    });
  }
})();
</script>
